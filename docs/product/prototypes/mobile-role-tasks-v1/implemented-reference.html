<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>岗位任务端当前列表基线</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf1f4;
        --panel: #ffffff;
        --panel-soft: #f7f9fa;
        --text: #17212b;
        --muted: #637080;
        --line: #dde3e8;
        --green: #147d69;
        --green-soft: #eaf7f3;
        --orange: #d97706;
        --orange-soft: #fff7e8;
        --red: #c9362b;
        --red-soft: #fff1f0;
        --blue: #2563eb;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      button {
        color: inherit;
        font: inherit;
      }

      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--blue) 28%, transparent);
        outline-offset: 2px;
      }

      .stage {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 22px;
      }

      .phone {
        position: relative;
        display: grid;
        width: min(430px, 100%);
        height: min(900px, calc(100vh - 44px));
        min-height: 650px;
        grid-template-rows: minmax(0, 1fr) auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel-soft);
        box-shadow: 0 24px 70px rgb(15 23 42 / 18%);
      }

      .scroll-area {
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .header {
        position: sticky;
        z-index: 4;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        padding: 16px 18px 12px;
        backdrop-filter: blur(10px);
      }

      .header h1,
      .header p,
      .section-title h2 {
        margin: 0;
      }

      .header h1 {
        font-size: 22px;
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .role-pill,
      .count-tag,
      .status-chip {
        display: inline-flex;
        min-height: 23px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 750;
      }

      .role-pill,
      .count-tag {
        background: var(--green-soft);
        color: var(--green);
      }

      .refresh {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 0 11px;
        cursor: pointer;
        font-weight: 700;
      }

      .content {
        padding: 12px 12px 28px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        margin-bottom: 12px;
        padding: 14px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .section-title h2 {
        font-size: 16px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .metric {
        display: grid;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px 8px;
        text-align: center;
      }

      .metric strong {
        font-size: 19px;
      }

      .metric span {
        color: var(--muted);
        font-size: 12px;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
        margin-bottom: 12px;
      }

      .filter {
        min-width: 0;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        cursor: pointer;
        padding: 0 6px;
        font-weight: 700;
      }

      .filter.active {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
      }

      .filter .count-tag {
        min-width: 20px;
        min-height: 20px;
        margin-left: 3px;
        padding: 0 5px;
      }

      .task-list {
        display: grid;
        gap: 8px;
      }

      .task-row,
      .message-card,
      .account-card {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel);
        text-align: left;
      }

      .task-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        cursor: pointer;
        padding: 12px;
      }

      .task-row:hover,
      .task-row[aria-current="true"] {
        border-color: var(--green);
        box-shadow: inset 3px 0 0 var(--green);
      }

      .task-title {
        font-weight: 800;
      }

      .task-source,
      .task-meta,
      .task-owner,
      .due {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .task-owner {
        color: var(--text);
      }

      .task-side {
        display: grid;
        align-content: space-between;
        justify-items: end;
        gap: 12px;
      }

      .status-chip {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--muted);
        white-space: nowrap;
      }

      .status-chip.risk {
        border-color: #fed7aa;
        background: var(--orange-soft);
        color: var(--orange);
      }

      .status-chip.overdue {
        border-color: #fecaca;
        background: var(--red-soft);
        color: var(--red);
      }

      .due.overdue {
        color: var(--red);
        font-weight: 750;
      }

      .load-more {
        width: 100%;
        min-height: 40px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: transparent;
        color: var(--green);
        cursor: pointer;
        margin-top: 10px;
        font-weight: 750;
      }

      .selection-notice {
        position: sticky;
        z-index: 3;
        bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--green) 55%, var(--line));
        border-radius: 10px;
        background: var(--green-soft);
        color: var(--green);
        margin-top: 12px;
        padding: 10px 12px;
        box-shadow: 0 12px 32px rgb(15 23 42 / 14%);
        font-size: 13px;
        font-weight: 700;
      }

      .selection-notice[hidden] {
        display: none;
      }

      .selection-notice button {
        min-height: 30px;
        border: 1px solid color-mix(in srgb, var(--green) 55%, var(--line));
        border-radius: 7px;
        background: var(--panel);
        cursor: pointer;
        white-space: nowrap;
      }

      .bottom-nav {
        z-index: 5;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 95%, transparent);
        padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
        backdrop-filter: blur(10px);
      }

      .nav-button {
        min-height: 48px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 750;
      }

      .nav-button.active {
        background: var(--green-soft);
        color: var(--green);
      }

      .message-card,
      .account-card {
        margin-bottom: 8px;
        padding: 12px;
      }

      .account-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .account-card span,
      .account-card strong {
        display: block;
      }

      .account-card span {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 7px;
        background: var(--line);
      }

      .skeleton::after {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 55%), transparent);
        animation: shimmer 1.1s infinite;
        transform: translateX(-100%);
      }

      @keyframes shimmer {
        to { transform: translateX(100%); }
      }

      .skeleton-row {
        height: 104px;
        margin-bottom: 8px;
      }

      .empty {
        display: grid;
        min-height: 220px;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101820;
          --panel: #19232d;
          --panel-soft: #202d39;
          --text: #f1f5f9;
          --muted: #a8b3c0;
          --line: #344453;
          --green: #45c5aa;
          --green-soft: #173d37;
          --orange-soft: #452f16;
          --red-soft: #452327;
        }
      }

      @media (max-width: 460px) {
        .stage {
          padding: 0;
        }

        .phone {
          width: 100%;
          height: 100vh;
          min-height: 0;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="岗位任务端当前列表基线">
        <div class="scroll-area" id="scrollArea">
          <header class="header">
            <div>
              <h1 id="pageTitle">待办</h1>
              <div class="header-meta"><span class="role-pill">仓库</span><span id="syncText">最后同步：12:14</span></div>
            </div>
            <button class="refresh" id="refreshButton" type="button">↻ 刷新</button>
          </header>
          <div class="content" id="content" aria-live="polite"></div>
        </div>
        <nav class="bottom-nav" aria-label="岗位任务端主导航">
          <button class="nav-button active" type="button" data-tab="todo">待办</button>
          <button class="nav-button" type="button" data-tab="done">已办</button>
          <button class="nav-button" type="button" data-tab="messages">消息</button>
          <button class="nav-button" type="button" data-tab="mine">我的</button>
        </nav>
      </section>
    </main>

    <script>
      const tasks = [
        { id: "task-inbound-031", title: "成品入库确认", source: "PR-202608-031", meta: "产品：云朵小熊 ｜ 数量：600 只", ownerRole: "仓库", status: "已阻塞", tone: "overdue", due: "今天 14:30", approval: false, listView: "todo" },
        { id: "task-rework-021", title: "成品返工处理", source: "SO-202608-021", meta: "客户：星河礼品 ｜ 数量：600 只", ownerRole: "仓库", status: "待处理", tone: "risk", due: "今天 15:00", approval: false, listView: "todo" },
        { id: "task-receivable-006", title: "应收登记", source: "AR-202608-006", meta: "客户：晨光百货 ｜ 金额：¥ 28,600", ownerRole: "财务", status: "已超时", tone: "overdue", due: "昨天 17:30", approval: false, listView: "todo" },
        { id: "task-picking-014", title: "生产领料审核", source: "MO-202608-014", meta: "产品：泰迪熊 ｜ 数量：1,000 只", ownerRole: "仓库", status: "待审批", tone: "", due: "明天 11:00", approval: true, listView: "todo" },
        { id: "task-quality-011", title: "成品抽检待处理", source: "QI-202608-011", meta: "客户：晨光百货 ｜ 数量：600 只", ownerRole: "品质", status: "待处理", tone: "risk", due: "明天 10:00", approval: false, listView: "todo" },
        { id: "task-inbound-028", title: "物料入库确认", source: "PO-202608-028", meta: "物料：PP 棉 ｜ 数量：120 包", ownerRole: "仓库", status: "待处理", tone: "", due: "周五 09:30", approval: false, listView: "todo" },
        { id: "task-inbound-done-026", title: "仓库入库确认", source: "PR-202608-026", meta: "物料：水洗棉 ｜ 数量：80 包", ownerRole: "仓库", status: "已完成", tone: "", due: "04/26 16:20", approval: false, listView: "done" },
        { id: "task-returned-024", title: "包装破损来料确认", source: "PR-202608-024", meta: "物料：短毛绒 ｜ 数量：12 卷", ownerRole: "仓库", status: "已退回", tone: "risk", due: "04/26 15:10", approval: false, listView: "done" },
      ];

      const content = document.querySelector("#content");
      const pageTitle = document.querySelector("#pageTitle");
      const syncText = document.querySelector("#syncText");
      const refreshButton = document.querySelector("#refreshButton");
      const scrollArea = document.querySelector("#scrollArea");
      const navButtons = Array.from(document.querySelectorAll("[data-tab]"));
      let activeTab = "todo";
      let activeFilter = "all";
      let visibleLimit = 4;
      let selectedTaskId = "";
      let refreshing = false;

      function todoTasks() {
        return tasks.filter((task) => task.listView === "todo");
      }

      function filteredTasks() {
        const currentTasks = todoTasks();
        if (activeFilter === "approval") return currentTasks.filter((task) => task.approval);
        if (activeFilter === "risk") return currentTasks.filter((task) => task.tone);
        if (activeFilter === "overdue") return currentTasks.filter((task) => task.tone === "overdue");
        return currentTasks;
      }

      function taskCard(task) {
        const selected = task.id === selectedTaskId;
        return `<button class="task-row" type="button" data-task-id="${task.id}" aria-current="${selected ? "true" : "false"}">
          <div>
            <div class="task-title">${task.title}</div>
            <div class="task-source">${task.source}</div>
            <div class="task-meta">${task.meta}</div>
            <div class="task-owner">责任岗位：${task.ownerRole}</div>
          </div>
          <div class="task-side">
            <span class="status-chip ${task.tone}">${task.status}</span>
            <span class="due ${task.tone}">${task.due}</span>
          </div>
        </button>`;
      }

      function renderTodo() {
        const currentTasks = todoTasks();
        const matching = filteredTasks();
        const visible = matching.slice(0, visibleLimit);
        const selectedTask = tasks.find((task) => task.id === selectedTaskId);
        return `<section class="metrics" aria-label="待办摘要">
            <div class="metric"><strong>${currentTasks.length}</strong><span>待处理</span></div>
            <div class="metric"><strong style="color:var(--orange)">${currentTasks.filter((task) => task.tone).length}</strong><span>风险</span></div>
            <div class="metric"><strong style="color:var(--red)">${currentTasks.filter((task) => task.tone === "overdue").length}</strong><span>超时</span></div>
          </section>
          <div class="filters" aria-label="待办筛选">
            <button class="filter ${activeFilter === "all" ? "active" : ""}" type="button" data-filter="all">全部 <span class="count-tag">${currentTasks.length}</span></button>
            <button class="filter ${activeFilter === "approval" ? "active" : ""}" type="button" data-filter="approval">审批 <span class="count-tag">${currentTasks.filter((task) => task.approval).length}</span></button>
            <button class="filter ${activeFilter === "risk" ? "active" : ""}" type="button" data-filter="risk">风险 <span class="count-tag">${currentTasks.filter((task) => task.tone).length}</span></button>
            <button class="filter ${activeFilter === "overdue" ? "active" : ""}" type="button" data-filter="overdue">超时 <span class="count-tag">${currentTasks.filter((task) => task.tone === "overdue").length}</span></button>
          </div>
          <div class="task-list">${visible.length ? visible.map(taskCard).join("") : '<div class="empty">当前筛选没有待办</div>'}</div>
          ${matching.length > 4 ? `<button class="load-more" type="button" data-load-more>${visibleLimit < matching.length ? `展开更多（剩余 ${matching.length - visible.length} 条）` : "收起任务"}</button>` : ""}
          <aside class="selection-notice" ${selectedTask ? "" : "hidden"} role="status">
            <span>${selectedTask ? `已选择：${selectedTask.title}` : ""}</span>
            <button type="button" data-continue>进入任务</button>
          </aside>`;
      }

      function renderDone() {
        const completedTasks = tasks.filter((task) => task.listView === "done");
        return `<section class="panel"><div class="section-title"><h2>已办任务</h2><span class="count-tag">${completedTasks.length}</span></div><div class="task-list">${completedTasks.map(taskCard).join("")}</div></section>`;
      }

      function renderMessages() {
        return `<section class="panel"><div class="section-title"><h2>提醒</h2><span class="count-tag">2</span></div>
          <div class="message-card"><strong>入库任务已阻塞</strong><p class="muted">请关注 PR-202608-031 的后续处理。</p></div>
          <div class="message-card"><strong>应收登记已超时</strong><p class="muted">责任岗位：财务</p></div></section>`;
      }

      function renderMine() {
        return `<section class="panel"><div class="section-title"><h2>仓库值班员</h2><span class="role-pill">仓库</span></div>
          <div class="account-grid"><div class="account-card"><span>账号岗位</span><strong>仓库</strong></div><div class="account-card"><span>可用入口</span><strong>电脑端 / 手机待办</strong></div></div></section>`;
      }

      function renderLoading() {
        return `<section aria-label="正在刷新"><div class="metrics"><div class="metric skeleton"></div><div class="metric skeleton"></div><div class="metric skeleton"></div></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></section>`;
      }

      function render() {
        pageTitle.textContent = { todo: "待办", done: "已办", messages: "消息", mine: "我的" }[activeTab];
        navButtons.forEach((button) => button.classList.toggle("active", button.dataset.tab === activeTab));
        if (refreshing) {
          content.innerHTML = renderLoading();
          return;
        }
        content.innerHTML = { todo: renderTodo, done: renderDone, messages: renderMessages, mine: renderMine }[activeTab]();
      }

      content.addEventListener("click", (event) => {
        const filterButton = event.target.closest("[data-filter]");
        if (filterButton) {
          activeFilter = filterButton.dataset.filter;
          visibleLimit = 4;
          selectedTaskId = "";
          render();
          return;
        }
        const loadMore = event.target.closest("[data-load-more]");
        if (loadMore) {
          visibleLimit = visibleLimit < filteredTasks().length ? filteredTasks().length : 4;
          render();
          return;
        }
        const taskButton = event.target.closest("[data-task-id]");
        if (taskButton) {
          selectedTaskId = taskButton.dataset.taskId;
          render();
          requestAnimationFrame(() => content.querySelector(`[data-task-id="${selectedTaskId}"]`)?.focus({ preventScroll: true }));
          return;
        }
        if (event.target.closest("[data-continue]")) {
          const task = tasks.find((item) => item.id === selectedTaskId);
          event.target.closest("[data-continue]").textContent = task ? "进入任务详情" : "进入任务";
        }
      });

      navButtons.forEach((button) => button.addEventListener("click", () => {
        activeTab = button.dataset.tab;
        selectedTaskId = "";
        scrollArea.scrollTop = 0;
        render();
      }));

      refreshButton.addEventListener("click", () => {
        if (refreshing) return;
        refreshing = true;
        refreshButton.disabled = true;
        render();
        window.setTimeout(() => {
          refreshing = false;
          refreshButton.disabled = false;
          syncText.textContent = "刚刚同步";
          render();
          refreshButton.focus({ preventScroll: true });
        }, 700);
      });

      render();
    </script>
  </body>
</html>
