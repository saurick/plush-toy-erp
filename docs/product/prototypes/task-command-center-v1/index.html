<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务看板中心样板</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f5f7;
        --panel: #ffffff;
        --panel-soft: #f8fafb;
        --text: #1f2937;
        --muted: #667085;
        --line: #e4e7ec;
        --line-strong: #cfd5dc;
        --green: #16836f;
        --green-soft: #edf8f5;
        --blue: #2563eb;
        --blue-soft: #eff6ff;
        --orange: #c96b08;
        --orange-soft: #fff7e8;
        --red: #c9362b;
        --red-soft: #fff1f0;
        --shadow: 0 10px 30px rgb(15 23 42 / 8%);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--blue) 28%, transparent);
        outline-offset: 2px;
      }

      .page {
        width: min(1500px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 20px 0 28px;
      }

      .page-head,
      .filters,
      .queue-panel,
      .detail-panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 12px;
        padding: 18px 20px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      .page-head p,
      .muted {
        color: var(--muted);
      }

      .page-head p {
        margin-top: 5px;
      }

      .category-grid {
        display: grid;
        min-width: min(620px, 58vw);
        grid-template-columns: repeat(4, minmax(110px, 1fr));
        gap: 8px;
      }

      .category-wrap {
        display: grid;
        justify-items: end;
        gap: 6px;
      }

      .all-categories {
        min-height: 28px;
        border: 0;
        background: transparent;
        color: var(--green);
        cursor: pointer;
        padding: 0 4px;
        font-size: 12px;
        font-weight: 750;
      }

      .category {
        display: grid;
        min-height: 66px;
        align-content: center;
        justify-items: start;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-soft);
        cursor: pointer;
        padding: 8px 12px;
        text-align: left;
      }

      .category strong {
        font-size: 20px;
      }

      .category span {
        color: var(--muted);
        font-size: 12px;
      }

      .category[aria-pressed="true"] {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
      }

      .filters {
        display: grid;
        grid-template-columns: minmax(220px, 1.6fr) repeat(3, minmax(150px, 0.8fr)) auto;
        gap: 10px;
        margin-bottom: 12px;
        padding: 12px;
      }

      input,
      select,
      .button {
        min-width: 0;
        min-height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--panel);
        padding: 0 11px;
      }

      .button {
        cursor: pointer;
        font-weight: 680;
      }

      .button.primary {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      .workspace {
        display: grid;
        min-height: 620px;
        grid-template-columns: minmax(420px, 0.92fr) minmax(520px, 1.08fr);
        gap: 12px;
      }

      .queue-panel,
      .detail-panel {
        min-width: 0;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 13px 16px;
      }

      .panel-head h2 {
        font-size: 17px;
      }

      .count {
        display: inline-flex;
        min-width: 24px;
        min-height: 24px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        padding: 0 7px;
        font-size: 12px;
        font-weight: 800;
      }

      .queue {
        display: grid;
        max-height: 690px;
        gap: 8px;
        overflow-y: auto;
        padding: 10px;
      }

      .task-card {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        cursor: pointer;
        padding: 12px;
        text-align: left;
      }

      .task-card:hover,
      .task-card[aria-selected="true"] {
        border-color: var(--green);
        box-shadow: inset 3px 0 0 var(--green);
      }

      .task-card h3 {
        font-size: 15px;
      }

      .task-code,
      .task-meta,
      .task-due {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .task-side {
        display: grid;
        align-content: space-between;
        justify-items: end;
        gap: 10px;
      }

      .status {
        display: inline-flex;
        min-height: 25px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-soft);
        color: var(--muted);
        padding: 0 8px;
        font-size: 12px;
        font-weight: 750;
        white-space: nowrap;
      }

      .status.risk {
        border-color: #fed7aa;
        background: var(--orange-soft);
        color: var(--orange);
      }

      .status.blocked {
        border-color: #fecaca;
        background: var(--red-soft);
        color: var(--red);
      }

      .detail-scroll {
        max-height: 690px;
        overflow-y: auto;
        padding: 16px;
      }

      .empty {
        display: grid;
        min-height: 400px;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      .detail-summary {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .detail-summary h2 {
        font-size: 20px;
      }

      .detail-summary p {
        margin-top: 5px;
        color: var(--muted);
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .detail-field,
      .section {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
      }

      .detail-field {
        padding: 10px 11px;
      }

      .detail-field span,
      .detail-field strong {
        display: block;
      }

      .detail-field span {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .section {
        margin-top: 10px;
        padding: 13px;
      }

      .section h3 {
        margin-bottom: 7px;
        font-size: 14px;
      }

      .section p {
        color: var(--muted);
        line-height: 1.6;
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .timeline {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .timeline li {
        position: relative;
        border-left: 2px solid var(--line);
        padding-left: 12px;
      }

      .timeline strong,
      .timeline span {
        display: block;
      }

      .timeline span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .handoff {
        display: grid;
        gap: 5px;
        border: 1px solid color-mix(in srgb, var(--green) 50%, var(--line));
        border-radius: 9px;
        background: var(--green-soft);
        color: var(--green);
        margin-top: 12px;
        padding: 11px 12px;
      }

      .handoff[hidden] {
        display: none;
      }

      .handoff span {
        font-size: 12px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --panel: #18212f;
          --panel-soft: #202b3a;
          --text: #f3f4f6;
          --muted: #aab4c3;
          --line: #344054;
          --line-strong: #475467;
          --green: #45c5aa;
          --green-soft: #173d37;
          --blue-soft: #1d304e;
          --orange-soft: #452f16;
          --red-soft: #452327;
        }
      }

      @media (max-width: 1050px) {
        .page-head {
          flex-direction: column;
        }

        .category-grid {
          width: 100%;
          min-width: 0;
        }

        .filters {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .filters input {
          grid-column: 1 / -1;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .queue,
        .detail-scroll {
          max-height: none;
        }
      }

      @media (max-width: 620px) {
        .page {
          width: calc(100vw - 16px);
          padding: 8px 0 16px;
        }

        .category-grid,
        .filters,
        .detail-grid {
          grid-template-columns: 1fr 1fr;
        }

        .filters input {
          grid-column: 1 / -1;
        }

        .task-card {
          grid-template-columns: 1fr;
        }

        .task-side {
          grid-template-columns: auto 1fr;
          justify-items: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <div>
          <h1>任务看板</h1>
          <p>先判断当前职责，再进入统一任务处理流程。</p>
        </div>
        <div class="category-wrap">
          <div class="category-grid" id="categories" aria-label="任务分类"></div>
          <button class="all-categories" id="allCategories" type="button">查看全部分类</button>
        </div>
      </header>

      <section class="filters" aria-label="任务筛选">
        <input id="searchInput" type="search" placeholder="搜索任务、来源单号或业务摘要" />
        <select id="statusFilter" aria-label="按状态筛选"><option value="">全部状态</option><option value="待处理">待处理</option><option value="已阻塞">已阻塞</option><option value="已完成">已完成</option></select>
        <select id="roleFilter" aria-label="按责任岗位筛选"><option value="">全部岗位</option><option value="仓库">仓库</option><option value="品质">品质</option><option value="财务">财务</option></select>
        <select id="sourceFilter" aria-label="按业务来源筛选"><option value="">全部来源</option><option value="采购">采购</option><option value="质检">质检</option><option value="财务">财务</option><option value="生产">生产</option></select>
        <button class="button" id="clearFilters" type="button">清空筛选</button>
      </section>

      <div class="workspace">
        <section class="queue-panel" aria-labelledby="queueTitle">
          <header class="panel-head"><h2 id="queueTitle">当前任务</h2><span class="count" id="resultCount">0</span></header>
          <div class="queue" id="queue" role="listbox" aria-label="任务队列"></div>
        </section>
        <aside class="detail-panel" aria-labelledby="detailTitle">
          <header class="panel-head"><h2 id="detailTitle">当前详情</h2><span class="muted">只读核对</span></header>
          <div class="detail-scroll" id="detail"></div>
        </aside>
      </div>
    </main>

    <script>
      const tasks = [
        { id: "task-1", title: "物料入库确认", code: "PR-202608-031", summary: "PP 棉 120 包等待仓库核对", ownerRole: "仓库", status: "已阻塞", tone: "blocked", due: "今天 14:30", sourceGroup: "采购", sourceLabel: "采购收货单 PR-202608-031", category: "blocked", reason: "到货数量与送货单不一致，需要采购确认。", guidance: "先核对差异说明；问题解除后再进入处理。", actions: "解除阻塞、催办", events: [["仓库标记阻塞", "今天 11:06 · 等待采购确认"], ["任务创建", "今天 09:18 · 来源为采购收货单"]] },
        { id: "task-2", title: "成品返工处理", code: "SO-202608-021", summary: "云朵小熊 600 只等待返工确认", ownerRole: "仓库", status: "待处理", tone: "risk", due: "今天 15:00", sourceGroup: "生产", sourceLabel: "销售订单 SO-202608-021", category: "risk", reason: "生产已反馈返工完成，等待仓库核对。", guidance: "核对成品数量和标识后选择处理方式。", actions: "完成、阻塞、催办", events: [["生产反馈返工完成", "今天 12:20"], ["任务创建", "昨天 16:40"]] },
        { id: "task-3", title: "成品抽检待处理", code: "QI-202608-011", summary: "晨光百货订单 600 只等待抽检", ownerRole: "品质", status: "待处理", tone: "risk", due: "明天 10:00", sourceGroup: "质检", sourceLabel: "品质检验 QI-202608-011", category: "due", reason: "当前任务由品质岗位负责。", guidance: "其他岗位可查看；处理入口按当前账号可用操作决定。", actions: "查看", events: [["任务创建", "今天 08:30"]] },
        { id: "task-4", title: "应收登记", code: "AR-202608-006", summary: "晨光百货应收 ¥28,600 已超时", ownerRole: "财务", status: "待处理", tone: "blocked", due: "昨天 17:30", sourceGroup: "财务", sourceLabel: "应收登记 AR-202608-006", category: "due", reason: "登记截止时间已过，当前仅允许查看和催办。", guidance: "需要财务岗位继续办理，其他岗位不能代办。", actions: "催办", events: [["系统标记超时", "昨天 17:30"], ["任务创建", "昨天 09:00"]] },
        { id: "task-5", title: "生产领料审核", code: "MO-202608-014", summary: "泰迪熊 1,000 只领料申请", ownerRole: "仓库", status: "待处理", tone: "", due: "明天 11:00", sourceGroup: "生产", sourceLabel: "生产单 MO-202608-014", category: "normal", reason: "领料申请等待仓库核对。", guidance: "核对领料明细和可用库存后选择处理方式。", actions: "完成、阻塞、退回、催办", events: [["申请提交", "今天 10:42"], ["任务创建", "今天 10:41"]] },
        { id: "task-6", title: "仓库入库确认", code: "PR-202608-026", summary: "水洗棉 80 包已完成核对", ownerRole: "仓库", status: "已完成", tone: "", due: "04/26 16:20", sourceGroup: "采购", sourceLabel: "采购收货单 PR-202608-026", category: "normal", reason: "当前任务已完成，只读查看处理记录。", guidance: "如需调整业务结果，请回到对应业务页面。", actions: "查看", events: [["仓库完成任务", "04/26 16:18"], ["任务创建", "04/26 14:10"]] },
      ];

      const categories = [
        { key: "normal", label: "常规 / 只读" },
        { key: "risk", label: "风险" },
        { key: "blocked", label: "阻塞" },
        { key: "due", label: "到期 / 超时" },
      ];
      const elements = {
        categories: document.querySelector("#categories"), allCategories: document.querySelector("#allCategories"), queue: document.querySelector("#queue"), detail: document.querySelector("#detail"), resultCount: document.querySelector("#resultCount"),
        search: document.querySelector("#searchInput"), status: document.querySelector("#statusFilter"), role: document.querySelector("#roleFilter"), source: document.querySelector("#sourceFilter"), clear: document.querySelector("#clearFilters"),
      };
      let activeCategory = "all";
      let selectedTaskId = "";

      function categoryCount(key) {
        if (key === "all") return tasks.length;
        return tasks.filter((task) => task.category === key).length;
      }

      function filteredTasks() {
        const query = elements.search.value.trim().toLowerCase();
        return tasks.filter((task) => {
          if (activeCategory !== "all" && task.category !== activeCategory) return false;
          if (elements.status.value && task.status !== elements.status.value) return false;
          if (elements.role.value && task.ownerRole !== elements.role.value) return false;
          if (elements.source.value && task.sourceGroup !== elements.source.value) return false;
          if (query && !`${task.title} ${task.code} ${task.summary} ${task.sourceLabel}`.toLowerCase().includes(query)) return false;
          return true;
        });
      }

      function renderCategories() {
        elements.categories.innerHTML = categories.map((category) => `<button class="category" type="button" data-category="${category.key}" aria-pressed="${activeCategory === category.key}"><strong>${categoryCount(category.key)}</strong><span>${category.label}</span></button>`).join("");
      }

      function taskCard(task) {
        return `<button class="task-card" type="button" role="option" data-task-id="${task.id}" aria-selected="${task.id === selectedTaskId}">
          <div><h3>${task.title}</h3><div class="task-code">${task.code}</div><div class="task-meta">${task.summary}</div></div>
          <div class="task-side"><span class="status ${task.tone}">${task.status}</span><span class="task-due">${task.due}</span></div>
        </button>`;
      }

      function renderQueue({ preserveSelection = true } = {}) {
        const results = filteredTasks();
        if (!preserveSelection || !results.some((task) => task.id === selectedTaskId)) selectedTaskId = results[0]?.id || "";
        elements.resultCount.textContent = String(results.length);
        elements.queue.innerHTML = results.length ? results.map(taskCard).join("") : '<div class="empty">当前组合筛选没有任务</div>';
        renderDetail();
      }

      function renderDetail() {
        const task = tasks.find((item) => item.id === selectedTaskId);
        if (!task) {
          elements.detail.innerHTML = '<div class="empty">请选择一条任务</div>';
          return;
        }
        elements.detail.innerHTML = `<div class="detail-summary"><div><h2>${task.title}</h2><p>${task.code} · ${task.sourceLabel}</p></div><span class="status ${task.tone}">${task.status}</span></div>
          <div class="detail-grid"><div class="detail-field"><span>责任岗位</span><strong>${task.ownerRole}</strong></div><div class="detail-field"><span>截止时间</span><strong>${task.due}</strong></div><div class="detail-field"><span>当前可用</span><strong>${task.actions}</strong></div></div>
          <section class="section"><h3>为什么现在要看</h3><p>${task.reason}</p></section>
          <section class="section"><h3>处理提示</h3><p>${task.guidance}</p></section>
          <div class="detail-actions"><button class="button primary" type="button" data-open-flow>${task.status === "已完成" ? "查看处理记录" : "进入处理流程"}</button><button class="button" type="button" data-open-source>查看相关单据</button></div>
          <div class="handoff" data-handoff hidden><strong>任务上下文已就绪</strong><span>后续核对、选择处理方式、提交与结果回执由“任务处理动作流程”专用原型统一定义。</span></div>
          <section class="section"><h3>最近协同记录</h3><ol class="timeline">${task.events.map((event) => `<li><strong>${event[0]}</strong><span>${event[1]}</span></li>`).join("")}</ol></section>`;
      }

      function renderAll(options) {
        renderCategories();
        renderQueue(options);
      }

      elements.categories.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = activeCategory === button.dataset.category ? "all" : button.dataset.category;
        renderAll({ preserveSelection: false });
      });

      elements.allCategories.addEventListener("click", () => {
        activeCategory = "all";
        renderAll({ preserveSelection: false });
      });

      elements.queue.addEventListener("click", (event) => {
        const button = event.target.closest("[data-task-id]");
        if (!button) return;
        selectedTaskId = button.dataset.taskId;
        renderQueue();
        requestAnimationFrame(() => elements.queue.querySelector(`[data-task-id="${selectedTaskId}"]`)?.focus({ preventScroll: true }));
      });

      elements.queue.addEventListener("keydown", (event) => {
        const current = event.target.closest("[data-task-id]");
        if (!current) return;
        const buttons = Array.from(elements.queue.querySelectorAll("[data-task-id]"));
        const index = buttons.indexOf(current);
        let nextIndex = index;
        if (event.key === "ArrowDown") nextIndex = Math.min(buttons.length - 1, index + 1);
        else if (event.key === "ArrowUp") nextIndex = Math.max(0, index - 1);
        else if (event.key === "Home") nextIndex = 0;
        else if (event.key === "End") nextIndex = buttons.length - 1;
        else if (event.key === "Enter") {
          event.preventDefault();
          elements.detail.querySelector("[data-open-flow]")?.click();
          return;
        } else return;
        event.preventDefault();
        buttons[nextIndex]?.click();
      });

      elements.detail.addEventListener("click", (event) => {
        if (event.target.closest("[data-open-flow]")) {
          const handoff = elements.detail.querySelector("[data-handoff]");
          handoff.hidden = false;
          handoff.focus?.({ preventScroll: true });
        }
        if (event.target.closest("[data-open-source]")) event.target.closest("[data-open-source]").textContent = "相关单据入口已核对";
      });

      [elements.search, elements.status, elements.role, elements.source].forEach((control) => control.addEventListener(control === elements.search ? "input" : "change", () => renderQueue({ preserveSelection: false })));
      elements.clear.addEventListener("click", () => {
        elements.search.value = "";
        elements.status.value = "";
        elements.role.value = "";
        elements.source.value = "";
        activeCategory = "all";
        renderAll({ preserveSelection: false });
        elements.search.focus({ preventScroll: true });
      });

      renderAll({ preserveSelection: false });
    </script>
  </body>
</html>
