<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>业务详情弹窗样板</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #fafafa;
        --text: #1f2937;
        --muted: #667085;
        --line: #e5e7eb;
        --line-strong: #d0d5dd;
        --green: #16836f;
        --green-soft: #edf8f5;
        --blue: #1677ff;
        --red: #d92d20;
        --red-soft: #fef3f2;
        --shadow: 0 24px 64px rgb(15 23 42 / 22%);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      button {
        min-height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        padding: 0 13px;
        font: inherit;
        font-weight: 650;
      }

      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--blue) 28%, transparent);
        outline-offset: 2px;
      }

      button.primary {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      .page {
        width: min(1280px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .page-head,
      .list-shell {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 2px 10px rgb(15 23 42 / 5%);
      }

      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
        padding: 18px 20px;
      }

      .page-head h1,
      .page-head p {
        margin: 0;
      }

      .page-head h1 {
        margin-bottom: 4px;
        font-size: 22px;
      }

      .page-head p,
      .muted {
        color: var(--muted);
      }

      .list-shell {
        overflow: hidden;
      }

      .list-toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 14px 18px;
      }

      .list-table {
        display: grid;
        grid-template-columns: 1.1fr 1.4fr 1fr 0.8fr;
      }

      .list-table > span {
        min-width: 0;
        border-bottom: 1px solid var(--line);
        padding: 13px 18px;
      }

      .list-table > span:nth-child(-n + 4) {
        background: var(--panel-soft);
        color: var(--muted);
        font-weight: 700;
      }

      dialog {
        width: min(1120px, calc(100vw - 48px));
        max-height: calc(100vh - 48px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        padding: 0;
        box-shadow: var(--shadow);
      }

      dialog[open] {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      dialog::backdrop {
        background: rgb(17 24 39 / 48%);
        backdrop-filter: blur(2px);
      }

      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid var(--line);
        padding: 18px 22px 14px;
      }

      .modal-title,
      .modal-description {
        margin: 0;
      }

      .modal-title {
        font-size: 20px;
        line-height: 1.4;
      }

      .modal-description {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .close {
        width: 34px;
        min-height: 34px;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
        font-size: 28px;
        line-height: 1;
      }

      .modal-body {
        overflow: auto;
        padding: 18px 22px 24px;
      }

      .review-states {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        background: var(--panel-soft);
        margin-bottom: 18px;
        padding: 8px 10px;
      }

      .review-states strong {
        margin-right: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .review-states button {
        min-height: 28px;
        padding: 0 9px;
        font-size: 12px;
      }

      .review-states button[aria-pressed="true"] {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
      }

      .descriptions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .description-item {
        display: grid;
        grid-template-columns: minmax(88px, 38%) minmax(0, 1fr);
        min-width: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .description-item dt,
      .description-item dd {
        min-width: 0;
        margin: 0;
        padding: 10px 11px;
        overflow-wrap: anywhere;
      }

      .description-item dt {
        background: var(--panel-soft);
        color: var(--muted);
        font-weight: 650;
      }

      .description-item dd {
        font-weight: 620;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        height: 1px;
        flex: 1;
        content: "";
        background: var(--line);
      }

      .divider::before {
        max-width: 16px;
      }

      .items {
        display: grid;
        gap: 10px;
      }

      .item-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .item-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--panel-soft);
        padding: 10px 12px;
      }

      .item-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .item-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 12px;
      }

      .item-grid div {
        min-width: 0;
      }

      .item-grid dt,
      .item-grid dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .item-grid dt {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .item-grid dd {
        font-weight: 650;
      }

      .state-box {
        display: grid;
        min-height: 150px;
        place-items: center;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .state-box.error {
        border-color: #fda29b;
        background: var(--red-soft);
        color: var(--red);
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid var(--line);
        border-top-color: var(--green);
        border-radius: 50%;
        margin: 0 auto 10px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .pagination {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 12px;
      }

      .pagination button {
        min-width: 34px;
        padding: 0 8px;
      }

      .pagination button[aria-current="page"] {
        border-color: var(--green);
        color: var(--green);
      }

      .modal-foot {
        display: flex;
        justify-content: flex-end;
        border-top: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 12px 22px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --panel: #18212f;
          --panel-soft: #202b3a;
          --text: #f3f4f6;
          --muted: #aab4c3;
          --line: #344054;
          --line-strong: #475467;
          --green: #42c3a7;
          --green-soft: #173d37;
          --red-soft: #3d2427;
        }
      }

      @media (max-width: 820px) {
        dialog {
          width: calc(100vw - 24px);
          max-height: calc(100vh - 24px);
        }

        .descriptions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .item-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .page {
          width: calc(100vw - 16px);
          padding: 8px 0;
        }

        .page-head,
        .list-toolbar,
        .modal-head {
          align-items: stretch;
          flex-direction: column;
        }

        .list-table {
          grid-template-columns: 1fr 1fr;
        }

        .list-table > span:nth-child(n + 3):nth-child(-n + 4),
        .list-table > span:nth-child(n + 7) {
          display: none;
        }

        dialog {
          width: 100vw;
          max-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        .modal-head,
        .modal-body,
        .modal-foot {
          padding-right: 14px;
          padding-left: 14px;
        }

        .modal-head {
          position: relative;
          padding-right: 50px;
        }

        .close {
          position: absolute;
          top: 14px;
          right: 12px;
        }

        .descriptions,
        .item-grid {
          grid-template-columns: 1fr;
        }

        .description-item {
          grid-template-columns: 112px minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <div>
          <h1>销售订单</h1>
          <p>选择一条记录后查看完整只读信息。</p>
        </div>
        <button class="primary" id="openDetails" type="button">查看详情</button>
      </header>
      <section class="list-shell" aria-label="销售订单列表背景">
        <div class="list-toolbar"><strong>当前记录：SO-202608-018</strong><span class="muted">已提交</span></div>
        <div class="list-table">
          <span>订单号</span><span>客户</span><span>负责人</span><span>状态</span>
          <span>SO-202608-018</span><span>星河礼品</span><span>销售一组</span><span>已提交</span>
        </div>
      </section>
    </main>

    <dialog id="detailsDialog" aria-labelledby="detailsTitle" aria-describedby="detailsDescription">
      <header class="modal-head">
        <div>
          <h2 class="modal-title" id="detailsTitle">销售订单详情 · SO-202608-018</h2>
          <p class="modal-description" id="detailsDescription">以下信息只读；需要修改时请关闭后使用列表中的“编辑”。</p>
        </div>
        <button class="close" id="closeIcon" type="button" aria-label="关闭详情">×</button>
      </header>

      <div class="modal-body">
        <div class="review-states" role="group" aria-label="原型评审状态（非运行态字段）">
          <strong>原型评审状态（非运行态字段）</strong>
          <button type="button" data-state="items" aria-pressed="true">有明细</button>
          <button type="button" data-state="empty" aria-pressed="false">空明细</button>
          <button type="button" data-state="loading" aria-pressed="false">加载中</button>
          <button type="button" data-state="error" aria-pressed="false">加载失败</button>
        </div>

        <dl class="descriptions" aria-label="订单基本信息">
          <div class="description-item"><dt>订单号</dt><dd>SO-202608-018</dd></div>
          <div class="description-item"><dt>客户</dt><dd>星河礼品</dd></div>
          <div class="description-item"><dt>状态</dt><dd>已提交</dd></div>
          <div class="description-item"><dt>联系人</dt><dd>陈经理</dd></div>
          <div class="description-item"><dt>负责人</dt><dd>销售一组</dd></div>
          <div class="description-item"><dt>交付日期</dt><dd>2026-09-10</dd></div>
          <div class="description-item"><dt>结算方式</dt><dd>月结 30 天</dd></div>
          <div class="description-item"><dt>币种</dt><dd>CNY</dd></div>
          <div class="description-item"><dt>客户订单号</dt><dd>-</dd></div>
        </dl>

        <div class="divider" id="itemsTitle">完整明细（共 12 条）</div>
        <section id="itemsRegion" aria-labelledby="itemsTitle" aria-live="polite"></section>
      </div>

      <footer class="modal-foot">
        <button id="closeDetails" type="button">关闭</button>
      </footer>
    </dialog>

    <script>
      const dialog = document.querySelector("#detailsDialog");
      const openButton = document.querySelector("#openDetails");
      const closeButtons = [document.querySelector("#closeIcon"), document.querySelector("#closeDetails")];
      const stateButtons = Array.from(document.querySelectorAll("[data-state]"));
      const itemsRegion = document.querySelector("#itemsRegion");
      const itemsTitle = document.querySelector("#itemsTitle");
      let currentState = "items";
      let currentPage = 1;

      const items = Array.from({ length: 12 }, (_, index) => ({
        name: index % 2 ? "云朵小熊" : "星星挂件",
        sku: index % 2 ? "35cm / 奶茶色" : "12cm / 米白色",
        quantity: index % 2 ? "300 只" : "500 只",
        price: index % 2 ? "¥ 38.00" : "¥ 12.50",
      }));

      function itemCard(item, index) {
        return `
          <article class="item-card">
            <header class="item-head"><strong>明细 ${index + 1}</strong><span>${item.name}</span></header>
            <dl class="item-grid">
              <div><dt>产品</dt><dd>${item.name}</dd></div>
              <div><dt>规格 / SKU</dt><dd>${item.sku}</dd></div>
              <div><dt>数量</dt><dd>${item.quantity}</dd></div>
              <div><dt>含税单价</dt><dd>${item.price}</dd></div>
            </dl>
          </article>`;
      }

      function renderItems() {
        itemsTitle.textContent = `完整明细（共 ${currentState === "empty" ? 0 : items.length} 条）`;
        if (currentState === "loading") {
          itemsRegion.innerHTML = '<div class="state-box"><div><div class="spinner" aria-hidden="true"></div><strong>正在加载明细…</strong></div></div>';
          return;
        }
        if (currentState === "error") {
          itemsRegion.innerHTML = '<div class="state-box error"><div><strong>加载明细失败</strong><p>请检查网络后重试。</p><button type="button" data-retry>重试</button></div></div>';
          itemsRegion.querySelector("[data-retry]").addEventListener("click", () => {
            currentState = "loading";
            syncStateButtons();
            renderItems();
            window.setTimeout(() => {
              currentState = "items";
              syncStateButtons();
              renderItems();
            }, 650);
          });
          return;
        }
        if (currentState === "empty") {
          itemsRegion.innerHTML = '<div class="state-box"><div><strong>当前记录暂无明细</strong><p>详情仍保持只读，不在这里新增明细。</p></div></div>';
          return;
        }
        const start = (currentPage - 1) * 10;
        const pageItems = items.slice(start, start + 10);
        itemsRegion.innerHTML = `<div class="items">${pageItems.map((item, index) => itemCard(item, start + index)).join("")}</div>
          <nav class="pagination" aria-label="明细分页">
            <button type="button" data-page="1" aria-current="${currentPage === 1 ? "page" : "false"}">1</button>
            <button type="button" data-page="2" aria-current="${currentPage === 2 ? "page" : "false"}">2</button>
          </nav>`;
        itemsRegion.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => {
            currentPage = Number(button.dataset.page);
            renderItems();
            itemsTitle.scrollIntoView({ block: "nearest" });
          });
        });
      }

      function syncStateButtons() {
        stateButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.state === currentState)));
      }

      function openDialog() {
        if (dialog.open) return;
        dialog.showModal();
        requestAnimationFrame(() => document.querySelector("#closeIcon").focus({ preventScroll: true }));
      }

      function closeDialog() {
        if (dialog.open) dialog.close();
      }

      openButton.addEventListener("click", openDialog);
      closeButtons.forEach((button) => button.addEventListener("click", closeDialog));
      dialog.addEventListener("close", () => requestAnimationFrame(() => openButton.focus({ preventScroll: true })));
      stateButtons.forEach((button) => button.addEventListener("click", () => {
        currentState = button.dataset.state;
        currentPage = 1;
        syncStateButtons();
        renderItems();
      }));

      renderItems();
      openDialog();
    </script>
  </body>
</html>
