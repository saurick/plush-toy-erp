<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>毛绒玩具 ERP · 统一界面交互评审稿 V8</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #0a66c2;
      --brand-rgb: 10, 102, 194;
      --brand-strong: #0b4f96;
      --brand-hover: #0858aa;
      --on-brand: #ffffff;
      --brand-soft: color-mix(in srgb, var(--brand) 13%, var(--surface));
      --brand-softer: color-mix(in srgb, var(--brand) 6.5%, var(--surface));
      --canvas: #f2f5f3;
      --shell: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f7f9f8;
      --surface-hover: #f4f8f5;
      --text: #1f2a24;
      --text-2: #4d5d53;
      --text-3: #65756b;
      --line: #dce4df;
      --line-strong: #bccbc2;
      --shadow: 0 8px 28px rgba(29, 55, 39, .07);
      --danger: #b83232;
      --danger-soft: #fff0f0;
      --warning: #945912;
      --warning-soft: #fff7e8;
      --success: #23834a;
      --success-soft: #ebf8ef;
      --info: #2868b5;
      --info-soft: #edf5ff;
      --sidebar-w: 206px;
      --sidebar-collapsed-w: 64px;
      --topbar-h: 48px;
      --control-h: 34px;
      --row-h: 52px;
      --table-cell-padding: 9px;
      --radius: 10px;
      --radius-sm: 7px;
      --page-pad: 12px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    [data-mode="dark"] {
      color-scheme: dark;
      --canvas: #050607;
      --shell: #080a0c;
      --surface: #0d1013;
      --surface-raised: #121619;
      --surface-muted: #151a1f;
      --surface-hover: #181e24;
      --text: #f4f7fa;
      --text-2: #a7b0b9;
      --text-3: #7f8993;
      --line: #2a3138;
      --line-strong: #3b4650;
      --shadow: 0 12px 34px rgba(0, 0, 0, .24);
      --brand-soft: color-mix(in srgb, var(--brand) 20%, var(--surface));
      --brand-softer: color-mix(in srgb, var(--brand) 6.5%, var(--surface));
      --danger: #ff9595;
      --warning: #efbe73;
      --success: #83d5a1;
      --info: #86b9ff;
      --danger-soft: rgba(214, 71, 71, .15);
      --warning-soft: rgba(188, 117, 24, .15);
      --success-soft: rgba(35, 131, 74, .18);
      --info-soft: rgba(50, 117, 199, .18);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--canvas);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .app { height: 100%; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); transition: grid-template-columns .18s var(--ease); }
    body.sidebar-collapsed .app { grid-template-columns: var(--sidebar-collapsed-w) minmax(0, 1fr); }

    .sidebar {
      min-width: 0;
      min-height: 0;
      background: var(--shell);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }
    .brand {
      height: var(--topbar-h);
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      white-space: nowrap;
    }
    .brand-home {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: inherit;
      font-weight: inherit;
      text-align: left;
    }
    .brand-home:focus-visible, .sidebar-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .sidebar-toggle { flex: 0 0 auto; }
    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--on-brand);
      background: var(--brand);
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(var(--brand-rgb), .22);
    }
    .brand-copy { display: grid; line-height: 1.05; }
    .nav-scroll { flex: 1; overflow: auto; padding: 10px 9px; scrollbar-width: thin; }
    .nav-group + .nav-group { margin-top: 12px; }
    .nav-label { padding: 0 9px 6px; color: var(--text-3); font-size: 11px; letter-spacing: .08em; }
    .nav-item {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text-2);
      text-align: left;
      transition: .16s var(--ease);
    }
    .nav-item:hover { background: var(--surface-muted); color: var(--text); }
    .nav-item.active { color: var(--brand-strong); background: var(--brand-soft); font-weight: 650; }
    [data-mode="dark"] .nav-item.active { color: var(--brand-strong); }
    .nav-item .badge { margin-left: auto; }
    .nav-item .nav-chevron { margin-left: auto; transition: transform .16s var(--ease); }
    .nav-item.expanded .nav-chevron { transform: rotate(90deg); }
    .nav-submenu { margin: 3px 0 0 27px; display: grid; gap: 2px; }
    .nav-submenu .nav-item { min-height: 32px; padding-left: 10px; font-size: 12px; }
    .sidebar-footer { padding: 8px; border-top: 1px solid var(--line); }
    body.sidebar-collapsed .brand { justify-content: center; padding-inline: 8px; }
    body.sidebar-collapsed .brand-home { display: none; }
    body.sidebar-collapsed .nav-scroll { padding-inline: 8px; }
    body.sidebar-collapsed .nav-group + .nav-group { margin-top: 8px; }
    body.sidebar-collapsed .nav-label { display: none; }
    body.sidebar-collapsed .nav-item { justify-content: center; padding-inline: 0; }
    body.sidebar-collapsed .nav-item > span { display: none; }
    .shell { min-width: 0; min-height: 0; height: 100%; display: grid; grid-template-rows: var(--topbar-h) minmax(0, 1fr); overflow: hidden; }
    .topbar {
      min-width: 0;
      background: var(--shell);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 15;
    }
    .topbar .mobile-menu { display: none; }
    .crumb { min-width: 0; display: flex; align-items: center; gap: 7px; color: var(--text-3); }
    .crumb strong { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; }
    .role-chip { color: var(--warning); background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 28%, transparent); }
    .account-wrap { position: relative; }
    .account-popover { position: fixed; z-index: 90; top: 43px; right: 12px; width: 230px; padding: 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); box-shadow: 0 18px 44px rgba(18,35,24,.18); }
    .account-head { padding: 9px 10px 10px; border-bottom: 1px solid var(--line); }
    .account-head strong, .account-head span { display: block; }
    .account-head span { margin-top: 3px; color: var(--text-3); font-size: 11px; }
    .account-menu { padding-top: 5px; display: grid; gap: 2px; }
    .account-menu button { min-height: 36px; padding: 0 9px; border: 0; border-radius: 7px; display: flex; align-items: center; gap: 9px; color: var(--text-2); background: transparent; text-align: left; }
    .account-menu button:hover { color: var(--text); background: var(--surface-muted); }
    .account-menu button.danger { color: var(--danger); }

    .main { min-width: 0; min-height: 0; padding: var(--page-pad); overflow: hidden; }
    .view { height: 100%; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
    .surface { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .operation-surface { flex: 0 0 auto; overflow: visible; box-shadow: 0 3px 14px rgba(35, 65, 45, .035); }

    .page-line {
      min-height: 48px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .page-title { min-width: 150px; display: flex; align-items: baseline; gap: 8px; }
    .page-title h1 { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.02em; }
    .page-title span { color: var(--text-3); font-size: 12px; white-space: nowrap; }
    .metric-strip { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: auto; scrollbar-width: none; }
    .metric {
      height: 31px;
      padding: 0 9px;
      border: 1px solid var(--line);
      background: var(--surface-muted);
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      color: var(--text-2);
      font-size: 12px;
    }
    .metric strong { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
    .metric.danger strong { color: var(--danger); }
    .metric.warning strong { color: var(--warning); }

    .command-row {
      min-width: 0;
      min-height: 45px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--line);
    }
    .operation-surface > .command-row:last-child { border-bottom: 0; }
    .segment, .page-tabs {
      height: var(--control-h);
      padding: 3px;
      display: inline-flex;
      align-items: center;
      background: var(--surface-muted);
      border: 1px solid var(--line);
      border-radius: 9px;
      flex: 0 0 auto;
    }
    .segment button, .page-tabs button {
      height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      color: var(--text-2);
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .segment button.active, .page-tabs button.active { color: var(--brand-strong); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--line); }
    .segment button:not(.active):hover, .page-tabs button:not(.active):hover { background: var(--brand-softer); }
    .segment button:focus-visible, .page-tabs button:focus-visible { outline: 2px solid var(--brand); outline-offset: -3px; }
    .segment button b { margin-left: 4px; color: var(--text-3); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .segment button.active b { color: var(--brand-strong); }
    [data-mode="dark"] .segment button.active { color: var(--brand-strong); }
    .search {
      height: var(--control-h);
      min-width: 200px;
      flex: 1 1 300px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
    }
    .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .11); }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; }
    .search svg { color: var(--text-3); }
    .command-actions { min-width: 0; margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .page-navigation { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
    .navigation-row, .module-tabs-row, .view-mode-row { min-width: 0; min-height: 38px; padding: 0; display: flex; align-items: center; gap: 8px; background: transparent; }
    .page-navigation, .module-tabs-row, .view-mode-row { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .navigation-row { flex-wrap: wrap; }
    .navigation-row > .segment, .view-mode-row > .segment, .page-tabs { height: 38px; }
    .navigation-row > .segment button, .view-mode-row > .segment button, .page-tabs button { height: 30px; }
    .page-tabs { min-width: 0; max-width: 100%; flex: 0 1 auto; overflow-x: auto; scrollbar-width: thin; }
    .page-tabs button { flex: 0 0 auto; }
    .module-tabs-row .data-note { margin-left: auto; white-space: nowrap; }
    .control, .btn {
      height: var(--control-h);
      padding: 0 11px;
      font-size: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: .15s var(--ease);
    }
    .control:hover, .btn:hover { border-color: var(--brand); color: var(--brand-strong); background: var(--brand-softer); }
    .btn.primary { color: var(--on-brand); border-color: var(--brand); background: var(--brand); font-weight: 650; box-shadow: 0 4px 10px rgba(var(--brand-rgb), .18); }
    .btn.primary:hover { color: var(--on-brand); background: var(--brand-hover); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
    .icon-btn { width: var(--control-h); padding: 0; }
    .control select { border: 0; outline: 0; background: transparent; }
    .desktop-only { display: inline-flex; }

    .record-row {
      min-width: 0;
      min-height: 39px;
      padding: 4px 8px 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-muted);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .record-state { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .record-state strong { font-size: 13px; }
    .record-state span { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-actions { min-width: 0; margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .record-actions .btn { height: 30px; }

    .summary-trigger.active { color: var(--brand-strong); border-color: var(--brand); background: var(--brand-soft); }
    .list-summary-panel { padding: 11px 12px 12px; border-top: 1px solid var(--line); background: var(--surface); }
    .list-summary-head { display: flex; align-items: flex-start; gap: 12px; }
    .list-summary-head > div { min-width: 0; flex: 1; }
    .list-summary-head strong { display: block; font-size: 13px; }
    .list-summary-head span { display: block; margin-top: 3px; color: var(--text-3); font-size: 11px; }
    .list-summary-metrics { margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    .list-summary-metric { min-height: 58px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-muted); }
    .list-summary-metric span { display: block; color: var(--text-3); font-size: 11px; }
    .list-summary-metric strong { display: block; margin-top: 5px; overflow: hidden; color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
    .list-summary-metric.warning strong { color: var(--warning); }
    .list-summary-metric.selected { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); background: var(--brand-softer); }
    .list-summary-breakdown { margin-top: 10px; display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 7px; overflow-x: auto; }
    .summary-status { min-width: 110px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .summary-status-copy { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-2); font-size: 11px; }
    .summary-status-copy strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .summary-status-bar { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: var(--surface-muted); }
    .summary-status-bar i { height: 100%; display: block; border-radius: inherit; background: var(--brand); }
    .list-summary-foot { margin-top: 9px; display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 11px; }
    .list-summary-foot .badge { margin-left: auto; }
    .batch-total { padding-left: 7px; border-left: 1px solid var(--line); color: var(--text-2) !important; font-variant-numeric: tabular-nums; }

    .data-surface { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
    .data-note { color: var(--text-3); font-size: 12px; }
    .table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; }
    table { width: 100%; min-width: 1080px; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 0 11px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 40px;
      color: var(--text-2);
      background: var(--surface-muted);
      font-size: 12px;
      font-weight: 650;
    }
    th:not(:last-child) { border-right: 1px solid var(--line-strong); }
    th:has(.sort-btn.active) { background: var(--brand-softer); border-bottom-color: var(--brand); }
    .sort-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 2px; }
    td { height: var(--row-h); padding-block: var(--table-cell-padding); font-size: 13px; }
    tbody tr { background: var(--surface); transition: background .12s; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr.selected { background: var(--brand-softer); }
    th:first-child, td:first-child { position: sticky; left: 0; z-index: 4; width: 42px; background: inherit; }
    th:first-child { z-index: 7; background: var(--surface-muted); }
    td .cell-content { min-width: 0; }
    td.cell-party { min-width: 220px; max-width: 340px; }
    td.cell-party .cell-content, td.cell-owner .cell-content, td.cell-progress .cell-content { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.cell-owner { max-width: 160px; }
    td.cell-progress { min-width: 150px; max-width: 250px; }
    td.cell-metric { font-variant-numeric: tabular-nums; }
    td.cell-party .strong, td.cell-party .subline, td.cell-party .product-cell > span:last-child > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sort-btn { padding: 0; border: 0; background: transparent; color: inherit; display: inline-flex; align-items: center; gap: 4px; font-weight: inherit; }
    .sort-btn.active { color: var(--brand-strong); }
    .sort-glyph { font-size: 10px; line-height: 1; }
    .checkbox { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
    .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .strong { font-weight: 650; }
    .entity-link { padding: 0; border: 0; background: transparent; color: var(--text); font-weight: 650; text-align: left; }
    .entity-link:hover { color: var(--brand-strong); text-decoration: underline; text-underline-offset: 3px; }
    .subline { display: block; margin-top: 3px; color: var(--text-3); font-size: 11px; }
    .badge {
      min-height: 22px;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-2);
      background: var(--surface-muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .badge.success { color: var(--success); background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 28%, transparent); }
    .badge.warning { color: var(--warning); background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 28%, transparent); }
    .badge.danger { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 28%, transparent); }
    .badge.info { color: var(--info); background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 28%, transparent); }
    .text-btn { padding: 4px 5px; border: 0; border-radius: 5px; background: transparent; color: var(--brand-strong); }
    .text-btn:hover { background: var(--brand-soft); }
    [data-mode="dark"] .text-btn { color: var(--brand-strong); }
    .table-footer {
      min-width: 0;
      min-height: 43px;
      padding: 5px 10px 5px 12px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-3);
      font-size: 12px;
    }
    .pager { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .pager button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .pager button.active { color: var(--on-brand); border-color: var(--brand); background: var(--brand); }
    .pager-gap { width: 22px; text-align: center; color: var(--text-3); }
    .mobile-card-list { display: none; }

    .popover {
      position: fixed;
      z-index: 60;
      width: 320px;
      max-height: calc(100vh - 72px);
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-raised);
      box-shadow: 0 18px 44px rgba(18, 35, 24, .18);
    }
    .popover-head { display: flex; align-items: center; margin-bottom: 12px; }
    .popover-head strong { flex: 1; }
    .filter-grid { min-height: 0; padding-right: 2px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow: auto; }
    .field { display: grid; gap: 6px; }
    .field.span-2 { grid-column: 1 / -1; }
    .approval-settings-editor { display:grid; gap:14px; }
    .approval-settings-editor [data-approval-condition-fields]:not([hidden]) { display:grid; gap:12px; }
    .approval-mode { display:flex; flex-wrap:wrap; gap:18px; min-inline-size:0; margin:0; padding:0; border:0; }

    function getFilteredRows(config, { ignoreStatus = false } = {}) {

        const ownerOk = state.filterOwner === 'all' || row.owner === state.filterOwner || row.role === state.filterOwner;

    }

    const quantityUnits = [{"code":"EA","name":"个","precision":0},{"code":"SET","name":"套","precision":0},{"code":"PAIR","name":"对","precision":0},{"code":"SHEET","name":"片","precision":0},{"code":"STRIP","name":"条","precision":0},{"code":"BLOCK","name":"块","precision":0},{"code":"YD","name":"码","precision":6},{"code":"KG","name":"千克","precision":3}];

    function quantityUnit(name) {
      return quantityUnits.find(unit => unit.name === name);
    }

    function quantityUnitOptions(selected = '') {
      return '<option value="">请选择单位</option>' + quantityUnits.map(unit => `<option${unit.name === selected ? ' selected' : ''}>${unit.name}</option>`).join('');
    }

    function formatUnitQuantity(value, unit) {
      return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: quantityUnit(unit)?.precision ?? 6 }).format(value);
    }

    function requiredMaterialQuantity(coefficient, planned, lossPercent, unitName) {
      const unit = quantityUnit(unitName);
      const scaled = value => {
        const match = /^(\d{1,14})(?:\.(\d{1,6}))?$/.exec(String(value ?? '').trim());
        return match ? BigInt(match[1]) * 1000000n + BigInt((match[2] || '').padEnd(6, '0')) : null;
      };
      const values = [coefficient, planned, lossPercent].map(scaled);
      if (!unit || values.some(value => value === null)) return null;
      const [usage, quantity, loss] = values;
      const divisor = 10n ** BigInt(20 - unit.precision);
      const numerator = usage * quantity * (100000000n + loss);
      return (numerator + divisor - 1n) / divisor;
    }

    function formatRequiredMaterial(required, unitName) {
      if (required === null) return '待补齐';
      const precision = quantityUnit(unitName).precision;
      const scale = 10n ** BigInt(precision);
      const whole = (required / scale).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      const fraction = (required % scale).toString().padStart(precision, '0').replace(/0+$/, '');
      return `${whole}${fraction ? '.' + fraction : ''} ${unitName}`;
    }

    function requiredMaterialPreview(coefficient, planned, lossPercent, unitName) {
      return formatRequiredMaterial(requiredMaterialQuantity(coefficient, planned, lossPercent, unitName), unitName);
    }

    function updateQuantityValidity() {
      document.querySelectorAll('[data-form-field^="qty-"]').forEach(input => {
        const index = input.dataset.formField.slice(4);
        const unit = quantityUnit(document.querySelector(`[data-form-field="unit-${index}"]`)?.value);
        const hint = !unit ? '请先选择已配置精度的单位' : unit.precision === 0 ? '当前单位只允许整数数量' : `当前单位最多允许 ${unit.precision} 位小数`;
        const raw = input.value.trim();
        const match = /^-?(\d{1,14})(?:\.(\d{1,6}))?$/.exec(raw);
        const valid = unit && match && (match[2] || '').replace(/0+$/, '').length <= unit.precision;
        input.step = 'any';
        input.title = hint;
        input.setCustomValidity(raw && !valid ? hint : '');
        input.setAttribute('aria-invalid', String(Boolean(raw && !valid)));
      });
    }

    function formNumber(name) {
      const input = document.querySelector(`[data-form-field="${name}"]`);
      if (input?.getAttribute('aria-invalid') === 'true') return null;
      const raw = input?.value;
      if (raw === undefined || raw === null || String(raw).trim() === '') return null;
      const value = Number(raw);
      return Number.isFinite(value) ? value : null;
    }

    function formIndexedNumbers(prefix) {
      return [...document.querySelectorAll(`[data-form-field^="${prefix}"]`)].filter(input => input.getAttribute('aria-invalid') !== 'true').map(input => ({
        name: input.dataset.formField,
        value: String(input.value).trim() === '' ? null : Number(input.value)
      })).filter(item => item.value !== null && Number.isFinite(item.value));
    }

    function formAmountFromRows() {
      return formIndexedNumbers('qty-').reduce((sum, item) => {
        const index = item.name.slice(4);
        const price = formNumber(`price-${index}`);
        return price === null ? sum : sum + item.value * price;
      }, 0);
    }

    function formQuantityByUnit(prefix = 'qty-') {
      const groups = new Map();
      formIndexedNumbers(prefix).forEach(item => {
        const index = item.name.slice(prefix.length);
        const unit = document.querySelector(`[data-form-field="unit-${index}"]`)?.value || '个';
        groups.set(unit, (groups.get(unit) || 0) + item.value);
      });
      return [...groups.entries()].map(([unit,value]) => `${formatUnitQuantity(value, unit)} ${unit}`).join('、') || '待补齐';
    }

        note=pendingRows?'尚有未计价明细；补齐数量和单价后再核对总额':'金额按所选币种和税费模式计算；含税价不重复加税';

    function renderDashboardSummary() {

    }

    const observedWideTables = new Set();
    const wideTableScrollTops = new WeakMap();
    const wideTableObserver = new ResizeObserver(syncDashboardSummaryScroll);
    function syncDashboardSummaryScroll() {
      observedWideTables.forEach(node => { if (!node.isConnected) { clearTimeout(node._scrollSettleTimer); wideTableObserver.unobserve(node); observedWideTables.delete(node); } });
      document.querySelectorAll('.summary-table-wrap, .material-summary-table, .material-summary-part-table').forEach(scroller => {
        let actions = scroller._scrollActions;
        let space = scroller._scrollSpace;
        if (!actions) {
          scroller.classList.add('wide-scroll-region');
          actions = document.createElement('div');
          actions.className = 'summary-scroll-actions';
          actions.setAttribute('role', 'group');
          actions.setAttribute('aria-label', '表格横向查看');
          actions.innerHTML = '<button class="btn" data-action="wide-table-scroll" data-direction="left" aria-label="向左查看列">‹</button><button class="btn" data-action="wide-table-scroll" data-direction="right" aria-label="向右查看列">›</button>';
          const toolbar = scroller.closest('.summary-workspace')?.querySelector('.summary-context');
          if (toolbar) toolbar.append(actions); else scroller.prepend(actions);
          actions._tableScroller = scroller;
          scroller._scrollActions = actions;
          space = document.createElement('div');
          space.className = 'summary-scroll-space';
          space.innerHTML = '<div class="summary-scroll-dock"><input class="summary-scroll-range" type="range" min="0" step="any" aria-label="横向滚动位置"></div>';
          scroller.append(space);
          scroller._scrollSpace = space;
          for (let node = scroller; node; node = node.parentElement) { if (!wideTableScrollTops.has(node)) wideTableScrollTops.set(node, node.scrollTop); }
          wideTableScrollTops.set(window, window.scrollY);
          space.querySelector('input').addEventListener('input', event => { scroller.scrollLeft = Number(event.target.value); });
          [scroller, scroller.querySelector('table'), space, actions].filter(Boolean).forEach(node => { wideTableObserver.observe(node); observedWideTables.add(node); });
        }
        const maxLeft = scroller.scrollWidth - scroller.clientWidth;
        const hidden = maxLeft <= 2 || !scroller.querySelector('tbody tr') || Boolean(scroller.querySelector('.empty'));
        actions.hidden = hidden; space.hidden = hidden;
        if (hidden) return;
        if (scroller._scrollingVertically) { space.firstElementChild.style.visibility = 'hidden'; return; }
        if (actions.parentElement === scroller) actions.style.width = scroller.clientWidth + 'px';
        const box = scroller.getBoundingClientRect();
        let top = Math.max(0, box.top);
        let bottom = Math.min(innerHeight, box.top + scroller.clientHeight);
        for (let node = scroller.parentElement; node; node = node.parentElement) {
          if (/auto|scroll|hidden|clip/.test(getComputedStyle(node).overflowY)) {
            const rect = node.getBoundingClientRect();
            top = Math.max(top, rect.top); bottom = Math.min(bottom, rect.bottom);
          }
        }
        const dock = space.firstElementChild;
        dock.style.width = scroller.clientWidth + 'px';
        dock.style.transform = `translateY(${Math.min(0, bottom - 24 - space.getBoundingClientRect().top)}px)`;
        dock.style.visibility = bottom - top > 40 ? 'visible' : 'hidden';
        const range = dock.querySelector('input');
        range.max = maxLeft; range.value = scroller.scrollLeft;
        range.style.setProperty('--scroll-thumb', Math.max(32, scroller.clientWidth ** 2 / scroller.scrollWidth) + 'px');
        actions.querySelector('[data-direction="left"]').disabled = scroller.scrollLeft <= 1;
        actions.querySelector('[data-direction="right"]').disabled = scroller.scrollLeft >= maxLeft - 1;
      });
    }
    window.addEventListener('resize', syncDashboardSummaryScroll);
    window.addEventListener('scroll', event => {
      const node = event.target === document ? window : event.target;
      const top = node === window ? window.scrollY : node.scrollTop;
      if (top !== wideTableScrollTops.get(node)) {
        wideTableScrollTops.set(node, top);
        document.querySelectorAll('.wide-scroll-region').forEach(scroller => {
          if (node !== window && !node.contains(scroller)) return;
          scroller._scrollingVertically = true;
          scroller._scrollSpace.firstElementChild.style.visibility = 'hidden';
          clearTimeout(scroller._scrollSettleTimer);
          scroller._scrollSettleTimer = setTimeout(() => { scroller._scrollingVertically = false; if (scroller.isConnected) syncDashboardSummaryScroll(); }, 180);
        });
      }
      syncDashboardSummaryScroll();
    }, true);

    function permissionChange(role, code) {

    }
    function renderPermissionMatrix(groups, role, readOnly) {

      const added=changes.filter(([,code])=>permissionValue(role,code)).length;
      const checked=(item,compact=false)=>{
        const [name,code,,action]=item,change=permissionChange(role,code);
        const sensitive=/(?:^|_)(activate|approve|cancel|confirm|disable|post|reverse|ship)(?:_|$)/.test(action);
        return `<label class="permission-capability${compact?' permission-capability--compact':''}" title="${escapeHTML(name)}${sensitive?' · 敏感操作':''}"><input class="checkbox" type="checkbox" aria-label="${escapeHTML(name)}" data-action="permission-toggle" data-code="${code}" ${permissionValue(role,code)?'checked':''} ${readOnly?'disabled':''}/><span><strong class="${compact?'permission-compact-name':''}">${escapeHTML(name)}</strong>${!compact&&sensitive?'<small>敏感操作</small>':''}${change?`<small class="permission-change">${change}</small>`:''}</span></label>`;
      };
      const body=groups.map(([key,label,items])=>{
        const original=permissionGroupsData.find(([value])=>value===key)[2];

        return `<tbody data-permission-module="${key}">${head}${open?rows:''}</tbody>`;
      }).join('');
      return `<div class="permission-capability-toolbar"><span class="permission-summary"><strong>${all.filter(([,code])=>permissionValue(role,code)).length}</strong><span>/ ${all.length} 项功能已授权 · ${permissionGroupsData.length} 个业务域</span><label><input type="checkbox" data-action="permission-selected-only" ${state.permissionSelectedOnly?'checked':''}/> 只看已选</label></span>${changes.length?`<button class="text-btn" data-action="permission-show-changes">新增 ${added} 项 · 撤销 ${changes.length-added} 项</button>`:''}<div class="permission-expand-actions"><button class="text-btn" data-action="permission-expand-all">全部展开</button><button class="text-btn" data-action="permission-collapse-all">全部收起</button></div></div><div class="permission-groups">${groups.length?`<table class="permission-function-matrix" aria-label="岗位功能权限"><colgroup><col style="width:22%"/><col style="width:76px"/><col style="width:76px"/><col style="width:76px"/><col/></colgroup><thead><tr><th scope="col">业务对象</th>${columns.map(([,label])=>`<th scope="col">${label}</th>`).join('')}</tr></thead>${body}</table>`:'<div class="empty">没有匹配的功能，请调整搜索或关闭只看已选</div>'}</div>`;
    }

    function renderPermissionView(view) {

    function approvalConditionText(rule) {

      return `${rule.currency} ${amount} 起需审批`;

    function renderAuditLog() {
      const q = state.auditSearch.trim().toLowerCase();
      const rows = auditRows.filter(row => (state.auditDate!=='today'||row.time.startsWith('2026/09/26')) && (state.auditCategory==='all'||row.category===state.auditCategory) && (state.auditResult==='all'||row.result===state.auditResult) && (!q||Object.values(row).flat().join(' ').toLowerCase().includes(q)));
      const operation = `<section class="surface operation-surface"><div class="command-row"><div class="segment" aria-label="记录分类">${[['all','全部'],['business','业务操作'],['permission','权限配置'],['security','登录安全']].map(([key,label])=>`<button class="${state.auditCategory===key?'active':''}" data-action="audit-category" data-value="${key}">${label}</button>`).join('')}</div><label class="search">${icon('search')}<input id="audit-search" value="${escapeHTML(state.auditSearch)}" placeholder="搜索操作人、对象或动作" /></label><label class="control"><span>结果</span><select id="audit-result"><option value="all" ${state.auditResult==='all'?'selected':''}>全部</option><option value="成功" ${state.auditResult==='成功'?'selected':''}>成功</option><option value="失败" ${state.auditResult==='失败'?'selected':''}>失败</option></select></label><label class="control"><span>时间</span><select id="audit-date"><option value="today" ${state.auditDate==='today'?'selected':''}>今天</option><option value="7days" ${state.auditDate==='7days'?'selected':''}>近 7 天</option><option value="30days" ${state.auditDate==='30days'?'selected':''}>近 30 天</option></select></label><div class="command-actions"><button class="btn" data-action="export">${icon('export')}导出</button></div></div></section>`;
      if (state.previewState !== 'data') return `${operation}${renderDataState({title:'系统操作记录'})}`;
      return `${operation}<section class="surface data-surface audit-data-surface"><div class="audit-toolbar"><strong>系统操作记录</strong><span>只读 · 保留关键业务动作、权限变更与登录安全结果</span><span class="data-note">敏感值已脱敏</span></div><div class="table-wrap"><table class="audit-table"><thead><tr><th>发生时间</th><th>操作人</th><th>动作</th><th>业务对象</th><th>结果</th><th>入口 / 地址</th><th>详情</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td class="mono">${row.time}</td><td><strong>${row.operator}</strong><span class="subline">${row.account}</span></td><td class="audit-action"><strong>${row.action}</strong><span>${row.summary}</span></td><td class="mono">${row.object}</td><td><span class="badge ${row.badge}">${row.result}</span></td><td>${row.source}</td><td><button class="text-btn" data-action="audit-open" data-id="${row.id}">查看变化</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div><strong>没有匹配的操作记录</strong><span>调整分类、结果或搜索后重试</span></div></div></td></tr>`}</tbody></table></div><footer class="table-footer"><span>共 ${rows.length} 条样例记录 · 正式系统按授权范围读取</span><span style="margin-left:auto">本页不提供回滚、重放或删除</span></footer></section>`;

    function contactFormRows() {
      const count = Number(state.formValues['contacts-count'] || 1);
      return Array.from({length:count}, (_,index) => ({
        ...Object.fromEntries(['name','title','mobile','phone','email','note'].map(key=>[key,state.formValues[`contact-${index}-${key}`] || ''])),
        primary: state.formValues[`contact-${index}-primary`] ?? index===0,
        noteOpen: Boolean(state.contactNotesOpen?.[index])
      }));
    }

    function applyContactFormRows(rows) {
      Object.keys(state.formValues).filter(key=>/^contact-\d+-/.test(key)).forEach(key=>delete state.formValues[key]);
      const selected = Math.max(0, rows.findIndex(row=>row.primary));
      state.formValues['contacts-count'] = rows.length;
      state.contactNotesOpen = {};
      rows.forEach((row,index)=>{
        ['name','title','mobile','phone','email','note'].forEach(key=>state.formValues[`contact-${index}-${key}`]=row[key] || '');
        state.formValues[`contact-${index}-primary`] = index===selected;
        state.contactNotesOpen[index] = Boolean(row.noteOpen);
      });
      state.formDirty = true;
    }

    function getMobileReviewTasks() {
      return state.mobileReviewRole === 'all' ? mobileTasks : mobileTasks.filter(task => task.role === state.mobileReviewRole);
    }
    const mobileQuickCounts = {
      get all() { return getMobileReviewTasks().filter(task => task.status === 'todo').length; },
      get approval() { return getMobileReviewTasks().filter(task => task.status === 'todo' && task.approval).length; },
      get risk() { return getMobileReviewTasks().filter(task => task.status === 'todo' && task.risk).length; },
      get overdue() { return getMobileReviewTasks().filter(task => task.status === 'todo' && task.overdue).length; }
    };
    const mobileActionLabels = { done: '完成本岗', blocked: '标记阻塞', rejected: '退回上游', resume: '解除阻塞', urge: '催办' };

    function getMobileTask() {
      return mobileTasks.find(task => task.id === state.mobileTaskId) || null;
    }

    function getMobileReceipt(task) {
      if (state.mobileReceipt?.taskId === task?.id) return state.mobileReceipt;
      return task?.receipt || null;
    }

    function getMobileFilteredTasks() {
      const listStatus = state.mobileMain === 'risk' ? 'todo' : state.mobileTab;
      const q = state.mobileSearch.trim().toLowerCase();
      let rows = getMobileReviewTasks().filter(task => task.status === listStatus);
      if (state.mobileMain === 'risk') {
        rows = rows.filter(task => state.mobileQuick === 'overdue' ? task.overdue : task.risk);
      } else if (listStatus === 'todo' && state.mobileQuick !== 'all') {
        rows = rows.filter(task => Boolean(task[state.mobileQuick]));
      }
      if (state.mobileStatus === 'actionable') rows = rows.filter(task => task.access === 'actionable');
      if (state.mobileStatus === 'blocked') rows = rows.filter(task => task.state === '阻塞');
      if (q) rows = rows.filter(task => Object.values(task).join(' ').toLowerCase().includes(q));
      return rows.slice().sort((a, b) => state.mobileSort === 'oldest' ? b.order - a.order : a.order - b.order);
    }

            <button class="rm-filter-button ${optionCount ? 'active' : ''}" data-action="mobile-options" aria-expanded="${state.mobileOptionsOpen}">${icon('filter')}筛选${optionCount ? `<span class="rm-filter-count">${optionCount}</span>` : ''}</button>

          ${(state.mobileMain === 'risk' || state.mobileTab === 'todo') ? `<div class="rm-quick-filters" role="group" aria-label="${state.mobileMain === 'risk' ? '风险类别' : '任务快捷筛选'}">${quickItems.map(([key,label,count]) => `<button class="rm-chip ${state.mobileQuick === key ? 'active' : ''}" data-action="mobile-quick" data-value="${key}">${label}${count===null?'':`<b>${count}</b>`}</button>`).join('')}</div>` : ''}
          <section class="rm-task-list" aria-label="${state.mobileMain === 'risk' ? '风险任务' : state.mobileTab === 'done' ? '已办任务' : '待办任务'}">
            ${visibleRows.length ? visibleRows.map(renderMobileTaskCard).join('') : '<div class="rm-empty"><div><strong>当前筛选下暂无任务</strong><span>调整搜索或筛选条件后重试</span></div></div>'}

    function renderMobileFlowHeader(task, current, title) {
      const receipt = getMobileReceipt(task);
      const processAvailable = task.status === 'todo' && task.access !== 'readonly';
      const receiptAvailable = Boolean(receipt);
      const steps = [
        ['detail','1','任务信息',true],
        ['process','2','任务办理',processAvailable],
        ['receipt','3','结果回执',receiptAvailable]
      ];
      return `<header class="rm-flow-head">
        <div class="rm-flow-topbar"><button class="rm-back" data-action="mobile-back" aria-label="返回">${icon('left')}</button><h1 class="rm-flow-title">${title}</h1><span class="badge ${task.badge} rm-flow-status">${task.state}</span></div>
        <div class="rm-steps">${steps.map(([key,n,label,available]) => `<button class="rm-step ${current === key ? 'current' : available ? 'available' : ''}" data-action="mobile-step" data-value="${key}" ${current === key || !available ? 'disabled' : ''}><i>${n}</i><span>${label}</span></button>`).join('')}</div>
      </header>`;
    }

    function renderMobileTaskDetail(task) {
      const receipt = getMobileReceipt(task);
      const accessNote = task.access === 'urge'
        ? '<div class="rm-callout warning">您可以查看并催办这条任务，任务状态仍由责任岗位处理。</div>'
        : task.access === 'readonly' && !receipt
          ? '<div class="rm-callout warning">当前任务仅供查看，不能提交处理。</div>'
          : '';
      const canProcess=task.status==='todo'&&task.access!=='readonly'&&task.actions.length>0;

    function resolveMobileActionLabel(action, task) {
      if (action === 'done' && task.approval) return '审批通过';
      return mobileActionLabels[action] || '提交办理';
    }

    function resolveMobileActionField(action, task) {
      if (action === 'done') return task.approval ? ['审批意见','说明核对依据、审批结果和交接信息'] : ['完成反馈','说明已完成什么、核对结果和交接信息'];
      if (action === 'blocked') return ['阻塞原因','说明当前卡点、影响和需要的支持'];
      if (action === 'rejected') return ['退回原因','说明退回依据和需要补充的内容'];
      if (action === 'resume') return ['解除说明','说明阻塞如何解除，以及下一步安排'];
      return ['催办原因','说明催办原因和期望完成时间'];
    }

    function resolveMobileActionDescription(action, task) {
      if (action === 'done') return task.approval ? '核对后确认通过，记录审批意见。' : '完成当前岗位的协同任务。';
      if (action === 'blocked') return '记录卡点并等待相关岗位处理。';
      if (action === 'rejected') return '资料不足或结果不符合要求时退回。';
      if (action === 'resume') return '确认卡点已解除，恢复后续处理。';
      return '记录催办原因，任务状态保持不变。';
    }

    function updateFormSectionNavigation() {
      const scroller = document.querySelector('.form-scroll');
      const nav = document.querySelector('.anchor-nav');
      if (!scroller || !nav) return;
      const buttons = [...nav.querySelectorAll('[data-action="form-anchor"]')];
      nav.insertAdjacentHTML('beforeend', `<label class="form-section-picker">跳转到<select aria-label="跳转到表单分区">${buttons.map(button=>`<option value="${button.dataset.target}">${button.textContent}</option>`).join('')}</select></label>`);
      const picker = nav.querySelector('select');
      picker.addEventListener('change', () => buttons.find(button=>button.dataset.target===picker.value)?.click());
      const update = () => {
        const top = scroller.getBoundingClientRect().top;
        let current = buttons[0];
        for (const button of buttons) {
          const section = document.getElementById(button.dataset.target);
          if (section && section.getBoundingClientRect().top <= top + 28) current = button;
        }
        if (scroller.scrollHeight > scroller.clientHeight + 2 && scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) current = buttons.at(-1);
        buttons.forEach(button=>{button.classList.toggle('active',button===current);if(button===current)button.setAttribute('aria-current','location');else button.removeAttribute('aria-current');});
        if (current) picker.value = current.dataset.target;
      };
      scroller.addEventListener('scroll', update, {passive:true});
      requestAnimationFrame(update);
    }

      const invalid = key => state.loginInvalid.includes(key) ? 'invalid' : '';
      const ariaInvalid = key => String(state.loginInvalid.includes(key));
      return `<main class="login-shell">
            <form id="login-form" class="login-card" novalidate aria-labelledby="login-title" aria-busy="${state.loginBusy}">
              <header class="login-brand-row">
                <div class="login-brand"><span class="brand-mark" aria-hidden="true">${escapeHTML(LOGIN_BRAND.brandMark)}</span><h1 class="login-company" id="login-title">${escapeHTML(LOGIN_BRAND.companyName)}</h1></div>
                <button type="button" class="btn login-appearance" data-action="login-theme" aria-label="外观设置" title="外观设置" aria-haspopup="dialog">${icon('theme')}</button>
              </header>
              ${entries.length > 1 ? `<div class="login-entry" role="radiogroup" aria-label="工作方式">
                ${entries.map(([key,label,ic]) => `<button type="button" role="radio" data-action="login-entry" data-value="${key}" aria-checked="${state.loginEntry===key}" tabindex="${state.loginEntry===key ? 0 : -1}" ${disabled}>${loginIcon(ic)}<span>${label}</span></button>`).join('')}
              </div>` : ''}
              ${LOGIN_OPTIONS.sms ? `<div class="login-methods" role="tablist" aria-label="登录方式">
                <button type="button" role="tab" id="login-tab-password" data-action="login-method" data-value="password" aria-controls="login-password-panel" aria-selected="${!sms}" tabindex="${sms ? -1 : 0}" ${disabled}>密码登录</button>
                <button type="button" role="tab" id="login-tab-sms" data-action="login-method" data-value="sms" aria-controls="login-sms-panel" aria-selected="${sms}" tabindex="${sms ? 0 : -1}" ${disabled}>短信登录</button>
              </div>` : ''}
              <div class="login-panel" id="login-password-panel" ${LOGIN_OPTIONS.sms ? 'role="tabpanel" aria-labelledby="login-tab-password"' : 'role="group" aria-label="密码登录"'} ${sms ? 'hidden' : ''}>
                <div class="login-field">
                  <div class="login-label-row"><label for="login-account">账号</label></div>
                  <div class="login-input ${invalid('account')}"><input id="login-account" name="username" data-login-value="account" type="text" value="${escapeHTML(v.account)}" placeholder="请输入账号" autocomplete="username" autocapitalize="none" spellcheck="false" aria-required="true" aria-invalid="${ariaInvalid('account')}" aria-describedby="login-feedback" ${disabled}></div>
                </div>
                <div class="login-field">
                  <div class="login-label-row"><label for="login-password">密码</label></div>
                  <div class="login-input ${invalid('password')}"><input id="login-password" name="password" data-login-value="password" type="${state.loginPasswordVisible ? 'text' : 'password'}" value="${escapeHTML(v.password)}" placeholder="请输入密码" autocomplete="current-password" aria-required="true" aria-invalid="${ariaInvalid('password')}" aria-describedby="login-feedback" ${disabled}><button type="button" class="login-eye" data-action="login-password-visibility" aria-label="${state.loginPasswordVisible ? '隐藏密码' : '显示密码'}" aria-pressed="${state.loginPasswordVisible}" ${disabled}>${loginIcon(state.loginPasswordVisible ? 'eye' : 'eyeOff')}</button></div>
                </div>
              </div>
              <div class="login-panel" id="login-sms-panel" role="tabpanel" aria-labelledby="login-tab-sms" ${sms ? '' : 'hidden'}>
                <div class="login-field">
                  <div class="login-label-row"><label for="login-phone">手机号</label></div>
                  <div class="login-input ${invalid('phone')}"><input id="login-phone" name="phone" data-login-value="phone" type="tel" inputmode="tel" value="${escapeHTML(v.phone)}" placeholder="请输入手机号" autocomplete="tel-national" maxlength="20" aria-required="true" aria-invalid="${ariaInvalid('phone')}" aria-describedby="login-feedback" ${disabled}></div>
                </div>
                <div class="login-field">
                  <div class="login-label-row"><label for="login-code">验证码</label></div>
                  <div class="login-input ${invalid('code')}"><input id="login-code" name="code" data-login-value="code" type="text" inputmode="numeric" value="${escapeHTML(v.code)}" placeholder="请输入验证码" autocomplete="one-time-code" maxlength="6" aria-required="true" aria-invalid="${ariaInvalid('code')}" aria-describedby="login-feedback" ${disabled}><button type="button" class="login-send" data-action="login-send-code" ${state.loginBusy || state.loginSmsSending || !v.phone.trim() || Date.now() < state.loginSmsDeadline ? 'disabled' : ''}>${loginSmsButtonLabel()}</button></div>
                </div>
              </div>
              ${entries.length === 0 ? '<div class="login-feedback error" role="alert">暂时无法登录，请联系系统管理员</div>' : ''}
              <div id="login-feedback" class="login-feedback ${state.loginError ? 'error' : ''}" role="status" aria-live="polite" aria-atomic="true">${loginFeedbackContent()}</div>
              <button class="btn primary login-submit" id="login-submit" type="button" data-action="login-submit" ${disabled}>${state.loginBusy ? '<span class="login-spinner" aria-hidden="true"></span>正在登录…' : '登录'}</button>
              <nav class="login-policy-links" aria-label="隐私与使用规则"><button type="button" data-action="login-privacy" aria-haspopup="dialog">个人信息处理规则</button><span aria-hidden="true">·</span><button type="button" data-action="login-rules" aria-haspopup="dialog">系统使用规则</button></nav>
              <button type="button" class="login-demo-entry" data-action="login-demo">演示账号与验证码</button>
            </form>
      </main>`;
    }

    function loginSmsButtonLabel() {
      if (state.loginSmsSending) return '正在获取…';
      const seconds = Math.max(0, Math.ceil((state.loginSmsDeadline - Date.now()) / 1000));
      return seconds ? `${seconds} 秒后重试` : state.loginSmsPhone ? '重新获取' : '获取验证码';
    }

    function loginFeedbackContent() {
      const message = state.loginError || (state.loginCapsLock && state.loginMethod === 'password' ? '大写锁定已开启' : state.loginMethod === 'sms' ? state.loginSmsHint : '');
      return message ? `${icon('info')}<span>${escapeHTML(message)}</span>` : '';
    }

    function updateLoginFeedback() {
      const form = document.querySelector('#login-form');
      if (!form) return;
      form.setAttribute('aria-busy', String(state.loginBusy || state.loginSmsSending));
      form.querySelectorAll('input, button:not(.login-appearance):not(.login-demo-entry)').forEach(el => { el.disabled = state.loginBusy || state.loginSmsSending; });
      form.querySelectorAll('[data-action="login-entry"]').forEach(el => { const selected = el.dataset.value === state.loginEntry; el.setAttribute('aria-checked', String(selected)); el.tabIndex = selected ? 0 : -1; });
      form.querySelectorAll('[data-action="login-method"]').forEach(el => { const selected = el.dataset.value === state.loginMethod; el.setAttribute('aria-selected', String(selected)); el.tabIndex = selected ? 0 : -1; });
      form.querySelector('#login-password-panel').hidden = state.loginMethod !== 'password';
      form.querySelector('#login-sms-panel').hidden = state.loginMethod !== 'sms';
      const tab = form.querySelector('[role="tab"][aria-selected="true"]');
      const strip = form.querySelector('.login-methods');
      if (tab && strip) { strip.style.setProperty('--login-tab-x', tab.offsetLeft + 'px'); strip.style.setProperty('--login-tab-width', tab.offsetWidth + 'px'); }
      const submit = form.querySelector('#login-submit');
      submit.textContent = state.loginBusy ? '正在登录…' : '登录';
      const feedback = document.querySelector('#login-feedback');
      if (feedback) {
        feedback.classList.toggle('error', Boolean(state.loginError));
        feedback.innerHTML = loginFeedbackContent();
      }
      const send = document.querySelector('[data-action="login-send-code"]');
      if (send) send.textContent = loginSmsButtonLabel();
      if (send) send.disabled = state.loginBusy || state.loginSmsSending || !state.loginValues.phone.trim() || Date.now() < state.loginSmsDeadline;
      document.querySelectorAll('[data-login-value]').forEach(input => {
        const invalid = state.loginInvalid.includes(input.dataset.loginValue);
        input.setAttribute('aria-invalid', String(invalid));
        input.closest('.login-input').classList.toggle('invalid', invalid);
      });
    }

    function rememberLoginValues() {
      document.querySelectorAll('[data-login-value]').forEach(input => { state.loginValues[input.dataset.loginValue] = input.value; });
    }

    function bindLoginInputs() {
      const form = document.querySelector('#login-form');
      updateLoginFeedback();
      form?.addEventListener('submit', event => { event.preventDefault(); submitDemoLogin(); });
      form?.querySelectorAll('[data-login-value]').forEach(input => {
        input.addEventListener('input', () => {
          state.loginValues[input.dataset.loginValue] = input.value;
          if (input.dataset.loginValue === 'phone') { state.loginSmsHint = ''; state.loginValues.code = ''; document.querySelector('#login-code').value = ''; }
          state.loginError = '';
          state.loginInvalid = [];
          updateLoginFeedback();
        });
      });
      const password = document.querySelector('#login-password');
      const caps = event => { state.loginCapsLock = Boolean(event.getModifierState?.('CapsLock')); updateLoginFeedback(); };
      password?.addEventListener('keydown', caps);
      password?.addEventListener('keyup', caps);
      password?.addEventListener('blur', () => { state.loginCapsLock = false; updateLoginFeedback(); });
      form?.querySelectorAll('[role="radiogroup"], [role="tablist"]').forEach(group => {
        group.addEventListener('keydown', event => {
          if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)) return;
          event.preventDefault();
          const controls = [...group.querySelectorAll('button')];
          const current = controls.indexOf(document.activeElement);
          const index = event.key === 'Home' ? 0 : event.key === 'End' ? controls.length - 1 : (current + (['ArrowRight','ArrowDown'].includes(event.key) ? 1 : -1) + controls.length) % controls.length;
          controls[index].click();
        });
      });
    }

    function loginFail(message, fields) {
      state.loginError = message;
      state.loginInvalid = fields;
      state.loginBusy = false;
      updateLoginFeedback();
      document.querySelector(`#login-${fields[0]}`)?.focus({preventScroll: false});
    }

    function loginPhone() { return state.loginValues.phone.replace(/[\s()-]/g, '').replace(/^\+86/, ''); }

    function showLoginDialog(title, body, footer = '') {
      state.loginDialog = { title, body, footer };
      state.overlay = 'login-dialog';
      renderFloating();
    }

    function renderLoginDialog() {
      const dialog = state.loginDialog;
      return `<div class="overlay" data-action="overlay-bg"><section class="modal" style="width:min(440px,100%)" role="dialog" aria-modal="true" aria-label="${escapeHTML(dialog.title)}"><header class="modal-head"><strong>${escapeHTML(dialog.title)}</strong><button type="button" class="btn ghost icon-btn close" data-action="close-overlay" aria-label="关闭">${icon('close')}</button></header><div class="modal-body">${dialog.body}</div><footer class="modal-foot">${dialog.footer || '<button type="button" class="btn primary" data-action="close-overlay">知道了</button>'}</footer></section></div>`;
    }

    function sendDemoCode() {
      if (!LOGIN_OPTIONS.sms || state.loginBusy || state.loginSmsSending || Date.now() < state.loginSmsDeadline) return;
      rememberLoginValues();
      const phone = loginPhone();
      if (!/^1[3-9]\d{9}$/.test(phone)) { loginFail('请输入有效的 11 位手机号', ['phone']); return; }
      state.loginError = ''; state.loginInvalid = [];
      state.loginSmsSending = true;
      state.loginSmsHint = '本地演示，不发送真实短信';
      updateLoginFeedback();
      const attempt = loginAttempt;
      setTimeout(() => {
        if (attempt !== loginAttempt || state.authenticated) return;
        state.loginSmsSending = false;
        state.loginSmsPhone = phone;
        state.loginSmsExpires = Date.now() + 5 * 60 * 1000;
        state.loginSmsDeadline = Date.now() + 60 * 1000;
        state.loginSmsHint = '演示验证码 123456 · 未发送短信';
        updateLoginFeedback();
        clearInterval(loginSmsTimer);
        const tick = () => {
          const button = document.querySelector('[data-action="login-send-code"]');
          if (button) {
            button.textContent = loginSmsButtonLabel();
            button.disabled = state.loginBusy || state.loginSmsSending || !state.loginValues.phone.trim() || Date.now() < state.loginSmsDeadline;
          }
          if (Date.now() >= state.loginSmsDeadline) { clearInterval(loginSmsTimer); loginSmsTimer = null; }
        };
        tick(); loginSmsTimer = setInterval(tick, 500);
        if (state.loginMethod === 'sms' && !state.overlay) document.querySelector('#login-code')?.focus();
      }, 420);
    }

    function submitDemoLogin() {
      if (state.loginBusy || state.loginSmsSending || state.overlay || !LOGIN_OPTIONS[state.loginEntry]) return;
      rememberLoginValues();
      const v = state.loginValues;
      if (state.loginMethod === 'password') {
        if (!v.account.trim()) { loginFail('请输入账号', ['account']); return; }
        // Deliberately do not trim or normalize passwords.
        if (!v.password) { loginFail('请输入密码', ['password']); return; }
      } else {
        if (!/^1[3-9]\d{9}$/.test(loginPhone())) { loginFail('请输入有效的 11 位手机号', ['phone']); return; }
        if (!/^\d{6}$/.test(v.code)) { loginFail('请输入 6 位验证码', ['code']); return; }
        if (state.loginSmsPhone !== loginPhone()) { loginFail('请先为当前手机号获取验证码', ['code']); return; }
        if (Date.now() >= state.loginSmsExpires) { loginFail('演示验证码已过期，请重新获取', ['code']); return; }
      }
      state.loginError = ''; state.loginInvalid = []; state.loginBusy = true;
      const attempt = ++loginAttempt;
      updateLoginFeedback();
      setTimeout(() => {
        if (attempt !== loginAttempt) return;
        const valid = state.loginMethod === 'password' ? v.account.trim() === LOGIN_DEMO.account && v.password === LOGIN_DEMO.password : v.code === LOGIN_DEMO.code;
        if (!valid) { loginFail(state.loginMethod === 'password' ? '账号或密码不正确，请使用演示账号' : '验证码不正确，请重新输入', state.loginMethod === 'password' ? ['password'] : ['code']); return; }
        state.loginBusy = false;
        state.authenticated = true;
        state.loginValues.password = ''; state.loginValues.code = '';
        state.loginPasswordVisible = false; state.loginCapsLock = false;
        state.loginSmsSending = false;
        clearInterval(loginSmsTimer); loginSmsTimer = null;
        state.overlay = null; state.drawer = null;
        state.page = state.loginEntry === 'mobile' ? 'mobile-tasks' : 'dashboard';
        state.dashboardView = 'tasks'; state.previewState = 'data';
        state.mobileMain = 'tasks'; state.mobileTab = 'todo'; state.mobileQuick = 'all'; state.mobileScreen = 'list';
        state.mobileOptionsOpen = false; state.mobileTaskId = null; state.mobileProgressId = null;
        state.mobileSearch = ''; state.mobileVisibleCount = 4;
        renderAll();
        window.scrollTo(0, 0);
        toast(state.loginEntry === 'mobile' ? '已进入手机版（本地演示）' : '已进入电脑版（本地演示）');
      }, 650);
    }

    function endDemoLogin() {
      ++loginAttempt; clearInterval(loginSmsTimer); loginSmsTimer = null;
      state.authenticated = false; state.overlay = null; state.drawer = null;
      state.loginBusy = false; state.loginError = ''; state.loginInvalid = [];
      state.loginValues.password = ''; state.loginValues.code = '';
      state.loginPasswordVisible = false; state.loginCapsLock = false;
      state.loginSmsSending = false; state.loginSmsPhone = ''; state.loginSmsDeadline = 0; state.loginSmsHint = '';
      state.floatingStack = []; state.actionContext = null;
      document.body.classList.remove('nav-open');
      document.querySelector('#toasts').innerHTML = '';
      renderAll();
      window.scrollTo(0, 0);
    }

    function handleLoginAction(action, target, event) {
      if (action === 'account-logout' || action === 'mobile-logout') { endDemoLogin(); return true; }
      if (!state.authenticated) rememberLoginValues();
      if (!state.authenticated && ['set-accent','set-mode'].includes(action)) {
        const key = action === 'set-accent' ? 'accent' : 'mode';
        state[key] = target.dataset.value;
        localStorage.setItem(`erp-prototype-v8-${key}`, state[key]);
        applyTheme(); renderFloating(); // Keep form nodes / autofill / return-focus intact.
        return true;
      }
      if (action === 'login-theme') { state.overlay = 'theme'; renderFloating(); return true; }
      if (action === 'login-password-visibility') {
        state.loginPasswordVisible = !state.loginPasswordVisible;
        const input = document.querySelector('#login-password');
        input.type = state.loginPasswordVisible ? 'text' : 'password';
        target.innerHTML = loginIcon(state.loginPasswordVisible ? 'eye' : 'eyeOff');
        target.setAttribute('aria-label', state.loginPasswordVisible ? '隐藏密码' : '显示密码');
        target.setAttribute('aria-pressed', String(state.loginPasswordVisible));
        return true;
      }
      if (action === 'login-entry' || action === 'login-method') {
        if (state.loginBusy || state.loginSmsSending) return true;
        if (action === 'login-entry') { state.loginEntry = target.dataset.value; localStorage.setItem('erp-login-entry', state.loginEntry); }
        else { state.loginValues.password = ''; state.loginValues.code = ''; document.querySelector('#login-password').value = ''; document.querySelector('#login-password').type = 'password'; document.querySelector('#login-code').value = ''; state.loginMethod = target.dataset.value; localStorage.setItem('erp-login-method', state.loginMethod); state.loginPasswordVisible = false; }
        state.loginError = ''; state.loginInvalid = []; state.loginCapsLock = false;
        const value = target.dataset.value;
        updateLoginFeedback();
        document.querySelector(`[data-action="${action}"][data-value="${value}"]`)?.focus({preventScroll:true});
        return true;
      }
      if (action === 'login-submit') { submitDemoLogin(); return true; }
      if (action === 'login-send-code') { sendDemoCode(); return true; }
      if (action === 'login-privacy' || action === 'login-rules') {
        showLoginDialog(action === 'login-privacy' ? '个人信息处理规则' : '系统使用规则', '<p class="login-dialog-copy">本地原型仅演示规则入口。正式内容沿用系统现有的规则页面，不另行拟定。</p>');
        return true;
      }
      if (action === 'login-demo') {
        showLoginDialog('演示账号', `<p class="login-dialog-copy">仅用于查看本地交互，不会连接真实业务系统。请勿输入真实凭据。</p><dl class="login-demo-facts"><dt>账号</dt><dd>admin</dd><dt>密码</dt><dd>demo123456</dd><dt>手机号</dt><dd>13800000000（示例）</dd><dt>验证码</dt><dd>123456（先点击获取）</dd></dl>`, '<button type="button" class="btn" data-action="close-overlay">关闭</button><button type="button" class="btn primary" data-action="login-fill-demo">填入演示信息</button>');
        return true;
      }
      if (action === 'login-fill-demo') {
        if (state.loginBusy || state.loginSmsSending) return true;
        Object.assign(state.loginValues, LOGIN_DEMO);
        if (state.loginMethod === 'sms') state.loginValues.code = '';
        state.overlay = null; state.loginError = ''; state.loginInvalid = [];
        renderAll();
        document.querySelector(state.loginMethod === 'sms' ? '[data-action="login-send-code"]' : '#login-submit')?.focus();
        return true;
      }
      return false;
    }


    function ensureAppShell() {
      const app = document.querySelector('.app');
      if (document.querySelector('#sidebar')) return;
      app.innerHTML = `<aside class="sidebar" id="sidebar"></aside><div class="scrim" data-action="close-nav"></div><section class="shell"><header class="topbar" id="topbar"></header><main class="main"><div id="view" class="view"></div></main></section>`;
    }

    function renderAll() {
      document.documentElement.classList.toggle('login-document', !state.authenticated);
      applyTheme();
      if (!state.authenticated) {
        document.body.classList.add('login-page');
        document.querySelector('.app').innerHTML = renderLoginPage();
        bindLoginInputs();
        renderFloating();
        document.title = LOGIN_BRAND.companyName + ' · 登录 · 本地交互预览';
        return;
      }
      document.body.classList.remove('login-page');
      document.title = LOGIN_BRAND.companyName + ' · ' + titleForPage() + ' · 本地交互预览';
      ensureAppShell();
      renderSidebar(); renderTopbar(); renderView(); renderFloating();
    }

    function queueAttachmentFiles(fileList) {
      [...(fileList || [])].forEach((file,index) => {
        const tooLarge = file.size > 100 * 1024 * 1024;
        state.attachmentFiles.push({
          id: `ATT-${Date.now()}-${index}`,
          name: file.name,
          kind: file.type?.startsWith('image/') ? 'image' : 'file',
          size: formatFileSize(file.size),
          status: tooLarge ? 'failed' : 'pending',
          progress: tooLarge ? 0 : 0,
          uploader: '当前账号',
          time: '刚刚',
          url: file.type?.startsWith('image/') ? URL.createObjectURL(file) : '',
          error: tooLarge ? '文件超过 100 MB' : ''
        });
      });
      renderFloating();
    }

    function openAttachmentManager(context = 'business', owner = '') {
      state.attachmentReturnOverlay = state.overlay && state.overlay !== 'attachments' ? state.overlay : null;
      state.attachmentReturnDrawer = state.drawer || null;
      state.attachmentContext = context;
      state.attachmentOwner = owner || state.drawer?.row?.no || [...state.selected][0] || (state.page === 'entity-form' ? '当前编辑草稿' : '当前业务对象');
      state.attachmentMode = 'all';
      state.attachmentExpanded.clear();
      state.drawer = null;
      state.overlay = 'attachments';
      renderFloating();
    }

    function closeAttachmentManager() {
      if (state.attachmentFiles.some(file=>file.status==='uploading')) {
        toast('附件正在上传，请等待完成后关闭');
        return;
      }
      state.overlay = state.attachmentReturnOverlay;
      state.drawer = state.attachmentReturnDrawer;
      state.attachmentReturnOverlay = null;
      state.attachmentReturnDrawer = null;
      renderFloating();
    }

    function bindInputs() {
      document.querySelectorAll('[data-form-field]').forEach(el=>el.addEventListener('input',()=>{
        const previousType=state.formValues.party;captureFormDraft();
        if(state.formSourcePage==='inventory'&&el.dataset.formField==='party'&&previousType!==el.value){
          for(const input of document.querySelectorAll('[data-form-field^="qty-"], [data-form-field^="to-"]')){state.formValues[input.dataset.formField]='';input.value='';}
        }
        updateCompactFormSummaries();
      }));
      document.querySelector('#mobile-review-scope')?.addEventListener('change', e => {
        state.mobileReviewRole = e.target.value;
        state.mobileScreen = 'list'; state.mobileTaskId = null; state.mobileOptionsOpen = false;
        state.mobileSearch = ''; state.mobileVisibleCount = 4; state.mobileScrollTop = 0;
        renderView(); document.querySelector('#mobile-review-scope')?.focus();
      });
      document.querySelector('#list-search')?.addEventListener('input', e => { state.search = e.target.value; state.pageNo = 1; renderView(); document.querySelector('#list-search')?.focus(); setCaretEnd(document.querySelector('#list-search')); });
      document.querySelector('#board-search')?.addEventListener('input', e => { state.boardSearch = e.target.value; renderView(); document.querySelector('#board-search')?.focus(); setCaretEnd(document.querySelector('#board-search')); });
      document.querySelector('#board-role')?.addEventListener('change', e => { state.boardRole = e.target.value; renderView(); });
      document.querySelector('#progress-search')?.addEventListener('input', e => { state.progressSearch = e.target.value; renderView(); document.querySelector('#progress-search')?.focus(); setCaretEnd(document.querySelector('#progress-search')); });
      document.querySelector('#production-route-order')?.addEventListener('change', e => { state.productionRouteOrder = e.target.value; refreshVisual(); });
      document.querySelector('#production-route-search')?.addEventListener('input', e => { state.productionRouteSearch = e.target.value; renderView(); document.querySelector('#production-route-search')?.focus(); setCaretEnd(document.querySelector('#production-route-search')); });
      document.querySelector('#arrival-search')?.addEventListener('input', e => { state.arrivalSearch = e.target.value; renderView(); document.querySelector('#arrival-search')?.focus(); setCaretEnd(document.querySelector('#arrival-search')); });
      document.querySelector('#delivery-search')?.addEventListener('input', e => { state.deliverySearch = e.target.value; renderView(); document.querySelector('#delivery-search')?.focus(); setCaretEnd(document.querySelector('#delivery-search')); });
      document.querySelector('#finance-due-search')?.addEventListener('input', e => { state.financeDueSearch = e.target.value; renderView(); document.querySelector('#finance-due-search')?.focus(); setCaretEnd(document.querySelector('#finance-due-search')); });

    function handleCompactAction(action,target) {
      if(action==='open-compact-action'){openCompactAction(target.dataset.kind,target.dataset.page);return true;}
      if(action==='compact-add'){compactAction.rows.push(newCompactActionRow(compactAction.kind,compactAction.rows.length));renderFloating();const input=document.querySelector(`[data-compact-row="${compactAction.rows.length-1}"]`);focusAppendedLine(input?.closest('tbody'),input);return true;}
      if(action==='compact-remove'){compactAction.rows.splice(Number(target.dataset.index),1);renderFloating();return true;}

        if(!document.querySelector('.compact-action-form').reportValidity())return true;

      } else {
        const details = `<dl class="detail-grid"><dt>${config.entity}号</dt><dd>${copyValue(row.no)}</dd><dt>${config.party}</dt><dd>${copyValue(rowParty(row,config))}</dd><dt>负责人</dt><dd>${row.owner}</dd><dt>${config.item}</dt><dd>${copyValue(rowItem(row,config))}</dd><dt>明细数量</dt><dd>${row.lines} 条</dd><dt>${config.dateLabel}</dt><dd>${rowDate(row)}</dd><dt>${config.metricLabel}</dt><dd>${rowMetric(row,config)}</dd><dt>当前进度</dt><dd>${row.progress}</dd><dt>业务提醒</dt><dd><span class="badge ${row.risk==='已逾期'?'danger':row.risk==='临近交付'?'warning':''}">${row.risk}</span></dd></dl>`;

      }
      if(state.detailTab==='basic')body+=renderVisualRecordFacts(row,config);

    // These examples describe presentation only; they never query or advance a business process.
    function renderTaskDrawer(task) {
      if (task.lane === 'done') {
        const receipt = task.receipt || { action:'完成本岗', feedback:'该任务已完成并保留办理记录。', status:task.state };
        return `<div class="drawer-layer" data-action="drawer-bg"><aside class="drawer" role="dialog" aria-modal="true"><header class="drawer-head"><strong>任务结果</strong><span class="badge ${task.badge}">${receipt.status}</span><button class="btn ghost icon-btn close" data-action="close-drawer" aria-label="关闭">${icon('close')}</button></header><div class="drawer-body"><section class="detail-section"><h3>${escapeHTML(task.title)}</h3><dl class="detail-grid"><dt>业务对象</dt><dd>${task.object}</dd><dt>责任岗位</dt><dd>${task.role}</dd><dt>办理动作</dt><dd>${receipt.action}</dd><dt>完成时间</dt><dd>${task.time}</dd></dl><div class="rm-callout" style="margin-top:12px"><strong>办理说明</strong><div style="margin-top:5px">${escapeHTML(receipt.feedback)}</div></div></section>${task.manualFollowup?`<section class="detail-section"><h3>任务要求</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(task.description)}</p>${task.receipt&&task.lane==='done'?`<h3>处理结果</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(task.receipt.feedback)}</p>`:''}</section>`:''}${renderTaskSourceSummary(task)}<section class="detail-section"><h3>结果与业务边界</h3><p style="margin:0;color:var(--text-2);line-height:1.65">任务结果只证明当前岗位已完成责任；对应库存、生产、出货或财务事实仍从业务单据查看。</p></section></div><footer class="drawer-foot"><button class="btn" data-action="detail-attachments" data-value="任务附件">${icon('paperclip')}查看附件</button><button class="btn primary" data-action="close-drawer">完成</button></footer></aside></div>`;
      }
      if(task.sourceAction)return `<div class="drawer-layer" data-action="drawer-bg"><aside class="drawer" role="dialog" aria-modal="true" aria-label="任务办理"><header class="drawer-head"><strong>任务办理</strong><button class="btn close" data-action="close-drawer">关闭</button></header><div class="drawer-body">${renderTaskStep(task)}</div><footer class="drawer-foot"><button class="btn primary" data-action="task-context-open" data-page="${task.sourcePage}" data-id="${task.sourceRecordId}">${task.sourceAction}</button></footer></aside></div>`;
      const step = state.taskStep;
      return `<div class="drawer-layer" data-action="drawer-bg"><aside class="drawer" role="dialog" aria-modal="true"><header class="drawer-head"><strong>任务办理</strong><span class="badge ${task.badge}">${task.state}</span><button class="btn ghost icon-btn close" data-action="close-drawer" aria-label="关闭">${icon('close')}</button></header><div class="task-steps">${[['1','核对任务'],['2','选择处理'],['3','确认与结果']].map(([n,label]) => { const number=Number(n); const enabled=number<=state.taskMaxStep||number===step+1; return `<button type="button" class="task-step ${step===number?'active':''} ${number<=state.taskMaxStep?'visited':''}" data-action="task-step" data-value="${number}" ${step===number?'aria-current="step"':''} ${enabled?'':'disabled'}><i>${n}</i><span>${label}</span></button>`; }).join('')}</div><div class="drawer-body">${renderTaskStep(task)}</div><footer class="drawer-foot"><button class="btn" data-action="detail-attachments" data-value="任务附件">${icon('paperclip')}查看附件</button>${step>1?'<button class="btn" data-action="task-prev">上一步</button>':''}<button class="btn primary" data-action="task-next">${step===3?'确认办理':'下一步'}</button></footer></aside></div>`;
    }

    function taskActions(task) {
      const actions = task.lane === 'done' || task.sourceAction ? [] : task.actions || [];
      const preferred = task.approval ? ['complete','done','reject','rejected','resume'] : ['complete','done','block','blocked','resume'];
      const prioritized = preferred.filter(action=>actions.includes(action));
      return [...new Set([...prioritized,...actions])];
    }

    function taskActionLabel(task,action) {
      return {complete:task.approval?'审批通过':'完成本岗',block:'标记阻塞',reject:task.approval?'审批退回':'退回任务',resume:'解除阻塞',assign:'转交任务',urge:'催办'}[action] || '';
    }

    function taskActionRequiresReason(task,action) { return action !== 'complete' || task.approval || task.manualFollowup; }

    function getTaskSourceSummary(task) { return task.sourceSummary || (task.facts ? {title:'来源信息',columns:['项目','任务记录'],rows:task.facts,note:'当前任务保存的来源摘要；正式业务结果以来源单据为准。'} : null); }

    function renderTaskSourceSummary(task) {
      if(task.materialSummarySource)return `<section class="source-summary"><button class="btn" data-action="open-material-summary" data-id="${task.materialSummarySource}">查看材料汇总</button></section>`;
      const summary = getTaskSourceSummary(task);
      if(!summary)return '';
      return `<details class="detail-section source-summary"><summary class="text-btn">查看${summary.title}明细（${summary.rows.length} 项）</summary><div class="source-summary-table" style="margin-top:12px"><table><thead><tr>${summary.columns.map(label=>`<th>${escapeHTML(label)}</th>`).join('')}</tr></thead><tbody>${summary.rows.map(row=>`<tr>${row.map(value=>`<td>${escapeHTML(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source-summary-note">${summary.note}</p></details>`;
    }

      return {products,materials:[
        {name:'短毛绒 2mm',color:'米白',code:'ML-1001',supplier:'样例布行',spec:'58 英寸',unit:'码',quantity:parts.reduce((sum,part)=>sum+part.total,0),stock:'1,680',note:'按确认色样裁剪；同一产品应使用同一染色批次，余料需保留批次标记，避免不同部位出现色差。',parts},
        {name:'塑料眼 12mm',color:'黑色',code:'ML-1002',supplier:'样例辅料厂',spec:'12mm',unit:'个',quantity:2448.24,stock:'9,000',note:'颜色按样板',parts:[{product:products[0],position:'眼部',usage:2,loss:1,total:2448.24}]},
        {name:'包装外箱',color:'原色',code:'ML-1003',supplier:'样例包装厂',spec:'5 只装',unit:'件',quantity:242.4,stock:'500',note:'按订单分别包装',parts:[{product:products[0],position:'包装',usage:0.2,loss:0,total:242.4}]}
      ]};

        <header class="modal-head"><strong>材料汇总 · ${row.no}</strong><span class="badge ${status==='已退回'?'warning':'info'}">${status}</span><button class="btn ghost icon-btn close" data-action="close-drawer" aria-label="关闭材料汇总">${icon('close')}</button></header>
        <div class="material-summary-body">
