          <div class="material-summary-toolbar"><strong>${materials.length} 种材料</strong></div>
          <p class="material-summary-basis">采购口径：财务批准后，采购订单按本表总用数量生成；当前库存仅供参考，未自动抵扣。</p>
          <div class="material-summary-table"><table><colgroup><col style="width:54px"><col style="width:54px"><col style="width:170px"><col style="width:180px"><col style="width:100px"><col style="width:60px"><col style="width:120px"><col style="width:120px"><col style="width:260px"></colgroup><thead><tr>${['明细','序号','材料品名','厂商料号 / 厂商','规格','单位','总用数量','当前库存','材料备注'].map((name,index)=>`<th${[6,7].includes(index)?' class="number"':''}>${name}</th>`).join('')}</tr></thead><tbody>${materials.map((item,index)=>`<tr><td><button class="btn icon-btn" data-action="material-expand" data-index="${index}" aria-expanded="false" aria-controls="material-parts-${index}" aria-label="查看${item.name}部位用量">+</button></td><td>${index+1}</td><td><strong>${item.name}</strong><small>${item.color}</small></td><td>${item.code}<small>${item.supplier}</small></td><td>${item.spec}</td><td>${item.unit}</td><td class="number"><strong>${number(item.quantity)}</strong></td><td class="number">${item.stock}</td><td>${item.note.length>40?`<details><summary>查看完整备注</summary><p>${item.note}</p></details>`:item.note}</td></tr><tr id="material-parts-${index}" class="material-summary-parts" hidden><td colspan="9"><div class="material-summary-part-table"><table><thead><tr>${['产品 / 订单行','BOM','部位','片数','单位用量','损耗 %','生产数量','含损耗用量','加工 / 备注'].map((label,i)=>`<th${i>=3&&i<=7?' class="number"':''}>${label}</th>`).join('')}</tr></thead><tbody>${item.parts.map(part=>`<tr><td>${escapeHTML(part.product.name)} · 第 ${products.indexOf(part.product)+1} 行</td><td>${part.product.bom}</td><td>${part.position}</td><td class="number">1</td><td class="number">${part.usage}</td><td class="number">${part.loss}</td><td class="number">${number(part.product.quantity)}</td><td class="number">${part.total}</td><td>${item.note.length>40?`<details><summary>查看完整备注</summary><p>${item.note}</p></details>`:item.note}</td></tr>`).join('')}</tbody></table></div></td></tr>`).join('')}</tbody></table></div>
          <div class="material-summary-totals"><strong>全部材料用量</strong>${materials.map(item=>`<span>${number(item.quantity)} ${item.unit}</span>`).join('')}</div>
          <details class="material-summary-help"><summary>查看用料计算与采购生成依据</summary><ol><li>生产数量为订单数量加船头样数量。</li><li>部位用量为生产数量乘 BOM 单位用量，再计入损耗率；片数已含在单位用量中，不重复相乘。</li><li>相同材料和单位合并，不同单位分别合计。汇总显示两位小数，展开保留计算精度。</li><li>财务批准后按厂商生成采购订单，单价、金额和预计到货日期后续补充；生成采购单不表示到货或入库。</li></ol><p>提交审批时冻结订单、BOM 和用量依据，后续资料变化不会自动改写；需要调整时先退回工程重新整理。</p><p>库存为有权查看的仓库账面结存，读取于 2026-09-26 10:00；不表示为本订单预留，也不自动抵扣采购数量。</p></details>
        </div></section></div>`;
    }

    function observeMaterialSummaryOverflow() {
      syncDashboardSummaryScroll();
    }

    function renderTaskStep(task) {
      if (state.taskStep === 1 || task.sourceAction) {
        const source = listConfig[task.sourcePage]?.rows.find(row=>row.id===task.sourceRecordId);
        return `<section class="detail-section"><h3>${escapeHTML(task.title)}</h3><dl class="detail-grid"><dt>业务对象</dt><dd>${task.object}</dd><dt>当前岗位</dt><dd>${task.role}</dd><dt>时间</dt><dd>${task.time}</dd></dl>${task.reason?`<div class="rm-callout" style="margin-top:13px"><strong>当前原因</strong><div>${escapeHTML(task.reason)}</div></div>`:''}</section>${task.manualFollowup?`<section class="detail-section"><h3>任务要求</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(task.description)}</p>${task.receipt&&task.lane==='done'?`<h3>处理结果</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(task.receipt.feedback)}</p>`:''}</section>`:''}${renderTaskSourceSummary(task)}<section class="detail-section"><h3>来源与处理记录</h3>${source?`<button class="btn" data-action="task-context-open" data-page="${task.sourcePage}" data-id="${source.id}">查看来源单据 ${source.no}</button>`:'<span class="data-note">来源记录待核对</span>'}${task.sourceAction?`<p>${task.sourceAction}，在来源业务中提交并查看结果。</p>`:''}${task.history?.length?`<div class="timeline" style="margin-top:12px">${task.history.map(([label,time])=>`<div class="timeline-item"><strong>${escapeHTML(label)}</strong><small>${escapeHTML(time)}</small></div>`).join('')}</div>`:''}</section>`;
      }
      if (state.taskStep === 2) {
        const actions = taskActions(task);
        const choice = key => `<button class="action-choice ${state.taskAction===key?'active':''}" aria-pressed="${state.taskAction===key}" data-action="task-choice" data-value="${key}"><strong>${taskActionLabel(task,key)}</strong><span>${{complete:'记录本岗处理结果。',block:'说明当前卡点。',reject:'说明退回原因及需要补充的内容。',resume:'说明卡点如何解除。',assign:'转给同一负责岗位的接收人或退回共同待办。',urge:'记录催办原因，不改变任务状态。'}[key]}</span></button>`;
        return `<section class="detail-section"><h3>选择处理方式</h3><div class="action-choice-grid">${actions.map(choice).join('')}</div></section>`;
      }
      const required = taskActionRequiresReason(task,state.taskAction);
      const fieldLabel = state.taskAction==='complete'?(task.approval?'审批意见':task.manualFollowup?'处理结果':'办理说明'):'处理原因';
      return `<section class="detail-section"><h3>确认办理结果</h3><dl class="detail-grid"><dt>任务</dt><dd>${escapeHTML(task.title)}</dd><dt>处理方式</dt><dd>${taskActionLabel(task,state.taskAction)}</dd></dl>${state.taskAction==='assign'?`<div class="field task-result-field ${state.taskError==='target'?'error':''}"><label for="task-target">同岗位接收人 *</label><select id="task-target"><option value="">请选择接收人</option><option value="pool" ${state.taskTarget==='pool'?'selected':''}>${task.role}共同待办</option>${(task.candidates||[]).map(([id,name])=>`<option value="${id}" ${state.taskTarget===id?'selected':''}>${name}</option>`).join('')}</select>${state.taskError==='target'?'<span class="error-text">请选择同岗位接收人或共同待办</span>':''}</div>`:''}<div class="field task-result-field ${state.taskError==='note'?'error':''}"><label for="task-note">${fieldLabel}${required?' *':'（可选）'}</label><textarea id="task-note" placeholder="填写本次处理的依据、结果或注意事项">${escapeHTML(state.taskNote)}</textarea>${state.taskError==='note'?`<span class="error-text">请填写${fieldLabel}</span>`:''}</div><p class="source-summary-note">${state.taskAction==='urge'?'本次只记录催办，不改变任务状态，也不表示已送达站外通知。':'本次只更新协同任务；库存、出货和财务事实仍需在所属单据确认。'}</p></section>`;
    }

    function toast(message) {
      const el = document.createElement('div'); el.className = 'toast'; el.textContent = message; document.querySelector('#toasts').appendChild(el); setTimeout(() => el.remove(), 2600);
    }

    function setNavigationOpen(open, restoreFocus = true) {
      const wasOpen = document.body.classList.contains('nav-open');
      const sidebar = document.querySelector('#sidebar');
      const shell = document.querySelector('.shell');
      document.body.classList.toggle('nav-open', open);
      document.querySelector('[data-action="open-nav"]')?.setAttribute('aria-expanded', String(open));
      if (shell) shell.inert = open;
      if (open) {
        sidebar?.setAttribute('role', 'dialog');
        sidebar?.setAttribute('aria-modal', 'true');
        sidebar?.setAttribute('aria-label', '模块导航');
        sidebar?.querySelector('.nav-item.active, button')?.focus();
      } else {
        sidebar?.removeAttribute('role');
        sidebar?.removeAttribute('aria-modal');
        sidebar?.removeAttribute('aria-label');
        if (wasOpen && restoreFocus) requestAnimationFrame(() => document.querySelector('[data-action="open-nav"]')?.focus());
      }
    }

    function navigate(page) {
      if(state.page==='permissions' && page!==state.page && (state.permissionDirty||state.permissionAccountDirty||state.permissionApprovalDirty)){requestPermissionNavigation(()=>{state.permissionAccountEditor=null;navigate(page);});return;}
      if (state.page === 'entity-form' && state.formDirty) { state.pendingNav = page; state.overlay = 'confirm-nav'; renderFloating(); return; }
      rememberEntity();
      if (state.previewState === 'stress' && !listConfig[page] && !moduleHubs[page]) state.previewState = 'data';
      state.page=page;state.overlay=null;state.drawer=null;state.floatingStack=[];state.actionContext=null;
      const config=currentPageConfig();if(config)restoreEntity(config.key);
      state.boundaryAllResults=false;state.boundaryExcluded.clear();
      setNavigationOpen(false);renderAll();
    }

    function openEntityForm(configKey, mode = 'create', recordId = null) {
      const config = listConfig[configKey];
      if (!config || config.readOnly || config.workflow) return;
      rememberEntity();
      state.formReturnPage = state.page === 'entity-form' ? state.formReturnPage : state.page;
      state.formSourcePage = configKey;
      state.formMode = mode;
      state.formRecordId = recordId;
      state.formDirty = false;
      state.formErrors = {};
      state.contactNotesOpen = {};
      state.formValues = {};
      state.lineCount = mode === 'edit' ? 3 : ['sales','purchase','bom','outsourcing'].includes(configKey) ? 0 : 1;
      state.formReadonlyRows=[];state.formLineIds=Array.from({length:state.lineCount},()=>`line-${++state.lineSerial}`);
      const draft=formDrafts.get(`${configKey}:${recordId}`);
      if(draft){state.formValues={...draft.values};state.formLineIds=[...draft.ids];state.formReadonlyRows=draft.readonly.map(row=>[...row]);state.lineCount=draft.ids.length;}
      else if(mode==='edit'){const row=config.rows.find(item=>item.id===recordId);if(row){state.formValues={party:rowParty(row,config),owner:row.owner,date:isoDay(rowDate(row)),currency:row.currency==='USD'?'美元（USD）':'人民币（CNY）','item-0':rowItem(row,config)};}}
      state.drawer = null;
      state.overlay = null;
      state.page = 'entity-form';
      renderAll();
    }

    function returnToMobileList() {
      state.mobileScreen = 'list';
      state.mobileTaskId = null;
      state.mobileReason = '';
      state.mobileError = '';
      state.mobileReceipt = null;
      renderView();
      requestAnimationFrame(() => {
        const scroll = document.querySelector('#mobile-task-scroll');
        if (scroll) scroll.scrollTop = state.mobileScrollTop;
      });
    }

    document.addEventListener('click', event => {
      const dateInput = event.target.closest(
        'input[type="date"], input[type="datetime-local"]'
      );
      if (
        dateInput &&
        !dateInput.disabled &&
        !dateInput.readOnly &&
        typeof dateInput.showPicker === 'function'
      ) {
        try { dateInput.showPicker(); } catch {}
      }
    });

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if(handleDevDesignAction(action,target))return;
      if(handleLoginAction(action,target,event))return;
      if(handleRevisionAction(action,target))return;

      if (action === 'nav') { if (target.dataset.page==='print') state.printTab='samples'; navigate(target.dataset.page); }
      else if (action === 'toggle-sidebar') { state.sidebarCollapsed = !state.sidebarCollapsed; renderSidebar(); document.querySelector('[data-action="toggle-sidebar"]')?.focus(); }
      else if (action === 'module-tab') { rememberEntity();state.moduleTabs[state.page]=target.dataset.value;restoreEntity(target.dataset.value);state.overlay=null;state.drawer=null;renderAll(); }
      else if (action === 'open-route-view') navigate(target.dataset.page);
      else if (action === 'open-catalog') { state.overlay = 'catalog'; state.catalogSearch = ''; renderFloating(); }
      else if (action === 'catalog-nav') { const page = target.dataset.page; if (page==='print') state.printTab='samples'; state.overlay = null; navigate(page); }
      else if (action === 'preview-state') {
        state.previewState = target.dataset.value;state.overlay=null;
        if (state.previewState === 'stress' && visualMode()!=='list') {state.visualLarge[currentPageConfig().key]=true;state.previewState='data';state.visualPages[currentPageConfig().key]=1;} else if(state.previewState==='stress'){state.page='sales';state.salesView='list';state.pageNo=1;state.overlay=null;state.boundaryAllResults=false;state.boundaryExcluded.clear();state.selected=new Set(['EDGE-1','EDGE-2','EDGE-3']);}
        renderAll();
      }
      else if (action === 'state-reset') { state.previewState = 'data'; state.status = 'all'; state.search = ''; state.pageNo = 1; state.selected.clear(); state.boundaryAllResults = false; state.boundaryExcluded.clear(); state.boundaryMoreOpen = false; resetListFilters(); renderAll(); }
      else if (action === 'state-retry') { state.previewState = 'data'; renderAll(); toast('已重新读取当前页面'); }
      else if (action === 'state-home') { state.previewState = 'data'; navigate('dashboard'); }
      else if (action === 'open-mobile-tasks') {
        state.mobileMain = 'tasks'; state.mobileTab = 'todo'; state.mobileQuick = 'all'; state.mobileScreen = 'list';
        state.mobileTaskId = null; state.mobileOptionsOpen = false; state.mobileSearch = ''; state.mobileVisibleCount = 4;
        navigate('mobile-tasks');
      }
      else if (action === 'open-nav') setNavigationOpen(true);
      else if (action === 'close-nav') setNavigationOpen(false);
      else if (action === 'open-account') { state.overlay = state.overlay === 'account' ? null : 'account'; renderAll(); }
      else if (action === 'account-entry') { state.overlay = null; navigate('tasks'); toast('已切换到桌面工作入口'); }
      else if (action === 'account-password') { state.infoModal = { title: '修改密码', html: '<div class="field"><label>当前密码</label><input type="password" /></div><div class="field" style="margin-top:10px"><label>新密码</label><input type="password" /></div><div class="field" style="margin-top:10px"><label>确认新密码</label><input type="password" /></div>' }; state.overlay='info'; renderFloating(); }
      else if (action === 'account-legal') { state.infoModal = { title: '隐私与使用规则', body: '系统仅按岗位授权处理业务资料；请勿共享账号、导出无关客户数据或绕过正式单据写入业务事实。' }; state.overlay='info'; renderFloating(); }
      else if (action === 'account-system') { state.infoModal = { title: '系统信息', html: '<dl class="detail-grid"><dt>版本</dt><dd>2026.09</dd><dt>构建</dt><dd>统一界面交互评审稿 V8</dd><dt>当前入口</dt><dd>电脑端</dd><dt>登录岗位</dt><dd>超级管理员</dd></dl>' }; state.overlay='info'; renderFloating(); }
      else if (action === 'mobile-main') {
        state.mobileMain = target.dataset.value;
        state.mobileScreen = 'list'; state.mobileTaskId = null; state.mobileProgressId = null; state.mobileOptionsOpen = false;
        state.mobileSearch = ''; state.mobileVisibleCount = 4;
        if (state.mobileMain === 'risk') state.mobileQuick = 'risk';
        else if (state.mobileMain === 'tasks') state.mobileQuick = 'all';
        renderView();
      }
      else if (action === 'mobile-tab') { state.mobileTab = target.dataset.value; state.mobileQuick = 'all'; state.mobileStatus = ''; state.mobileVisibleCount = 4; renderView(); }
      else if (action === 'mobile-quick') { state.mobileQuick = target.dataset.value; state.mobileVisibleCount = 4; renderView(); }
      else if (action === 'mobile-more') { state.mobileVisibleCount += 4; renderView(); }
      else if (action === 'mobile-refresh') toast('岗位任务已刷新');
      else if (action === 'mobile-options') { state.mobileOptionsOpen = !state.mobileOptionsOpen; renderView(); }
      else if (action === 'mobile-options-close') { state.mobileOptionsOpen = false; renderView(); }
      else if (action === 'mobile-options-bg' && event.target === target) { state.mobileOptionsOpen = false; renderView(); }
      else if (action === 'mobile-sort') { state.mobileSort = target.dataset.value; state.mobileVisibleCount = 4; renderView(); }
      else if (action === 'mobile-status') { state.mobileStatus = target.dataset.value; state.mobileVisibleCount = 4; renderView(); }
      else if (action === 'mobile-options-reset') { state.mobileSort = 'newest'; state.mobileStatus = ''; state.mobileVisibleCount = 4; renderView(); }
      else if (action === 'mobile-progress-view') { state.mobileProgressView = target.dataset.value; state.mobileProgressRisk = 'all'; state.mobileOptionsOpen = false; renderView(); }
      else if (action === 'mobile-progress-risk') { state.mobileProgressRisk = target.dataset.value; renderView(); }
      else if (action === 'mobile-progress-scope') { state.mobileProgressScope = target.dataset.value; renderView(); }

      else if (action === 'mobile-progress-detail-group') { state.mobileProgressDetailGroup = target.dataset.value; renderView(); }
      else if (action === 'mobile-open-production-progress') { state.mobileProgressId = 'MP03'; state.mobileProgressDetailsOpen = false; state.mobileProgressDetailGroup = 'products'; renderView(); }
      else if (action === 'mobile-open-linked-task') {
        state.mobileMain = 'tasks'; state.mobileTaskId = target.dataset.id; state.mobileScreen = 'detail'; state.mobileAction = getMobileTask()?.actions?.[0] || 'done'; renderView();

    }
    function financeProjection(row) {
      const outstanding=row.finance?.outstanding??null;const due=isoDay(row.date);const delta=dayDelta(due);const status=row.status==='cancelled'?'cancelled':row.status==='draft'?'draft':outstanding===null?'unknown':outstanding===0?'settled':!due?'undated':delta<0?'overdue':delta<=7?'due':'normal';
      const labels={cancelled:'已取消',draft:'草稿待过账',unknown:'余额待核对',settled:'已结清',undated:'未填到期日',overdue:`逾期 ${Math.abs(delta)} 天`,due:delta===0?'今天到期':`${delta} 天后到期`,normal:'未到期'};
      return {id:row.id,record:row,fact:row.no,source:row.source||'',party:row.party,owner:row.owner,due,amount:row.amount,outstanding,currency:row.currency||'CNY',status,statusText:labels[status],badge:status==='overdue'?'danger':status==='due'||status==='undated'?'warning':status==='settled'?'success':''};
    }
    function visualBaseRows(key) {
      if(key==='sales')return listConfig.sales.rows.map(deliveryProjection);
      if(['receivables','payables'].includes(key))return listConfig[key].rows.map(financeProjection);
      if(key==='purchase')return listConfig.purchase.rows.map(row=>{const date=row.arrival?.planned??isoDay(rowDate(row));const confirmed=!!row.arrival?.confirmed;return {id:row.id,record:row,no:row.no,supplier:row.supplier||row.party,material:row.material||row.item,owner:row.owner,quantity:row.arrival?.quantity||'数量待核对',date,confirmed,status:['done','completed','closed'].includes(row.status)?'completed':row.status==='cancelled'?'cancelled':!date?'undated':dayDelta(date)<0?'overdue':confirmed?'confirmed':'pending'};});
      if(key==='production-records')return productionRouteRows.map(row=>({...row,record:listConfig.production.rows.find(item=>item.no===row.order)}));
      return listConfig[key].rows.map(row=>({id:row.id,record:row}));
    }
    function visualRows(key) {
      const base=visualBaseRows(key);let rows=base;
      if(state.visualLarge[key])rows=Array.from({length:500},(_,index)=>{const source=base[index%base.length];if(index<base.length)return source;const id=`large-${key}-${index}`;const record={...source.record,id,no:`${source.record?.no||source.order}-${String(index).padStart(3,'0')}`,previewOnly:true};return {...source,id,record:key==='production-records'?source.record:record,order:key==='production-records'?source.order:record.no,fact:record.no,no:record.no,product:source.product?`${source.product} · 加长名称与规格样例 ${index}`:source.product};});
      rows.forEach(row=>visualRecords.set(`${key}:${row.id}`,row));
      const q=state.search.trim().toLowerCase(),party=state.filterParty.trim().toLowerCase();
      return rows.filter(row=>{const record=row.record||{};const hay=JSON.stringify(row).toLowerCase();const statusOk=key==='production-records'||state.status==='all'||record.status===state.status;const endedOk=state.filterIncludeEnded||state.status!=='all'||!['done','completed','settled','shipped','closed','cancelled','archived','inactive','obsolete','reversed'].includes(record.status);const ownerOk=state.filterOwner==='all'||row.owner===state.filterOwner||record.owner===state.filterOwner;const riskOk=state.filterRisk==='all'||record.risk===state.filterRisk||(state.filterRisk==='near'&&record.risk==='临近交付')||(state.filterRisk==='blocked'&&record.status==='blocked');const date=row.date||row.due||isoDay(rowDate(record));return (!q||hay.includes(q))&&(!party||hay.includes(party))&&statusOk&&endedOk&&ownerOk&&riskOk&&(!state.filterDateFrom||(date&&date>=state.filterDateFrom))&&(!state.filterDateTo||(date&&date<=state.filterDateTo));});
    }
    function visualPage(rows,key) { const pages=Math.max(1,Math.ceil(rows.length/25));const page=Math.min(Math.max(1,state.visualPages[key]||1),pages);state.visualPages[key]=page;return {rows:rows.slice((page-1)*25,page*25),page,pages,total:rows.length}; }
    function renderVisualPager(p,key) { return `<footer class="visual-footer"><span>${p.total} 条 · 每页最多 25 条${state.visualLarge[key]?' · 大量数据样例':''}</span><div class="pager"><button class="btn" data-action="visual-page" data-value="${p.page-1}" ${p.page===1?'disabled':''}>上一页</button><span>${p.page} / ${p.pages}</span><button class="btn" data-action="visual-page" data-value="${p.page+1}" ${p.page===p.pages?'disabled':''}>下一页</button></div></footer>`; }
    function visualChip(action,value,label,count,active) {return `<button type="button" class="visual-chip ${active?'active':''}" aria-pressed="${active}" data-action="${action}" data-value="${value}">${label}${count===undefined?'':`<b>${count}</b>`}</button>`;}
    function renderVisualToolbar(config,hub,chips,placeholder) {
      return `${renderHubTabsRow(hub,config)}${renderBusinessViewRow(config)}<section class="surface operation-surface"><div class="visual-controls"><div class="visual-chips">${chips}</div><div class="visual-query"><label class="search">${icon('search')}<input id="visual-search" aria-label="搜索当前业务" value="${escapeHTML(state.search)}" placeholder="${placeholder}"/></label>${state.search?'<button class="btn" data-action="visual-clear-search">清除搜索</button>':''}<button class="btn" data-action="open-filter">${icon('filter')}筛选${activeFilterCount()?` ${activeFilterCount()}`:''}</button><button class="btn" data-action="export">${icon('export')}导出</button><button class="btn" data-action="visual-stress" aria-pressed="${!!state.visualLarge[config.key]}">${state.visualLarge[config.key]?'恢复常规样例':'500 条样例'}</button></div></div>${state.status!=='all'?`<div class="visual-scope">沿用列表状态：${escapeHTML(config.statuses.find(item=>item[0]===state.status)?.[1]||state.status)}<button class="text-btn" data-action="visual-clear-status">清除状态条件</button></div>`:''}</section>`;
    }
    function visibleDataState(operation,title) {return state.previewState!=='data'?`${operation}${renderDataState({title})}`:null;}
    function arrivalSelectionMatches(item,selection) { const delta=dayDelta(item.date);if(selection==='overdue')return item.status==='overdue';return selection==='all'?true:selection==='today'?delta===0:selection==='week'?delta!==null&&delta>=0&&delta<=7:selection==='undated'?!item.date:item.date===selection; }
    function renderProductionOverview(config,hub) {
      const all=visualRows(config.key);const options=[['all','全部订单'],['overdue','计划逾期'],['due','7 天内结束'],['undated','未排结束日']];const chips=options.map(([value,label])=>visualChip('production-overview-filter',value,label,all.filter(row=>productionOverviewMatches(row,value)).length,state.productionOverviewFilter===value)).join('');const operation=renderVisualToolbar(config,hub,chips,'搜索生产订单、产品或负责人');const empty=visibleDataState(operation,'生产总览');if(empty)return empty;const p=visualPage(all.filter(row=>productionOverviewMatches(row,state.productionOverviewFilter)),config.key);
      return `${operation}<section class="surface data-surface"><div class="priority-list-scroll"><div class="production-overview-list">${p.rows.map(({record})=>`<article class="production-overview-row"><button class="overview-identity" data-action="overview-open" data-id="${record.id}"><strong>${record.no}</strong><span>${escapeHTML(rowItem(record,config))}</span></button><span>计划结束 ${rowDate(record)}</span><span class="badge">${record.statusText}</span><button class="btn" data-action="overview-process" data-value="${record.no}" ${productionRouteRows.some(row=>row.order===record.no)?'':'disabled title="此样例尚未发布工序路线"'}>查看工序 →</button></article>`).join('')||'<div class="empty">没有匹配的生产订单</div>'}</div></div>${renderVisualPager(p,config.key)}</section>`;
    }
    function productionOverviewMatches(row,filter) {
      if(filter==='all')return true;if(['completed','closed','cancelled'].includes(row.record.status))return false;const delta=dayDelta(isoDay(rowDate(row.record)));return filter==='overdue'?delta!==null&&delta<0:filter==='undated'?delta===null:delta!==null&&delta>=0&&delta<=7;
    }

    function findVisualRecord(key,id) {return visualRecords.get(`${key}:${id}`)||visualBaseRows(key).find(row=>row.id===id);}
    function openLinkedRecord(key,record) {
      if(!record)return;rememberScroll();
      if(state.overlay||state.drawer)state.floatingStack.push({overlay:state.overlay,drawer:state.drawer,infoModal:state.infoModal,detailTab:state.detailTab,actionContext:state.actionContext,returnFocus:document.activeElement?.dataset?{...document.activeElement.dataset}:null});
      state.overlay=null;state.drawer={type:'detail',row:record,page:key};state.detailTab='basic';state.actionContext={page:key,recordId:record.id};renderFloating();
    }
    function closeLinkedDrawer() {
      const previous=state.floatingStack.pop();
      const returnFocus=previous?.returnFocus;
      if(previous){const {returnFocus:ignored,taskScroll:ignoredScroll,...context}=previous;Object.assign(state,context);}
      else{state.drawer=null;state.overlay=null;state.taskStep=1;state.actionContext=null;}
      renderFloating();
      if(previous?.taskScroll!==undefined){const body=document.querySelector('.drawer-body');if(body)body.scrollTop=previous.taskScroll;}
      if(returnFocus?.action){const trigger=[...document.querySelectorAll('#floating [data-action]')].find(node=>Object.entries(returnFocus).every(([key,value])=>node.dataset[key]===value));trigger?.focus({preventScroll:true});}
    }
    function showProcessDetail(id,index,milestone) {
      const row=findVisualRecord('production-records',id);if(!row)return;const stage=milestone?row[milestone]:row.processes[index];const label=milestone==='quality'?'质检结果':milestone==='inbound'?'成品入库':productionRouteStages[index]?.[1];
      state.infoModal={title:`${label} · ${row.product}`,html:`<dl class="detail-grid"><dt>生产订单</dt><dd>${row.order}</dd><dt>产品 / SKU</dt><dd>${escapeHTML(row.product)} · ${row.sku}</dd><dt>状态</dt><dd>${stage.status}</dd><dt>责任岗位</dt><dd>${stage.owner}</dd><dt>数量 / 结果</dt><dd>${stage.meta}</dd><dt>说明</dt><dd>${stage.detail}</dd></dl>`,links:[{label:'打开生产订单',key:'production',id:row.record.id}]};state.overlay='info';renderFloating();
    }
    function renderVisualRecordFacts(row,config) {
      if(config.key==='sales'&&row.fulfillment){const item=deliveryProjection(row);return `<section class="detail-section"><h3>交付数量</h3><dl class="detail-grid"><dt>订购</dt><dd>${item.ordered} ${item.unit}</dd><dt>已出货</dt><dd>${item.shipped===null?'待核对':item.shipped+' '+item.unit}</dd><dt>剩余待交</dt><dd>${item.remaining===null?'待核对':item.remaining+' '+item.unit}</dd><dt>交付状态</dt><dd>${item.statusText}</dd></dl></section>`;}
      if(['receivables','payables'].includes(config.key)){const item=financeProjection(row);const sourceEntry=Object.entries(listConfig).flatMap(([key,cfg])=>cfg.rows.filter(source=>source.no===item.source).map(source=>({key,source})))[0];return `<section class="detail-section"><h3>账款核对</h3><dl class="detail-grid"><dt>原金额</dt><dd>${formatCurrency(item.amount,item.currency)}</dd><dt>未结金额</dt><dd>${formatCurrency(item.outstanding,item.currency)}</dd><dt>到期日期</dt><dd>${displayDate(item.due)}</dd><dt>来源单据</dt><dd>${sourceEntry?`<button class="text-btn" data-action="open-linked-record" data-page="${sourceEntry.key}" data-id="${sourceEntry.source.id}">${item.source} →</button>`:item.source||'待补充'}</dd></dl></section>`;}
      if(config.key==='purchase'&&row.arrival)return `<section class="detail-section"><h3>到货安排</h3><dl class="detail-grid"><dt>计划数量</dt><dd>${row.arrival.quantity}</dd><dt>到货日期</dt><dd>${displayDate(row.arrival.planned)}</dd><dt>供应商确认</dt><dd>${row.arrival.confirmed?'已确认':'待确认'}</dd></dl></section>`;
      return '';
    }
    function exportCurrentRows() {
      if(state.page==='dashboard'&&state.dashboardView==='summary'){
        const summary=workbenchSummaries[state.dashboardSummaryType]||workbenchSummaries.materials;
        const rows=filteredDashboardSummaryRows(summary).map(row=>row.values);
        downloadCSV(`${summary.label}.csv`,[summary.columns,...rows]);toast(`已导出 ${rows.length} 行`);return;
      }
      if(state.page==='progress'){
        const q=state.progressSearch.trim().toLowerCase();const rows=mobileProgressRows.filter(row=>row.view===state.progressView&&(state.progressRisk==='all'||row.risk===state.progressRisk)&&(!q||Object.values(row).join(' ').toLowerCase().includes(q)));
        downloadCSV('进度汇总.csv',[['单号','客户','产品','交期','当前阶段','状态'],...rows.map(row=>[row.no,row.customer,row.product,row.due,row.stage,row.status])]);toast(`已导出 ${rows.length} 行`);return;
      }
      const config=currentPageConfig();if(!config){toast('请先进入需要导出的业务页面');return;}
      let rows=[],columns=[];
      if(visualMode(config.key)!=='list'){
        let values=visualRows(config.key);
        if(config.key==='sales'){values=values.filter(item=>state.deliveryFilter==='all'||(state.deliveryFilter==='attention'?['overdue','due','unknown','undated','closed'].includes(item.status):item.status==='delivered'));columns=['订单','客户','产品','交付日期','订购数量','已出货','待交','单位','状态'];rows=values.map(item=>[item.order,item.customer,item.product,displayDate(item.date),item.ordered,item.shipped,item.remaining,item.unit,item.statusText]);}
        else if(config.key==='purchase'){values=values.filter(item=>arrivalSelectionMatches(item,state.arrivalSelected)&&(state.arrivalFilter==='all'||(state.arrivalFilter==='confirmed'?item.confirmed:!item.confirmed||item.status==='overdue')));columns=['采购单','供应商','物料','数量','到货日期','确认'];rows=values.map(item=>[item.no,item.supplier,item.material,item.quantity,displayDate(item.date),item.confirmed?'已确认':'待确认']);}
        else if(['receivables','payables'].includes(config.key)){values=values.filter(item=>state.financeDueFilter==='all'||item.status===state.financeDueFilter);columns=['账款','来源','往来方','到期日','原金额','未结金额','币种','状态'];rows=values.map(item=>[item.fact,item.source,item.party,displayDate(item.due),item.amount,item.outstanding,item.currency,item.statusText]);}
        else if(config.key==='production-records'){values=values.filter(row=>row.order===state.productionRouteOrder&&(state.productionRouteFilter==='all'||row.processes.some(stage=>['review','blocked'].includes(stage.state))||['review','blocked'].includes(row.quality.state)));columns=['生产订单','产品','SKU','工序','状态','责任岗位','数量'];rows=values.flatMap(row=>row.processes.map((stage,index)=>[row.order,row.product,row.sku,productionRouteStages[index][1],stage.status,stage.owner,stage.meta]));}
        else if(config.key==='production'){columns=['生产单号','产品','计划结束','状态','负责人'];rows=values.filter(row=>productionOverviewMatches(row,state.productionOverviewFilter)).map(({record})=>[record.no,rowItem(record,config),rowDate(record),record.statusText,record.owner]);}
      }
      if(!columns.length){columns=['单号',config.party,config.item,'日期','状态','负责人'];rows=getFilteredRows(config).map(row=>[row.no,rowParty(row,config),rowItem(row,config),rowDate(row),row.statusText,row.owner]);}
      downloadCSV(`${config.title}-${visualMode(config.key)}.csv`,[columns,...rows]);toast(`已导出 ${rows.length} 行`);
    }
    function downloadCSV(name,rows) {const cell=value=>{let text=value===null||value===undefined?'待核对':String(value);if(/^[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const blob=new Blob(['\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

    function bindRevisionInputs() {
      document.querySelector('#visual-search')?.addEventListener('input',event=>{const value=event.target.value,position=event.target.selectionStart;state.search=value;refreshVisual();const input=document.querySelector('#visual-search');input?.focus();input?.setSelectionRange(position,position);});
      document.querySelector('#arrival-date-jump')?.addEventListener('change',event=>{const value=isoDay(event.target.value);if(value){state.arrivalStart=value;state.arrivalSelected=value;refreshVisual();}});
      document.querySelector('#arrival-confirmation')?.addEventListener('change',event=>{state.arrivalFilter=event.target.value;refreshVisual();});
    }
    function handleRevisionAction(action,target) {
      if(handleCompactAction(action,target))return true;
      if(['copy-line','remove-line','add-line','add-material-group','line-up','line-down'].includes(action)){editFormLine(action,target);return true;}
      if(action==='visual-stress'){const key=currentPageConfig().key;state.visualLarge[key]=!state.visualLarge[key];refreshVisual();return true;}
      if(action==='visual-page'){state.visualPages[currentPageConfig().key]=Number(target.dataset.value);scrollContexts.delete(scrollKey());renderView();return true;}
      if(action==='visual-clear-search'){state.search='';refreshVisual();return true;}
      if(action==='visual-clear-status'){state.status='all';refreshVisual();return true;}
      if(action==='arrival-period'){state.arrivalStart=addDays(state.arrivalStart,Number(target.dataset.value));state.arrivalSelected=state.arrivalStart;refreshVisual();return true;}
      if(action==='arrival-today'){state.arrivalStart=DEMO_TODAY;state.arrivalSelected='today';refreshVisual();return true;}
      if(action==='production-view'){switchBusinessView('productionView',target.dataset.value);return true;}
      if(action==='production-overview-filter'){state.productionOverviewFilter=target.dataset.value;refreshVisual();return true;}
      if(action==='overview-open'){openLinkedRecord('production',findVisualRecord('production',target.dataset.id)?.record);return true;}
      if(action==='overview-process'){rememberEntity();state.moduleTabs['production-hub']='production-records';restoreEntity('production-records');state.productionRouteOrder=target.dataset.value;state.productionRecordsView='route';renderAll();return true;}
      if(action==='route-open-order'){openLinkedRecord('production',listConfig.production.rows.find(row=>row.no===state.productionRouteOrder));return true;}
      if(action==='open-linked-record'){const config=listConfig[target.dataset.page];openLinkedRecord(config.key,config.rows.find(row=>row.id===target.dataset.id));return true;}
      if(action==='production-milestone-open'){showProcessDetail(target.dataset.id,0,target.dataset.value);return true;}
      if(action==='delivery-open'){openLinkedRecord('sales',findVisualRecord('sales',target.dataset.id)?.record);return true;}
      if(action==='arrival-open'){openLinkedRecord('purchase',findVisualRecord('purchase',target.dataset.id)?.record);return true;}
      if(action==='finance-due-open'){const key=currentPageConfig().key;openLinkedRecord(key,findVisualRecord(key,target.dataset.id)?.record);return true;}
      if(action==='production-stage-open'){showProcessDetail(target.dataset.id,Number(target.dataset.index));return true;}
      if(action==='export'){exportCurrentRows();return true;}
      return false;
    }

    seedVisualRecords();
    applyTheme(); renderAll();
  </script>
</body>
</html>
