workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|trigger|web)$/ && $RELEASE_SHA && $RELEASE_VERSION && $RELEASE_VERSION_REFERENCE'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - plan
  - prepare
  - quality
  - aggregate
  - gate
  - release

default:
  tags:
    - plush
    - isolated
    - amd64
  interruptible: true
  before_script:
    - umask 077
    - export PNPM_STORE_PATH="$CI_PROJECT_DIR/output/cache/gitlab/pnpm-store"
    - export npm_config_store_dir="$PNPM_STORE_PATH"
    - export PLAYWRIGHT_RUNTIME_ARCHIVE_DIR="$CI_PROJECT_DIR/output/cache/gitlab/playwright-runtime"
    - export PLAYWRIGHT_BROWSERS_PATH="$CI_PROJECT_DIR/output/runtime/gitlab/playwright-$CI_JOB_ID"
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - test "$(node --version)" = "v$(tr -d '\n' < .n-node-version)"
    - test "$(go env GOVERSION)" = "go1.26.6"
    - test "$(go env CGO_ENABLED)" = "1"
    - test "$(pnpm --version)" = "10.13.1"
    - test "$(docker buildx version | awk '{print $2; exit}')" = "0.30.1"
    - test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"
    - test "$(atlas version 2>/dev/null | sed -n 's/^atlas version \([^ ]*\).*/\1/p')" = "v1.2.0"
    - test "$(gitleaks version)" = "8.30.1"
    - test "$CI_PROJECT_PATH" = "saurick/plush-toy-erp"
    - test "$CI_DEFAULT_BRANCH" = "main"

variables:
  CI: "true"
  DISPOSABLE_DATABASE_BASE_URL: "postgres://postgres:ci-local-password@127.0.0.1:55432/postgres?sslmode=disable"
  RELEASE_CUSTOMER: "yoyoosun"
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

.cache_pull: &cache_pull
  cache:
    key:
      prefix: r640-node-24.14.0-playwright-v2
      files:
        - scripts/qa/ci-playwright-runtime.mjs
        - web/pnpm-lock.yaml
    paths:
      - output/cache/gitlab/pnpm-store/
      - output/cache/gitlab/playwright-runtime/
    policy: pull

.main_quality_rules: &main_quality_rules
  rules:
    - if: '$RELEASE_SHA'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

plan:
  stage: plan
  rules:
    - if: '$RELEASE_SHA'
      when: never
    - when: on_success
  script:
    - |
      set -euo pipefail
      zero=0000000000000000000000000000000000000000
      empty_tree="$(git hash-object -t tree /dev/null)"
      trusted_config_sha=HEAD
      if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]; then
        test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        range="$CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD"
        history_range="$(git merge-base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD)..HEAD"
        trusted_config_sha="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        mode=affected
      elif [[ "$CI_PIPELINE_SOURCE" == "push" ]]; then
        if [[ "$CI_COMMIT_BEFORE_SHA" == "$zero" ]]; then
          range="$empty_tree..HEAD"
          history_range=HEAD
        else
          git cat-file -e "$CI_COMMIT_BEFORE_SHA^{commit}"
          range="$CI_COMMIT_BEFORE_SHA..HEAD"
          history_range="$range"
          trusted_config_sha="$CI_COMMIT_BEFORE_SHA"
        fi
        mode=full
      else
        if git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
          range="HEAD^..HEAD"
          history_range="$range"
        else
          range="$empty_tree..HEAD"
          history_range=HEAD
        fi
        mode="${QA_MODE:-full}"
      fi
      case "$mode" in affected|full) ;; *) echo "[gitlab-ci] invalid QA_MODE=$mode"; exit 1 ;; esac
      git diff --check "$range"
      git log --check --format= "$history_range"
      trusted_config="$(mktemp)"
      trap 'rm -f "$trusted_config"' EXIT
      git show "$trusted_config_sha:.gitleaks.toml" > "$trusted_config"
      trusted_config_blob="$(git rev-parse "$trusted_config_sha:.gitleaks.toml")"
      gitleaks git --config "$trusted_config" --log-opts "$history_range" --no-banner --redact "$CI_PROJECT_DIR"
      mkdir -p output/ci
      node scripts/qa/ci-plan.mjs \
        --range "$range" \
        --mode "$mode" \
        --out output/ci/plan.json
      printf '%s\n' "$range" > output/ci/range.txt
      protected=false
      [[ "${CI_COMMIT_REF_PROTECTED:-false}" == "true" ]] && protected=true
      jq -n \
        --arg schemaVersion 'plush.gitlab-ci-trust/v1' \
        --arg repository "$CI_PROJECT_PATH" \
        --arg gitSha "$CI_COMMIT_SHA" \
        --arg pipelineId "$CI_PIPELINE_ID" \
        --arg pipelineIid "$CI_PIPELINE_IID" \
        --arg pipelineSource "$CI_PIPELINE_SOURCE" \
        --arg jobId "$CI_JOB_ID" \
        --arg jobName "$CI_JOB_NAME" \
        --arg ref "refs/heads/$CI_COMMIT_REF_NAME" \
        --arg range "$range" \
        --arg planSha256 "$(sha256sum output/ci/plan.json | awk '{print $1}')" \
        --arg rangeSha256 "$(sha256sum output/ci/range.txt | awk '{print $1}')" \
        --arg trustedConfigCommit "$(git rev-parse "$trusted_config_sha")" \
        --arg trustedConfigBlob "$trusted_config_blob" \
        --arg gitleaksVersion '8.30.1' \
        --arg gitleaksStatus passed \
        --argjson protected "$protected" \
        '{schemaVersion:$schemaVersion,repository:$repository,gitSha:$gitSha,pipeline:{id:$pipelineId,iid:$pipelineIid,source:$pipelineSource},job:{id:$jobId,name:$jobName},ref:$ref,protectedDefaultBranch:$protected,range:$range,planSha256:$planSha256,rangeSha256:$rangeSha256,trustedConfigCommit:$trustedConfigCommit,trustedConfigBlob:$trustedConfigBlob,gitleaksVersion:$gitleaksVersion,gitleaksStatus:$gitleaksStatus,redaction:{containsSecrets:false,containsCredentials:false,containsRawLogs:false}}' \
        > output/ci/trust.json
  artifacts:
    expire_in: 30 days
    paths:
      - output/ci/plan.json
      - output/ci/range.txt
      - output/ci/trust.json

prepare:
  stage: prepare
  timeout: 1h
  needs:
    - job: plan
      artifacts: false
  <<: *main_quality_rules
  cache:
    key:
      prefix: r640-node-24.14.0-playwright-v2
      files:
        - scripts/qa/ci-playwright-runtime.mjs
        - web/pnpm-lock.yaml
    paths:
      - output/cache/gitlab/pnpm-store/
      - output/cache/gitlab/playwright-runtime/
    policy: pull-push
  script:
    - |
      set -euo pipefail
      pnpm --dir web install --frozen-lockfile
      node scripts/qa/ci-playwright-runtime.mjs seed
      (cd server && go mod download)
      test -d "$PNPM_STORE_PATH"
      test -d "$PLAYWRIGHT_RUNTIME_ARCHIVE_DIR"
      test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
      echo "[gitlab-ci] cache=prepared sha=$CI_COMMIT_SHA"

.quality_shard: &quality_shard
  stage: quality
  <<: *main_quality_rules
  timeout: 2h

quality_static:
  <<: *quality_shard
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard static
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/static.json

quality_node:
  <<: *quality_shard
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard node
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/node.json

quality_web:
  <<: [*quality_shard, *cache_pull]
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard web
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/web.json
      - web/build/

quality_server:
  <<: [*quality_shard, *cache_pull]
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard server
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/server.json

quality_resource:
  <<: *quality_shard
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard resource
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/resource.json

quality_browser:
  <<: [*quality_shard, *cache_pull]
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
    - job: quality_web
      artifacts: true
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard browser
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/browser.json

quality_security:
  <<: *quality_shard
  needs:
    - job: plan
      artifacts: true
    - job: prepare
      artifacts: false
  script:
    - node scripts/qa/ci-quality-shard.mjs --shard security
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/shards/security.json

quality_aggregate:
  stage: aggregate
  <<: *main_quality_rules
  needs:
    - job: plan
      artifacts: true
    - job: quality_static
      artifacts: true
    - job: quality_node
      artifacts: true
    - job: quality_web
      artifacts: true
    - job: quality_server
      artifacts: true
    - job: quality_resource
      artifacts: true
    - job: quality_browser
      artifacts: true
    - job: quality_security
      artifacts: true
  script:
    - node scripts/qa/ci-quality-aggregate.mjs
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - output/ci/quality-aggregate.json
      - output/ci/evidence/
      - output/qa/exact-sha/
      - output/dev-workbench/receipts/

quality_affected:
  stage: quality
  <<: *cache_pull
  needs:
    - job: plan
      artifacts: true
  rules:
    - if: '$RELEASE_SHA'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  timeout: 2h
  script:
    - |
      set -euo pipefail
      plan_file=output/ci/plan.json
      range_file=output/ci/range.txt
      test "$(jq -r '.schemaVersion' "$plan_file")" = "plush.ci-plan/v2"
      effective_mode="$(jq -er '.effectiveMode | select(. == "affected" or . == "full")' "$plan_file")"
      make_data="$(jq -r '.flags.makeData' "$plan_file")"
      needs_chromium="$(jq -r '.flags.needsChromium' "$plan_file")"
      needs_postgres="$(jq -r '.flags.needsPostgres' "$plan_file")"
      needs_web="$(jq -r '.flags.needsWeb' "$plan_file")"
      source_archive="$(jq -r '.flags.sourceArchive' "$plan_file")"
      for boolean_value in "$make_data" "$needs_chromium" "$needs_postgres" "$needs_web" "$source_archive"; do
        case "$boolean_value" in true|false) ;; *) echo "[gitlab-ci] plan flag is not boolean"; exit 1 ;; esac
      done
      range="$(tr -d '\n' < "$range_file")"
      [[ "$range" =~ ^([0-9a-f]{40}|HEAD\^)\.\.\.?HEAD$ ]]
      postgres_name="plush-ci-postgres-$CI_PIPELINE_ID-$CI_JOB_ID"
      sandbox_path=""
      runtime_materialized=false
      cleanup() {
        cleanup_status=0
        if docker inspect "$postgres_name" >/dev/null 2>&1; then
          docker rm --force "$postgres_name" >/dev/null || cleanup_status=1
        fi
        if [[ -n "$sandbox_path" ]]; then
          sudo /usr/local/sbin/plush-remove-chromium-sandbox "$CI_JOB_ID" || cleanup_status=1
        fi
        if [[ "$runtime_materialized" == "true" ]]; then
          node scripts/qa/ci-playwright-runtime.mjs cleanup || cleanup_status=1
        fi
        return "$cleanup_status"
      }
      trap cleanup EXIT
      if [[ "$needs_postgres" == "true" ]]; then
        docker run --detach --rm \
          --name "$postgres_name" \
          --env POSTGRES_PASSWORD=ci-local-password \
          --publish 127.0.0.1::5432 \
          --health-cmd 'pg_isready -U postgres' \
          --health-interval 2s \
          --health-timeout 5s \
          --health-retries 30 \
          postgres:18.1
        for attempt in {1..30}; do
          health="$(docker inspect --format '{{.State.Health.Status}}' "$postgres_name")"
          [[ "$health" == "healthy" ]] && break
          [[ "$health" == "unhealthy" ]] && exit 1
          sleep 2
        done
        test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_name")" = healthy
        postgres_port="$(docker port "$postgres_name" 5432/tcp | sed -n 's/^127[.]0[.]0[.]1:\([0-9][0-9]*\)$/\1/p')"
        [[ "$postgres_port" =~ ^[0-9]+$ ]]
        export DISPOSABLE_DATABASE_BASE_URL="postgres://postgres:ci-local-password@127.0.0.1:$postgres_port/postgres?sslmode=disable"
      fi
      if [[ "$needs_web" == "true" || "$needs_chromium" == "true" ]]; then
        pnpm --dir web install --frozen-lockfile
      fi
      if [[ "$needs_web" == "true" ]]; then
        pnpm --dir web audit --prod --audit-level high --registry=https://registry.npmjs.org
      fi
      if [[ "$needs_chromium" == "true" ]]; then
        node scripts/qa/ci-playwright-runtime.mjs materialize
        runtime_materialized=true
        chrome_path="$(node -e 'const { chromium } = require("./web/node_modules/playwright"); process.stdout.write(chromium.executablePath())')"
        sandbox_source="$(dirname "$chrome_path")/chrome_sandbox"
        sandbox_path="/usr/local/sbin/chrome-devel-sandbox-$CI_JOB_ID"
        test -x "$chrome_path"
        test -f "$sandbox_source"
        sudo install -o root -g root -m 4755 "$sandbox_source" "$sandbox_path"
        export CHROME_DEVEL_SANDBOX="$sandbox_path"
        export ERP_PDF_CHROME_PATH="$chrome_path"
      fi
      if [[ "$make_data" == "true" ]]; then
        (cd server && make data)
        test -z "$(git status --porcelain --untracked-files=all)"
      fi
      if [[ "$effective_mode" == "affected" ]]; then
        bash scripts/qa/affected.sh --base "$range" --run
      else
        node scripts/qa/run-gate-with-receipt.mjs --gate full
      fi
      if [[ "$source_archive" == "true" ]]; then
        node scripts/deploy/source-archive-release-check.mjs --light --ref HEAD
      fi
      test -z "$(git status --porcelain --untracked-files=all)"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - output/ci/
      - output/dev-workbench/receipts/

"CI Gate":
  stage: gate
  needs:
    - job: quality_aggregate
      artifacts: true
      optional: true
    - job: quality_affected
      artifacts: false
      optional: true
  rules:
    - if: '$RELEASE_SHA'
      when: never
    - when: on_success
  script:
    - |
      set -euo pipefail
      if [[ "$CI_PIPELINE_SOURCE" == "push" ]]; then
        test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
        test "$CI_COMMIT_REF_PROTECTED" = true
        evidence_dir=output/ci/evidence
        for asset in terminal.json receipt.json evidence-manifest.json; do
          test -s "$evidence_dir/$asset"
        done
        package_version="pipeline-$CI_PIPELINE_ID-job-$CI_JOB_ID-$CI_COMMIT_SHA"
        for asset in terminal.json receipt.json evidence-manifest.json; do
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 300 \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$evidence_dir/$asset" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/plush-ci-evidence/$package_version/$asset"
        done
        echo "[gitlab-ci] evidence=published package=$package_version"
      fi
      echo "[gitlab-ci] status=complete sha=$CI_COMMIT_SHA source=$CI_PIPELINE_SOURCE"

publish_release:
  stage: release
  interruptible: false
  rules:
    - if: '$RELEASE_SHA && $RELEASE_VERSION && $RELEASE_VERSION_REFERENCE && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_CUSTOMER == "yoyoosun"'
    - when: never
  timeout: 4h
  environment:
    name: release
  resource_group: immutable-release-catalog
  script:
    - |
      set -euo pipefail
      test "$RELEASE_SHA" = "$CI_COMMIT_SHA"
      test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
      test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
      test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
      test "$CI_COMMIT_REF_PROTECTED" = "true"
      test "$RELEASE_CUSTOMER" = yoyoosun
      test -n "$RELEASE_VERSION_REFERENCE"
      [[ "$RELEASE_VERSION" =~ ^[0-9A-Za-z]([0-9A-Za-z._-]{0,62}[0-9A-Za-z])?$ ]]
      test -n "${GITHUB_PACKAGES_USER:-}"
      test -n "${GITHUB_PACKAGES_TOKEN:-}"
      test -n "${GITLAB_RELEASE_TOKEN:-}"
      mkdir -p output/ci
      release_args=(
        --sha "$RELEASE_SHA"
        --version "$RELEASE_VERSION"
        --customer "$RELEASE_CUSTOMER"
      )
      set +e
      node scripts/deploy/gitlab-release-candidate.mjs published "${release_args[@]}" --json
      published_status=$?
      set -e
      case "$published_status" in
        0)
          echo "[gitlab-ci] release=already-published sha=$RELEASE_SHA version=$RELEASE_VERSION"
          exit 0
          ;;
        3) ;;
        *) exit "$published_status" ;;
      esac

      node scripts/deploy/gitlab-strict-terminal-reuse.mjs \
        --sha "$RELEASE_SHA" \
        --out output/ci/reused-evidence \
        --json
      mapfile -t terminals < <(find "output/qa/exact-sha/$RELEASE_SHA" -maxdepth 1 -type f -name '*.json' ! -name '*.receipt.json' -print)
      test "${#terminals[@]}" -eq 1
      terminal="${terminals[0]}"

      artifact_dir="output/releases/$RELEASE_SHA"
      candidate_manifest=output/ci/release-candidate.json
      candidate_archive=output/ci/candidate.tar
      candidate_args=(
        "${release_args[@]}"
        --artifact-dir "$artifact_dir"
        --manifest-out "$candidate_manifest"
        --archive "$candidate_archive"
      )
      set +e
      node scripts/deploy/gitlab-release-candidate.mjs recover "${candidate_args[@]}" --json
      candidate_status=$?
      set -e
      case "$candidate_status" in
        0) ;;
        3)
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases?per_page=100&order_by=released_at&sort=desc" \
            > output/ci/release-version-catalog.json
          node scripts/deploy/release-version-catalog.mjs verify \
            --catalog output/ci/release-version-catalog.json \
            --reference "$RELEASE_VERSION_REFERENCE" \
            --observed-at "$CI_PIPELINE_CREATED_AT" \
            --requested "$RELEASE_VERSION" \
            --json
          test ! -e "$artifact_dir"
          node scripts/deploy/release-artifact-bundle.mjs \
            --execute \
            --ref "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --customer "$RELEASE_CUSTOMER" \
            --out "$artifact_dir" \
            --json
          node scripts/deploy/gitlab-release-candidate.mjs prepare "${candidate_args[@]}" --json
          if ! curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 7200 \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$candidate_archive" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/plush-release-candidate/artifact-$RELEASE_SHA/candidate.tar"; then
            echo "[gitlab-ci] candidate upload outcome is uncertain; verifying server digest"
          fi
          node scripts/deploy/gitlab-release-candidate.mjs verify "${candidate_args[@]}" --json
          ;;
        *) exit "$candidate_status" ;;
      esac

      rehearsal_receipt=output/ci/release-rehearsal.json
      rehearsal_args=(
        "${release_args[@]}"
        --artifact-dir "$artifact_dir"
        --receipt "$rehearsal_receipt"
      )
      set +e
      node scripts/deploy/gitlab-release-candidate.mjs recover-rehearsal "${rehearsal_args[@]}" --json
      rehearsal_status=$?
      set -e
      case "$rehearsal_status" in
        0) ;;
        3)
          node scripts/deploy/local-release-rehearsal.mjs \
            --execute \
            --manifest "$artifact_dir/release-artifact.json" \
            --receipt "$rehearsal_receipt" \
            --json
          node scripts/deploy/gitlab-release-candidate.mjs prepare-rehearsal "${rehearsal_args[@]}" --json
          if ! curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$rehearsal_receipt" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/plush-release-rehearsal/artifact-$RELEASE_SHA/receipt.json"; then
            echo "[gitlab-ci] rehearsal upload outcome is uncertain; verifying server digest"
          fi
          node scripts/deploy/gitlab-release-candidate.mjs verify-rehearsal "${rehearsal_args[@]}" --json
          ;;
        *) exit "$rehearsal_status" ;;
      esac

      if [[ -e "$artifact_dir/release-rehearsal.json" ]]; then
        cmp --silent "$rehearsal_receipt" "$artifact_dir/release-rehearsal.json"
      else
        cp -- "$rehearsal_receipt" "$artifact_dir/release-rehearsal.json"
      fi

      docker_config="$(mktemp -d)"
      export DOCKER_CONFIG="$docker_config"
      trap 'rm -rf "$docker_config"' EXIT
      printf '%s' "$GITHUB_PACKAGES_TOKEN" | docker login ghcr.io --username "$GITHUB_PACKAGES_USER" --password-stdin
      node scripts/deploy/github-release-publisher.mjs \
        --artifact-dir "$artifact_dir" \
        --strict-terminal "$terminal" \
        --rehearsal-receipt "$artifact_dir/release-rehearsal.json" \
        --version "$RELEASE_VERSION" \
        --repository "$CI_PROJECT_PATH" \
        --json
      node scripts/deploy/github-release-asset-set.mjs finalize \
        --dir "$artifact_dir" \
        --sha "$RELEASE_SHA" \
        --version "$RELEASE_VERSION" \
        --json > output/ci/release-assets.json

      package_version="artifact-$RELEASE_SHA"
      package_api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages"
      package_catalog=output/ci/release-package-catalog.json
      package_id_file=output/ci/release-package-id
      package_files=output/ci/release-package-files.json
      missing_assets=output/ci/release-missing-assets.txt
      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        "$package_api?package_type=generic&package_name=plush-release&package_version=$package_version&per_page=100" \
        > "$package_catalog"
      node scripts/deploy/gitlab-release-publication.mjs select \
        --catalog "$package_catalog" \
        --version "$package_version" \
        --package-id-out "$package_id_file" \
        --json
      package_id="$(tr -d '\n' < "$package_id_file")"
      if [[ -n "$package_id" ]]; then
        curl --fail --silent --show-error \
          --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
          "$package_api/$package_id/package_files?per_page=100" \
          > "$package_files"
      else
        printf '[]\n' > "$package_files"
      fi
      node scripts/deploy/gitlab-release-publication.mjs plan \
        --local output/ci/release-assets.json \
        --remote "$package_files" \
        --missing-out "$missing_assets" \
        --json
      while IFS= read -r asset; do
        test -n "$asset"
        curl --fail --silent --show-error \
          --retry 4 --retry-delay 3 --retry-all-errors \
          --connect-timeout 20 --max-time 7200 \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$artifact_dir/$asset" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/plush-release/$package_version/$asset"
      done < "$missing_assets"

      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        "$package_api?package_type=generic&package_name=plush-release&package_version=$package_version&per_page=100" \
        > "$package_catalog"
      node scripts/deploy/gitlab-release-publication.mjs select \
        --catalog "$package_catalog" \
        --version "$package_version" \
        --package-id-out "$package_id_file" \
        --json
      package_id="$(tr -d '\n' < "$package_id_file")"
      test -n "$package_id"
      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        "$package_api/$package_id/package_files?per_page=100" \
        > "$package_files"
      node scripts/deploy/gitlab-release-publication.mjs verify \
        --local output/ci/release-assets.json \
        --remote "$package_files" \
        --json

      release_api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$package_version"
      release_existing_json=output/ci/release-existing.json
      release_create_json=output/ci/release-create.json
      release_code="$(curl --silent --show-error --output "$release_existing_json" \
        --write-out '%{http_code}' \
        --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        "$release_api")"
      if [[ "$release_code" == "200" ]]; then
        test "$(jq -r .tag_name "$release_existing_json")" = "$package_version"
        test "$(jq -r .name "$release_existing_json")" = "$RELEASE_VERSION"
      elif [[ "$release_code" == "404" ]]; then
        jq -n \
          --arg name "$RELEASE_VERSION" \
          --arg tag "$package_version" \
          --arg ref "$RELEASE_SHA" \
          --arg description 'Immutable exact-SHA v2 seven-asset release. The published rehearsal receipt is the same receipt bound into the manifest. Target promotion and customer UAT remain separate evidence.' \
          '{name:$name,tag_name:$tag,ref:$ref,description:$description}' \
          > "$release_create_json"
        curl --fail --silent --show-error \
          --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
          --header 'Content-Type: application/json' \
          --data-binary @"$release_create_json" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      else
        echo "[gitlab-ci] release lookup failed status=$release_code"
        exit 1
      fi
      node scripts/deploy/gitlab-release-candidate.mjs published "${release_args[@]}" --json
