# Nginx 反向代理样例。证书路径和上游主机在受控运维配置中填写。
# 根域临时保留路径与查询参数，使用 302 跳转到未来可能的正式域名。
# admin.yoyoosun.net 已退役，本样例不再为它声明 server block。

server {
    listen 80;
    server_name yoyoosun.net;
    return 302 https://erp.yoyoosun.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yoyoosun.net;

    ssl_certificate /etc/nginx/certs/yoyoosun.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/yoyoosun.net/privkey.pem;

    return 302 https://erp.yoyoosun.net$request_uri;
}

server {
    listen 80;
    server_name erp.yoyoosun.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.yoyoosun.net;

    ssl_certificate /etc/nginx/certs/erp.yoyoosun.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/erp.yoyoosun.net/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
