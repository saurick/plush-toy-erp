name: GitHub Review Mirror CI

"on":
  pull_request:
  push:
    branches:
      - "review/gpt/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Quality scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DISPOSABLE_DATABASE_BASE_URL: postgres://postgres:ci-local-password@127.0.0.1:55432/postgres?sslmode=disable

jobs:
  plan:
    name: Trusted range and affected plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      effective_mode: ${{ steps.plan.outputs.effective_mode }}
      full: ${{ steps.plan.outputs.full }}
      make_data: ${{ steps.plan.outputs.make_data }}
      needs_atlas: ${{ steps.plan.outputs.needs_atlas }}
      needs_chromium: ${{ steps.plan.outputs.needs_chromium }}
      needs_go: ${{ steps.plan.outputs.needs_go }}
      needs_postgres: ${{ steps.plan.outputs.needs_postgres }}
      needs_system_tools: ${{ steps.plan.outputs.needs_system_tools }}
      needs_web: ${{ steps.plan.outputs.needs_web }}
      source_archive: ${{ steps.plan.outputs.source_archive }}
      range: ${{ steps.range.outputs.range }}
    steps:
      - name: Check out complete comparison history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the checksum-verified history scanner archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: Resolve range and scan candidate history before repository scripts
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          empty_tree="$(git hash-object -t tree /dev/null)"
          trusted_config_sha=HEAD
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA...HEAD"
            history_range="$(git merge-base "$PR_BASE_SHA" HEAD)..HEAD"
            trusted_config_sha="$PR_BASE_SHA"
            gate_mode=affected
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE_SHA" == "$zero" ]]; then
              range="$empty_tree..HEAD"
              history_range=HEAD
            elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}"; then
              range="$PUSH_BEFORE_SHA..HEAD"
              history_range="$range"
            else
              echo "[ci] push before SHA is unavailable: $PUSH_BEFORE_SHA"
              exit 1
            fi
            gate_mode=affected
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
              range="HEAD^..HEAD"
              history_range="$range"
            else
              range="$empty_tree..HEAD"
              history_range=HEAD
            fi
            gate_mode="$REQUESTED_MODE"
          else
            echo "[ci] unsupported event: $EVENT_NAME"
            exit 1
          fi
          if [[ "$gate_mode" != "affected" && "$gate_mode" != "full" ]]; then
            echo "[ci] unsupported gate mode: $gate_mode"
            exit 1
          fi
          git diff --check "$range"
          git log --check --format= "$history_range"
          trusted_config="$RUNNER_TEMP/trusted-gitleaks.toml"
          git show "$trusted_config_sha:.gitleaks.toml" > "$trusted_config"
          archive="$RUNNER_TEMP/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz"
          expected_archive_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [[ -f "$archive" ]] && ! echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict >/dev/null 2>&1; then
            rm -f "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            mkdir -p "$(dirname "$archive")"
            curl --fail --location --silent --show-error \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$archive"
          fi
          echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git \
            --config "$trusted_config" \
            --log-opts "$history_range" \
            --no-banner \
            --redact \
            "$GITHUB_WORKSPACE"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "gate_mode=$gate_mode" >> "$GITHUB_OUTPUT"
          echo "comparison_range=$range"
          echo "gate_mode=$gate_mode"
      - name: Set up repository Node.js after the trusted scan
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .n-node-version
      - name: Build the executable CI plan
        id: plan
        run: |
          set -euo pipefail
          node scripts/qa/ci-plan.mjs \
            --range "${{ steps.range.outputs.range }}" \
            --mode "${{ steps.range.outputs.gate_mode }}" \
            --github-output "$GITHUB_OUTPUT" \
            --out output/ci/plan.json
      - name: Persist the CI plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-plan-${{ github.sha }}
          path: output/ci/plan.json
          if-no-files-found: error
          retention-days: 30
  quality:
    name: Repository quality
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .n-node-version
      - name: 绑定 runner 本地依赖缓存路径
        run: |
          set -euo pipefail
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Set up Go when selected
        if: needs.plan.outputs.needs_go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up pinned Atlas when selected
        if: needs.plan.outputs.needs_atlas == 'true'
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.2.0
      - name: Restore pinned full-gate Go tools
        if: needs.plan.outputs.needs_system_tools == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin
          key: full-gate-go-tools-${{ runner.os }}-govulncheck-1.6.0-shfmt-3.13.1
      - name: Restore the checksum-verified full-gate scanner archive
        if: needs.plan.outputs.needs_system_tools == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: Restore the locked pnpm store
        if: needs.plan.outputs.needs_web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-${{ runner.os }}-10.13.1-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright Chromium bundle
        if: needs.plan.outputs.needs_chromium == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Start PostgreSQL only when selected
        if: needs.plan.outputs.needs_postgres == 'true'
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name plush-ci-postgres \
            --env POSTGRES_PASSWORD=ci-local-password \
            --publish 55432:5432 \
            --health-cmd 'pg_isready -U postgres' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:18.1
          for attempt in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' plush-ci-postgres)"
            if [[ "$health" == "healthy" ]]; then
              echo "[ci] PostgreSQL is ready after attempt=$attempt"
              exit 0
            fi
            if [[ "$health" == "unhealthy" ]]; then
              echo "[ci] PostgreSQL became unhealthy"
              exit 1
            fi
            sleep 2
          done
          echo "[ci] PostgreSQL readiness timed out"
          exit 1
      - name: Install full-gate system and Go tools
        if: needs.plan.outputs.needs_system_tools == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lsof postgresql-client ripgrep shellcheck yamllint
          archive="$RUNNER_TEMP/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz"
          expected_archive_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [[ -f "$archive" ]] && ! echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict >/dev/null 2>&1; then
            rm -f "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            mkdir -p "$(dirname "$archive")"
            curl --fail --location --silent --show-error \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$archive"
          fi
          echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          go_bin="$(go env GOPATH)/bin"
          if [[ ! -x "$go_bin/govulncheck" ]]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          if [[ ! -x "$go_bin/shfmt" ]]; then
            go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          fi
          echo "$go_bin" >> "$GITHUB_PATH"
      - name: Install locked Web dependencies when selected
        if: needs.plan.outputs.needs_web == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm install --global pnpm@10.13.1
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
      - name: Audit production Web dependencies when selected
        if: needs.plan.outputs.needs_web == 'true'
        working-directory: web
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: Install and verify Chromium only for full
        if: needs.plan.outputs.needs_chromium == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          chrome_path="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          if [[ ! -x "$chrome_path" ]]; then
            echo "[ci] Playwright Chromium is not executable: $chrome_path"
            exit 1
          fi
          sandbox_source="$(dirname "$chrome_path")/chrome_sandbox"
          sandbox_path="/usr/local/sbin/chrome-devel-sandbox"
          if [[ ! -f "$sandbox_source" ]]; then
            echo "[ci] Playwright Chromium SUID sandbox helper is missing: $sandbox_source"
            exit 1
          fi
          sudo install -o root -g root -m 4755 "$sandbox_source" "$sandbox_path"
          sandbox_owner="$(stat -c '%U:%G' "$sandbox_path")"
          sandbox_mode="$(stat -c '%a' "$sandbox_path")"
          if [[ "$sandbox_owner" != "root:root" || "$sandbox_mode" != "4755" ]]; then
            echo "[ci] Chromium SUID sandbox helper is invalid: owner=$sandbox_owner mode=$sandbox_mode"
            exit 1
          fi
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"
          echo "ERP_PDF_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Prove Ent and Atlas generation when selected
        if: needs.plan.outputs.make_data == 'true'
        working-directory: server
        run: |
          set -euo pipefail
          make data
          status="$(git -C .. status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "[ci] make data changed the committed tree"
            exit 1
          fi
      - name: Run the selected repository quality gate
        env:
          QA_BASE_RANGE: ${{ needs.plan.outputs.range }}
          REQUESTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.effective_mode }}" == "affected" ]]; then
            bash scripts/qa/affected.sh --base "$QA_BASE_RANGE" --run
          else
            node scripts/qa/run-gate-with-receipt.mjs --gate full
          fi
      - name: Validate committed source archive for full
        if: needs.plan.outputs.source_archive == 'true'
        run: |
          set -euo pipefail
          node scripts/deploy/source-archive-release-check.mjs --light --ref HEAD
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "[ci] quality gate changed the committed tree"
            exit 1
          fi
      - name: Persist full quality receipt
        if: >-
          always() &&
          needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-receipt-${{ github.sha }}
          path: output/dev-workbench/receipts/full-latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove selected PostgreSQL runtime
        if: always() && needs.plan.outputs.needs_postgres == 'true'
        run: |
          set -euo pipefail
          if docker inspect plush-ci-postgres >/dev/null 2>&1; then
            docker rm --force plush-ci-postgres >/dev/null
          fi

  ci_gate:
    name: CI Gate
    if: always()
    needs:
      - plan
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require planning and selected quality to complete
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "[ci] plan=$PLAN_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi
          echo "[ci] status=complete plan=$PLAN_RESULT quality=$QUALITY_RESULT"
