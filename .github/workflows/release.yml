name: Immutable Release

"on":
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character SHA at current main
        required: true
        type: string
      version:
        description: Unique human-readable release version
        required: true
        type: string
      customer:
        description: Product Core customer package
        required: true
        default: yoyoosun
        type: choice
        options:
          - yoyoosun

permissions:
  actions: read
  contents: read

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  validate:
    name: Release trust and strict terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_reused: ${{ steps.identity.outputs.release_reused }}
      strict_reused: ${{ steps.recover.outputs.strict_reused }}
      strict_run_id: ${{ steps.recover.outputs.strict_run_id }}
      strict_artifact_digest: ${{ steps.recover.outputs.strict_artifact_digest }}
      refresh_checks: ${{ steps.recover.outputs.refresh_checks }}
    steps:
      - name: Check out the requested exact SHA without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .n-node-version
      - name: Validate current-main identity and complete existing release
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CUSTOMER: ${{ inputs.customer }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[release] SHA must be 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9A-Za-z]([0-9A-Za-z._-]{0,62}[0-9A-Za-z])?$ ]]; then
            echo "[release] version is invalid"
            exit 1
          fi
          if [[ "$REQUESTED_CUSTOMER" != "yoyoosun" ]]; then
            echo "[release] only the fixed yoyoosun customer package is allowed"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$head_sha" != "$REQUESTED_SHA" || "$WORKFLOW_SHA" != "$REQUESTED_SHA" || "$main_sha" != "$REQUESTED_SHA" ]]; then
            echo "[release] identity mismatch head=$head_sha workflow=$WORKFLOW_SHA main=$main_sha requested=$REQUESTED_SHA"
            exit 1
          fi
          release_tag="artifact-$REQUESTED_SHA"
          echo "RELEASE_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CUSTOMER=$REQUESTED_CUSTOMER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          catalog="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add' > "$catalog"
          identity_out="$RUNNER_TEMP/release-identity.env"
          node scripts/deploy/github-release-asset-set.mjs identity \
            --catalog "$catalog" \
            --sha "$REQUESTED_SHA" \
            --version "$REQUESTED_VERSION" \
            --github-output "$identity_out"
          source "$identity_out"
          release_reused=false
          if [[ "$state" == "published" ]]; then
            verify_dir="$RUNNER_TEMP/existing-release"
            mkdir -p "$verify_dir"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern checksums.sha256 \
              --pattern release-artifact.json \
              --pattern release-manifest.json \
              --pattern sbom.cdx.json \
              --dir "$verify_dir"
            node scripts/deploy/github-release-asset-set.mjs verify-existing \
              --dir "$verify_dir" \
              --catalog "$catalog" \
              --sha "$REQUESTED_SHA" \
              --version "$REQUESTED_VERSION"
            release_reused=true
          fi
          echo "release_reused=$release_reused" >> "$GITHUB_OUTPUT"
          echo "[release] state=$state reused=$release_reused tag=$release_tag"
      - name: Recover a provenance-bound strict terminal before heavy setup
        if: steps.identity.outputs.release_reused != 'true'
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/strict-reuse.json"
          node scripts/deploy/github-strict-terminal-reuse.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            --out "output/qa/exact-sha/$RELEASE_SHA" \
            --json > "$result"
          strict_reused="$(jq -r '.reused' "$result")"
          if [[ "$strict_reused" != "true" && "$strict_reused" != "false" ]]; then
            echo "[release] strict reuse result is invalid"
            exit 1
          fi
          echo "strict_reused=$strict_reused" >> "$GITHUB_OUTPUT"
          echo "strict_run_id=$(jq -r '.runId // ""' "$result")" >> "$GITHUB_OUTPUT"
          echo "strict_artifact_digest=$(jq -r '.artifactDigest // ""' "$result")" >> "$GITHUB_OUTPUT"
          echo "refresh_checks=$(jq -r '.refreshChecks | join(",")' "$result")" >> "$GITHUB_OUTPUT"
          cat "$result"
      - name: Set up Go only for an expired vulnerability database receipt
        if: >-
          steps.recover.outputs.strict_reused == 'true' &&
          contains(steps.recover.outputs.refresh_checks, 'vulnerabilityDatabase')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Refresh only the expired vulnerability database check
        if: >-
          steps.recover.outputs.strict_reused == 'true' &&
          contains(steps.recover.outputs.refresh_checks, 'vulnerabilityDatabase')
        run: |
          set -euo pipefail
          go_bin="$(go env GOPATH)/bin"
          if [[ ! -x "$go_bin/govulncheck" ]]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          export PATH="$go_bin:$PATH"
          node scripts/qa/exact-sha-gate.mjs \
            --sha "$RELEASE_SHA" \
            --main-ref origin/main \
            --refresh-check vulnerabilityDatabase
      - name: Pass the recovered terminal to publish
        if: steps.recover.outputs.strict_reused == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strict-terminal-current-${{ inputs.sha }}
          path: output/qa/exact-sha/${{ inputs.sha }}
          if-no-files-found: error
          retention-days: 7

  strict:
    name: Exact-SHA strict quality
    needs: validate
    if: needs.validate.outputs.release_reused != 'true' && needs.validate.outputs.strict_reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DISPOSABLE_DATABASE_BASE_URL: postgres://postgres:ci-local-password@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - name: Check out the exact SHA without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .n-node-version
      - name: 绑定 runner 本地依赖缓存路径
        run: |
          set -euo pipefail
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up pinned Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v0.38.0
      - name: Restore pinned strict-gate Go tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/bin
          key: strict-gate-go-tools-${{ runner.os }}-govulncheck-1.6.0-shfmt-3.13.1
      - name: Restore the checksum-verified strict scanner archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: Restore the locked pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-${{ runner.os }}-10.13.1-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright Chromium bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install strict dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lsof postgresql-client ripgrep shellcheck unzip yamllint
          npm install --global pnpm@10.13.1
          archive="$RUNNER_TEMP/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz"
          expected_archive_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [[ -f "$archive" ]] && ! echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict >/dev/null 2>&1; then
            rm -f "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            mkdir -p "$(dirname "$archive")"
            curl --fail --location --silent --show-error \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$archive"
          fi
          echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          go_bin="$(go env GOPATH)/bin"
          if [[ ! -x "$go_bin/govulncheck" ]]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          if [[ ! -x "$go_bin/shfmt" ]]; then
            go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          fi
          echo "$go_bin" >> "$GITHUB_PATH"
      - name: Install Web dependencies and Chromium
        working-directory: web
        run: |
          set -euo pipefail
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          chrome_path="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          if [[ ! -x "$chrome_path" ]]; then
            echo "[release] Playwright Chromium is not executable: $chrome_path"
            exit 1
          fi
          sandbox_source="$(dirname "$chrome_path")/chrome_sandbox"
          sandbox_path="/usr/local/sbin/chrome-devel-sandbox"
          if [[ ! -f "$sandbox_source" ]]; then
            echo "[release] Chromium SUID sandbox helper is missing: $sandbox_source"
            exit 1
          fi
          sudo install -o root -g root -m 4755 "$sandbox_source" "$sandbox_path"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"
          echo "ERP_PDF_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Reconfirm exact current-main identity
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$WORKFLOW_SHA" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
      - name: Prove Ent and Atlas generation has zero drift
        working-directory: server
        run: |
          set -euo pipefail
          make data
          status="$(git -C .. status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "[release] make data changed the committed tree"
            exit 1
          fi
      - name: Run the exact-SHA strict terminal once
        run: node scripts/qa/exact-sha-gate.mjs --sha "${{ inputs.sha }}" --main-ref origin/main --run
      - name: Persist the canonical exact-SHA terminal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strict-terminal-${{ inputs.sha }}
          path: output/qa/exact-sha/${{ inputs.sha }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish immutable artifact set
    needs:
      - validate
      - strict
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.release_reused != 'true' &&
      (needs.validate.outputs.strict_reused == 'true' || needs.strict.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out the exact SHA without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .n-node-version
      - name: Set up pinned Buildx for the shared release graph
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Restore the checksum-verified source scanner archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: Download the recovered strict terminal
        if: needs.validate.outputs.strict_reused == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: strict-terminal-current-${{ inputs.sha }}
          path: output/qa/exact-sha/${{ inputs.sha }}
      - name: Download the newly executed strict terminal
        if: needs.validate.outputs.strict_reused != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: strict-terminal-${{ inputs.sha }}
          path: output/qa/exact-sha/${{ inputs.sha }}
      - name: Reverify exact identity and terminal integrity
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$WORKFLOW_SHA" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          node scripts/qa/exact-sha-gate.mjs --sha "$REQUESTED_SHA" --main-ref origin/main --json
      - name: Install the pinned source-package scanner
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tool-cache/gitleaks_8.30.1_linux_x64.tar.gz"
          expected_archive_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [[ -f "$archive" ]] && ! echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict >/dev/null 2>&1; then
            rm -f "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            mkdir -p "$(dirname "$archive")"
            curl --fail --location --silent --show-error \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$archive"
          fi
          echo "$expected_archive_sha  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build each runtime once and publish images by digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CUSTOMER: ${{ inputs.customer }}
          RELEASE_BUILDKIT_CACHE_MODE: gha
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          node scripts/deploy/release-artifact-bundle.mjs \
            --execute \
            --ref "$RELEASE_SHA" \
            --customer "$RELEASE_CUSTOMER" \
            --out "output/releases/$RELEASE_SHA" \
            --json
          terminal="$(find "output/qa/exact-sha/$RELEASE_SHA" -maxdepth 1 -type f -name '*.json' ! -name '*.receipt.json' -print -quit)"
          if [[ -z "$terminal" ]]; then
            echo "[release] exact-SHA terminal is missing"
            exit 1
          fi
          node scripts/deploy/github-release-publisher.mjs \
            --artifact-dir "output/releases/$RELEASE_SHA" \
            --strict-terminal "$terminal" \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --json
          node scripts/deploy/github-release-asset-set.mjs finalize \
            --dir "output/releases/$RELEASE_SHA" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION"
      - name: Create or resume a verified draft, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_tag="artifact-$RELEASE_SHA"
          artifact_dir="output/releases/$RELEASE_SHA"
          catalog="$RUNNER_TEMP/releases.json"
          plan_file="$RUNNER_TEMP/release-plan.env"
          fetch_catalog() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add' > "$catalog"
          }
          read_plan() {
            rm -f "$plan_file"
            node scripts/deploy/github-release-asset-set.mjs plan \
              --dir "$artifact_dir" \
              --catalog "$catalog" \
              --sha "$RELEASE_SHA" \
              --version "$RELEASE_VERSION" \
              --github-output "$plan_file"
            source "$plan_file"
          }
          wait_for_plan() {
            expected_state="$1"
            missing_mode="$2"
            for attempt in 1 2 3 4 5 6; do
              fetch_catalog
              read_plan
              if [[ "$state" == "$expected_state" ]]; then
                if [[ "$missing_mode" == "any" || -z "$missing_assets" ]]; then
                  return 0
                fi
              fi
              if [[ "$attempt" != "6" ]]; then
                echo "[release] waiting for GitHub release catalog state=$expected_state missing_mode=$missing_mode attempt=$attempt"
                sleep 2
              fi
            done
            echo "[release] GitHub release catalog did not converge: expected_state=$expected_state missing_mode=$missing_mode actual_state=$state missing_assets=$missing_assets"
            return 1
          }
          fetch_catalog
          read_plan
          if [[ "$state" == "missing" ]]; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_VERSION" \
              --notes "Immutable exact-SHA release. Target promotion, migration, role smoke and customer UAT remain separate evidence." \
              --draft
            wait_for_plan draft any
          fi
          if [[ "$state" == "published" ]]; then
            node scripts/deploy/github-release-asset-set.mjs verify-published \
              --dir "$artifact_dir" --catalog "$catalog" --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"
            exit 0
          fi
          if [[ "$state" != "draft" ]]; then
            echo "[release] expected a resumable draft, got $state"
            exit 1
          fi
          IFS=',' read -r -a missing <<< "$missing_assets"
          for asset in "${missing[@]}"; do
            [[ -z "$asset" ]] && continue
            case "$asset" in
              checksums.sha256|release-artifact.json|release-manifest.json|sbom.cdx.json|server-image.tar|web-image.tar) ;;
              *) echo "[release] unsafe missing asset: $asset"; exit 1 ;;
            esac
            gh release upload "$release_tag" "$artifact_dir/$asset" --repo "$GITHUB_REPOSITORY"
          done
          wait_for_plan draft empty
          verify_dir="$RUNNER_TEMP/release-download-verify"
          mkdir -p "$verify_dir"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.sha256 \
            --pattern release-artifact.json \
            --pattern release-manifest.json \
            --pattern sbom.cdx.json \
            --dir "$verify_dir"
          for asset in checksums.sha256 release-artifact.json release-manifest.json sbom.cdx.json; do
            cmp --silent "$artifact_dir/$asset" "$verify_dir/$asset"
          done
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false
          wait_for_plan published empty
          node scripts/deploy/github-release-asset-set.mjs verify-published \
            --dir "$artifact_dir" \
            --catalog "$catalog" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION"
