log_format plush_workbench_safe escape=json '{"request_id":"$request_id","time":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time}';

server {
    listen 80;
    listen [::]:80;
    server_name workbench.saurick.me;
    return 301 https://workbench.saurick.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.saurick.me;
    ssl_certificate /etc/nginx/certs/saurick.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/saurick.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != $host) { return 421; }
    if ($host != "workbench.saurick.me") { return 421; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/plush-workbench-access.log plush_workbench_safe;
    error_log /var/log/nginx/plush-workbench-error.log;
    client_max_body_size 16m;
    location / {
        proxy_pass http://10.252.70.2:15300;
        proxy_http_version 1.1;
        proxy_set_header Host workbench.saurick.me;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
    }
}
