# Jaeger v2 uses the OpenTelemetry Collector configuration model. This keeps
# the existing single-node, in-memory trace boundary while preserving the
# OTLP, Jaeger, Zipkin, query UI and external Prometheus query endpoints.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: trace_store
      metrics: metrics_store
  jaeger_storage:
    backends:
      trace_store:
        memory:
          max_traces: 100000
    metric_backends:
      metrics_store:
        prometheus:
          endpoint: "${env:PROMETHEUS_SERVER_URL:-http://host.docker.internal:3004}"
          normalize_calls: true
          normalize_duration: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: trace_store
