#cloud-config
package_update: true
package_upgrade: false
ssh_pwauth: false
disable_root: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - fonts-freefont-ttf
  - fonts-ipafont-gothic
  - fonts-liberation
  - fonts-noto-color-emoji
  - fonts-tlwg-loma-otf
  - fonts-unifont
  - fonts-wqy-zenhei
  - git
  - jq
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libfontconfig1
  - libfreetype6
  - libgbm1
  - libglib2.0-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libpq-dev
  - lsof
  - postgresql-client
  - ripgrep
  - shellcheck
  - tar
  - unzip
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
  - xfonts-cyrillic
  - xfonts-scalable
  - xvfb
  - xz-utils
  - yamllint
  - zstd

users:
  - default
  - name: gitlab-runner
    system: true
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /etc/sysctl.d/99-plush-runner.conf
    permissions: '0644'
    content: |
      kernel.unprivileged_userns_clone=1
      fs.inotify.max_user_watches=524288
  - path: /etc/sudoers.d/90-plush-runner-ci
    permissions: '0440'
    content: |
      gitlab-runner ALL=(root) NOPASSWD: /usr/bin/install
  - path: /usr/local/sbin/plush-runner-toolchain
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      download_file() {
        local url="$1"
        local output="$2"
        curl \
          --fail \
          --location \
          --silent \
          --show-error \
          --connect-timeout 20 \
          --max-time 300 \
          --retry 5 \
          --retry-delay 5 \
          --retry-max-time 900 \
          --retry-all-errors \
          --remove-on-error \
          --output "$output" \
          "$url"
      }

      retry_command() {
        local attempt
        for attempt in 1 2 3; do
          if timeout --signal=TERM 15m "$@"; then
            return 0
          fi
          if ((attempt == 3)); then
            return 1
          fi
          sleep $((attempt * 5))
        done
      }

      arch=linux-x64
      node_version=24.14.0
      go_version=1.26.6
      pnpm_version=10.13.1
      runner_version=19.3.0
      node_archive="node-v${node_version}-${arch}.tar.xz"
      work="$(mktemp -d)"
      trap 'rm -rf "$work"' EXIT
      download_file "https://nodejs.org/dist/v${node_version}/${node_archive}" "$work/$node_archive"
      echo "41cd79bb7877c81605a9e68ec4c91547774f46a40c67a17e34d7179ef11729df  $work/$node_archive" | sha256sum --check --strict
      rm -rf /opt/node
      install -d -m 0755 /opt/node
      tar -xJf "$work/$node_archive" --strip-components=1 -C /opt/node
      ln -sfn /opt/node/bin/node /usr/local/bin/node
      ln -sfn /opt/node/bin/npm /usr/local/bin/npm
      ln -sfn /opt/node/bin/npx /usr/local/bin/npx
      ln -sfn /opt/node/bin/corepack /usr/local/bin/corepack
      pnpm_archive="pnpm-${pnpm_version}.tgz"
      download_file "https://registry.npmjs.org/pnpm/-/${pnpm_archive}" "$work/$pnpm_archive"
      echo "37ebf1a5c7a30d5fabe0c5df44ee8da4c965ca0c5af3dbab28c3a1681b70a256218d05c81c9c0dcf767ef6b8551eb5b960042b9ed4300c59242336377e01cfad  $work/$pnpm_archive" | sha512sum --check --strict
      rm -rf /opt/pnpm
      install -d -m 0755 /opt/pnpm
      tar -xzf "$work/$pnpm_archive" --strip-components=1 -C /opt/pnpm
      chmod 0755 /opt/pnpm/bin/pnpm.cjs /opt/pnpm/bin/pnpx.cjs
      ln -sfn /opt/pnpm/bin/pnpm.cjs /usr/local/bin/pnpm
      ln -sfn /opt/pnpm/bin/pnpx.cjs /usr/local/bin/pnpx
      go_archive="go${go_version}.linux-amd64.tar.gz"
      download_file "https://go.dev/dl/${go_archive}" "$work/$go_archive"
      echo "708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89  $work/$go_archive" | sha256sum --check --strict
      rm -rf /usr/local/go
      tar -xzf "$work/$go_archive" -C /usr/local
      ln -sfn /usr/local/go/bin/go /usr/local/bin/go
      retry_command env GOBIN=/usr/local/bin go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      retry_command env GOBIN=/usr/local/bin go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
      download_file https://atlasgo.sh "$work/atlas-install.sh"
      echo "d2377154c7af848813fc763ad75d6c0564cdca806163ea61ad4fb634a8736751  $work/atlas-install.sh" | sha256sum --check --strict
      retry_command env ATLAS_VERSION=v1.2.0 bash "$work/atlas-install.sh" -y
      gitleaks_archive=gitleaks_8.30.1_linux_x64.tar.gz
      download_file "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$gitleaks_archive" "$work/$gitleaks_archive"
      echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/$gitleaks_archive" | sha256sum --check --strict
      tar -xzf "$work/$gitleaks_archive" -C /usr/local/bin gitleaks
      chmod 0755 /usr/local/bin/gitleaks
      runner_url="https://gitlab-runner-downloads.s3.amazonaws.com/v${runner_version}/binaries/gitlab-runner-linux-amd64"
      download_file "$runner_url" "$work/gitlab-runner-linux-amd64"
      echo "9b642c14742b5db8622352c85f809ae6a588b6885a7d1a24caf8547e73eea7c9  $work/gitlab-runner-linux-amd64" | sha256sum --check --strict
      install -o root -g root -m 0755 "$work/gitlab-runner-linux-amd64" /usr/local/bin/gitlab-runner
      test "$(node --version)" = v24.14.0
      test "$(go env GOVERSION)" = go1.26.6
      test "$(pnpm --version)" = 10.13.1
  - path: /usr/local/sbin/plush-verify-runner-bootstrap
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      test "$(node --version)" = v24.14.0
      test "$(go env GOVERSION)" = go1.26.6
      test "$(pnpm --version)" = 10.13.1
      test "$(runuser -u gitlab-runner -- /usr/local/bin/pnpm --version)" = 10.13.1
      atlas version | head -n 1 | grep -Eq 'version v?1[.]2[.]0([[:space:]]|$)'
      test "$(gitleaks version)" = 8.30.1
      test "$(gitlab-runner --version | awk '$1 == "Version:" {print $2; exit}')" = 19.3.0
      govulncheck -version | grep -Fqx 'Scanner: govulncheck@v1.6.0'
      test "$(shfmt --version)" = v3.13.1
      test "$(systemctl is-active docker)" = active
      systemctl cat gitlab-runner.service >/dev/null
      test "$(systemctl is-active gitlab-runner 2>/dev/null || true)" = inactive
      test "$(systemctl is-enabled gitlab-runner 2>/dev/null || true)" = disabled
      test -x /usr/local/sbin/plush-register-gitlab-runner
      test ! -e /etc/plush-runner/registration.env
  - path: /usr/local/sbin/plush-bootstrap-gitlab-runner
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      systemctl enable --now docker
      /usr/local/sbin/plush-runner-toolchain
      install -d -o gitlab-runner -g gitlab-runner -m 0700 /home/gitlab-runner
      gitlab-runner install --user=gitlab-runner --working-directory=/home/gitlab-runner
      systemctl disable --now gitlab-runner
      install -d -o root -g root -m 0700 /etc/plush-runner
      /usr/local/sbin/plush-verify-runner-bootstrap
      echo "Runner toolchain ready. Place a 0600 registration.env and run /usr/local/sbin/plush-register-gitlab-runner."
  - path: /usr/local/sbin/plush-register-gitlab-runner
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      env_file=/etc/plush-runner/registration.env
      test -f "$env_file"
      test "$(stat -c %a "$env_file")" = 600
      # shellcheck disable=SC1090
      source "$env_file"
      : "${GITLAB_RUNNER_TOKEN:?missing GITLAB_RUNNER_TOKEN}"
      gitlab-runner register --non-interactive \
        --url https://gitlab.saurick.me \
        --token "$GITLAB_RUNNER_TOKEN" \
        --name r640-kvm-isolated-shell \
        --executor shell \
        --tag-list plush,isolated,amd64 \
        --run-untagged=false \
        --locked=true
      chown root:root /etc/gitlab-runner/config.toml
      chmod 0600 /etc/gitlab-runner/config.toml
      shred -u "$env_file"
      systemctl enable --now gitlab-runner

runcmd:
  - [bash, -lc, '/usr/local/sbin/plush-bootstrap-gitlab-runner']

final_message: "Dedicated plush GitLab Runner VM bootstrap finished. Registration remains fail-closed until the protected token file is supplied."
